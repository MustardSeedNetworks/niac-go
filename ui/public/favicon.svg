<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="NIAC - Network In A Can">
  <title>NIAC - Network In A Can</title>
  <!-- Background tile, rounded -->
  <rect x="0" y="0" width="64" height="64" rx="12" fill="#2d7a3e"/>
  <!-- Tin-can body -->
  <rect x="14" y="18" width="36" height="36" rx="3" fill="#fafaf7" stroke="#1f5a2c" stroke-width="1.5"/>
  <!-- Can lid (top rim) -->
  <ellipse cx="32" cy="18" rx="18" ry="4" fill="#e8efe9" stroke="#1f5a2c" stroke-width="1.5"/>
  <!-- Can lid highlight -->
  <ellipse cx="32" cy="17" rx="14" ry="2" fill="#fafaf7" opacity="0.6"/>
  <!-- Can bottom rim shadow -->
  <ellipse cx="32" cy="54" rx="18" ry="3" fill="#1f5a2c" opacity="0.18"/>
  <!-- Connecting lines between devices (drawn before nodes so nodes sit on top) -->
  <g stroke="#2d7a3e" stroke-width="1.6" stroke-linecap="round">
    <line x1="22" y1="32" x2="32" y2="28"/>
    <line x1="32" y1="28" x2="42" y2="32"/>
    <line x1="22" y1="32" x2="32" y2="44"/>
    <line x1="42" y1="32" x2="32" y2="44"/>
  </g>
  <!-- Device nodes inside the can (router/switch/host) -->
  <circle cx="32" cy="28" r="3.5" fill="#2d7a3e"/>
  <circle cx="22" cy="32" r="3.5" fill="#2d7a3e"/>
  <circle cx="42" cy="32" r="3.5" fill="#2d7a3e"/>
  <circle cx="32" cy="44" r="3.5" fill="#2d7a3e"/>
</svg>
