# Dell Network Configuration Example
# Dell EMC N-Series and S-Series switches with LLDP and SNMP walk files

include_path: ".."

devices:
  # Dell N3248TE-ON Access Switch
  - name: dell-n3248-01
    type: switch
    mac: "f4:8e:38:a1:b2:01"
    ip: "10.30.0.1"

    snmp_agent:
      community: "public"
      walk_file: "device_walks_sanitized/dell/niac-dell-n3248te-on.walk"

    lldp:
      enabled: true
      advertise_interval: 30
      ttl: 120
      system_description: "Dell EMC Networking N3248TE-ON, 6.5.4.4, Linux 4.19.118"
      port_description: "TenGigabitEthernet1/0/1"
      chassis_id_type: "mac"

    trunk_ports:
      - interface: "TenGigabitEthernet1/0/49"
        vlans: [1, 10, 20, 30]
        native_vlan: 1
        remote_device: "dell-s5248-01"
        remote_interface: "ethernet1/1/1"

  # Dell S5248F-ON Distribution Switch
  - name: dell-s5248-01
    type: switch
    mac: "f4:8e:38:a1:b2:02"
    ip: "10.30.1.1"

    snmp_agent:
      community: "public"
      walk_file: "device_walks_sanitized/dell/niac-dell-s5248f-on.walk"

    lldp:
      enabled: true
      advertise_interval: 30
      ttl: 120
      system_description: "Dell EMC Networking S5248F-ON, OS10 Enterprise, 10.5.3.4"
      port_description: "ethernet1/1/1"
      chassis_id_type: "mac"

    trunk_ports:
      - interface: "ethernet1/1/1"
        vlans: [1, 10, 20, 30]
        native_vlan: 1
        remote_device: "dell-n3248-01"
        remote_interface: "TenGigabitEthernet1/0/49"
