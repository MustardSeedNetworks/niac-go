# Fortinet Security Configuration Example
# FortiSwitch and FortiGate with LLDP and SNMP walk files

include_path: ".."

devices:
  # FortiSwitch 448E-FPOE
  - name: fortiswitch-448e-01
    type: router
    mac: "70:4c:a5:a1:b2:01"
    ip: "10.40.0.1"

    snmp_agent:
      community: "public"
      walk_file: "device_walks_sanitized/fortinet/niac-fortinet-fs-448e-fpoe.walk"

    lldp:
      enabled: true
      advertise_interval: 30
      ttl: 120
      system_description: "FortiSwitch-448E-FPOE v7.2.4, build0453"
      port_description: "port1"
      chassis_id_type: "mac"

    trunk_ports:
      - interface: "port49"
        vlans: [1, 10, 20, 100]
        native_vlan: 1
        remote_device: "fortigate-600e-01"
        remote_interface: "port1"

  # FortiGate 600E (Security Gateway)
  - name: fortigate-600e-01
    type: router
    mac: "70:4c:a5:a1:b2:02"
    ip: "10.40.1.1"

    snmp_agent:
      community: "public"
      walk_file: "device_walks_sanitized/fortinet/niac-fortinet-gs2-firewall-114.walk"

    lldp:
      enabled: true
      advertise_interval: 30
      ttl: 120
      system_description: "FortiGate-600E v7.4.1, build1637"
      port_description: "port1"
      chassis_id_type: "mac"

    trunk_ports:
      - interface: "port1"
        vlans: [1, 10, 20, 100]
        native_vlan: 1
        remote_device: "fortiswitch-448e-01"
        remote_interface: "port49"
