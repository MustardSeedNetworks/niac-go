# Multi-Vendor Campus Configuration Example
# Demonstrates walk_files array and community_includes across 5 vendors

include_path: ".."

devices:
  # Cisco C9300 Core (demonstrates walk_files array + community_includes)
  - name: cisco-c9300-core
    type: switch
    mac: "00:1a:2b:c9:30:01"
    ip: "10.100.0.1"

    snmp_agent:
      community: "public"
      walk_files:
        - "device_walks_sanitized/cisco/niac-cisco-c9300-48p.walk"
        - "device_walks_sanitized/cisco/niac-cisco-c3850-48p.walk"
      community_includes:
        - community: "private"
          walk_file: "device_walks_sanitized/cisco/niac-cisco-c3750-16.walk"

    lldp:
      enabled: true
      advertise_interval: 30
      ttl: 120
      system_description: "Cisco IOS XE Software, Catalyst 9300 Software (CAT9K_IOSXE), Version 17.6.5"
      port_description: "TenGigabitEthernet1/1/1"
      chassis_id_type: "mac"

    cdp:
      enabled: true
      advertise_interval: 60
      holdtime: 180
      version: 2
      software_version: "Cisco IOS XE Software, Version 17.6.5"
      platform: "C9300-48P"
      port_id: "TenGigabitEthernet1/1/1"

    trunk_ports:
      - interface: "TenGigabitEthernet1/1/1"
        vlans: [1, 10, 20, 30, 40, 50]
        native_vlan: 1
        remote_device: "arista-7050-dist"
        remote_interface: "Ethernet1/1"
      - interface: "TenGigabitEthernet1/1/2"
        vlans: [1, 10, 20, 30, 40, 50]
        native_vlan: 1
        remote_device: "extreme-x465-dist"
        remote_interface: "1:49"

  # Arista 7050 Distribution
  - name: arista-7050-dist
    type: switch
    mac: "00:1c:73:70:50:01"
    ip: "10.100.1.1"

    snmp_agent:
      community: "public"
      walk_file: "device_walks_sanitized/arista/niac-arista-7050sx3-48yc12.walk"

    lldp:
      enabled: true
      advertise_interval: 30
      ttl: 120
      system_description: "Arista Networks EOS version 4.28.3M running on DCS-7050SX3-48YC12"
      port_description: "Ethernet1/1"
      chassis_id_type: "mac"

    trunk_ports:
      - interface: "Ethernet1/1"
        vlans: [1, 10, 20, 30, 40, 50]
        native_vlan: 1
        remote_device: "cisco-c9300-core"
        remote_interface: "TenGigabitEthernet1/1/1"
      - interface: "Ethernet2/1"
        vlans: [1, 10, 20]
        native_vlan: 1
        remote_device: "juniper-ex4300-access"
        remote_interface: "ge-0/0/47"

  # Extreme X465 Distribution
  - name: extreme-x465-dist
    type: switch
    mac: "00:04:96:04:65:01"
    ip: "10.100.2.1"

    snmp_agent:
      community: "public"
      walk_file: "device_walks_sanitized/extreme/niac-extreme-x465-48w.walk"

    lldp:
      enabled: true
      advertise_interval: 30
      ttl: 120
      system_description: "ExtremeXOS version 32.1.1.6 on X465-48W"
      port_description: "1:49"
      chassis_id_type: "mac"

    edp:
      enabled: true
      advertise_interval: 30
      version_string: "ExtremeXOS version 32.1.1.6"
      display_string: "X465-48W Distribution"

    trunk_ports:
      - interface: "1:49"
        vlans: [1, 10, 20, 30, 40, 50]
        native_vlan: 1
        remote_device: "cisco-c9300-core"
        remote_interface: "TenGigabitEthernet1/1/2"
      - interface: "1:50"
        vlans: [1, 30, 40]
        native_vlan: 1
        remote_device: "dell-n3248-access"
        remote_interface: "TenGigabitEthernet1/0/49"

  # Juniper EX4300 Access
  - name: juniper-ex4300-access
    type: switch
    mac: "00:05:86:43:00:01"
    ip: "10.100.3.1"

    snmp_agent:
      community: "public"
      walk_file: "device_walks_sanitized/juniper/niac-juniper-ex4300-48p.walk"

    lldp:
      enabled: true
      advertise_interval: 30
      ttl: 120
      system_description: "Juniper Networks EX4300-48P, JUNOS 20.4R3-S4"
      port_description: "ge-0/0/47"
      chassis_id_type: "mac"

    trunk_ports:
      - interface: "ge-0/0/47"
        vlans: [1, 10, 20]
        native_vlan: 1
        remote_device: "arista-7050-dist"
        remote_interface: "Ethernet2/1"

  # Dell N3248 Access
  - name: dell-n3248-access
    type: switch
    mac: "f4:8e:38:32:48:01"
    ip: "10.100.4.1"

    snmp_agent:
      community: "public"
      walk_file: "device_walks_sanitized/dell/niac-dell-n3248te-on.walk"

    lldp:
      enabled: true
      advertise_interval: 30
      ttl: 120
      system_description: "Dell EMC Networking N3248TE-ON, 6.5.4.4"
      port_description: "TenGigabitEthernet1/0/49"
      chassis_id_type: "mac"

    trunk_ports:
      - interface: "TenGigabitEthernet1/0/49"
        vlans: [1, 30, 40]
        native_vlan: 1
        remote_device: "extreme-x465-dist"
        remote_interface: "1:50"
