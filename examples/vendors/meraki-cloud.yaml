# Meraki Cloud-Managed Configuration Example
# MS390, MS425, and MS42P switches with LLDP and SNMP walk files

include_path: ".."

devices:
  # Meraki MS390-48UXB
  - name: meraki-ms390-01
    type: switch
    mac: "0c:8d:db:a1:b2:01"
    ip: "10.60.0.1"

    snmp_agent:
      community: "public"
      walk_file: "device_walks_sanitized/meraki/niac-meraki-ms390-48uxb.walk"

    lldp:
      enabled: true
      advertise_interval: 30
      ttl: 120
      system_description: "Meraki MS390-48UXB Cloud Managed Switch"
      port_description: "Port 1"
      chassis_id_type: "mac"

    trunk_ports:
      - interface: "Port 49"
        vlans: [1, 10, 20, 30]
        native_vlan: 1
        remote_device: "meraki-ms425-01"
        remote_interface: "Port 1"

  # Meraki MS425-48
  - name: meraki-ms425-01
    type: switch
    mac: "0c:8d:db:a1:b2:02"
    ip: "10.60.1.1"

    snmp_agent:
      community: "public"
      walk_file: "device_walks_sanitized/meraki/niac-meraki-ms425-48.walk"

    lldp:
      enabled: true
      advertise_interval: 30
      ttl: 120
      system_description: "Meraki MS425-48 Cloud Managed Aggregation Switch"
      port_description: "Port 1"
      chassis_id_type: "mac"

    trunk_ports:
      - interface: "Port 1"
        vlans: [1, 10, 20, 30]
        native_vlan: 1
        remote_device: "meraki-ms390-01"
        remote_interface: "Port 49"

  # Meraki MS42P
  - name: meraki-ms42p-01
    type: switch
    mac: "0c:8d:db:a1:b2:03"
    ip: "10.60.2.1"

    snmp_agent:
      community: "public"
      walk_file: "device_walks_sanitized/meraki/niac-meraki-ms42p.walk"

    lldp:
      enabled: true
      advertise_interval: 30
      ttl: 120
      system_description: "Meraki MS42P Cloud Managed PoE Switch"
      port_description: "Port 1"
      chassis_id_type: "mac"
