# Arista Datacenter Configuration Example
# Spine-leaf topology with LLDP discovery and SNMP walk files

include_path: ".."

devices:
  # Arista Spine Switch
  - name: arista-spine-01
    type: switch
    mac: "00:1c:73:a0:b0:01"
    ip: "10.10.0.1"

    snmp_agent:
      community: "public"
      walk_file: "device_walks_sanitized/arista/niac-arista-7050sx3-48yc12.walk"

    lldp:
      enabled: true
      advertise_interval: 30
      ttl: 120
      system_description: "Arista Networks EOS version 4.28.3M running on an Arista Networks DCS-7050SX3-48YC12"
      port_description: "Ethernet1/1"
      chassis_id_type: "mac"

    trunk_ports:
      - interface: "Ethernet1/1"
        vlans: [1, 100, 200, 300]
        native_vlan: 1
        remote_device: "arista-leaf-01"
        remote_interface: "Ethernet49/1"

  # Arista Leaf Switch
  - name: arista-leaf-01
    type: switch
    mac: "00:1c:73:a0:b0:02"
    ip: "10.10.1.1"

    snmp_agent:
      community: "public"
      walk_file: "device_walks_sanitized/arista/niac-arista-7280sr3-48yc8.walk"

    lldp:
      enabled: true
      advertise_interval: 30
      ttl: 120
      system_description: "Arista Networks EOS version 4.28.3M running on an Arista Networks DCS-7280SR3-48YC8"
      port_description: "Ethernet49/1"
      chassis_id_type: "mac"

    trunk_ports:
      - interface: "Ethernet49/1"
        vlans: [1, 100, 200, 300]
        native_vlan: 1
        remote_device: "arista-spine-01"
        remote_interface: "Ethernet1/1"
