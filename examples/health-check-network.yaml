# Health Check Network Emulation Example
# Demonstrates all health check protocols and iPerf3 bandwidth testing
#
# This configuration creates a network suitable for testing with monitoring
# tools like "seed" that perform health checks on various protocols.
#
# Supported Health Check Protocols:
#   - TCP SYN/ACK (ports 443, 389, 636, 554, etc.)
#   - LDAP/LDAPS (ports 389, 636)
#   - RTSP (port 554) - camera/streaming
#   - MySQL (port 3306)
#   - PostgreSQL (port 5432)
#   - MS SQL (port 1433)
#   - Modbus TCP (port 502) - industrial
#   - DICOM (port 104) - healthcare
#   - HL7 MLLP (port 2575) - healthcare
#   - OPC UA (port 4840) - industrial
#   - SMB/CIFS (port 445) - file sharing
#   - iPerf3 (port 5201) - bandwidth testing
#
# Version: v1.25.0+
# Author: NiAC-Go Team

devices:
  # =================================================================
  # Enterprise Core Router with iPerf3 Bandwidth Testing
  # =================================================================
  - name: core-rtr-01
    mac: "00:1A:2B:01:01:01"
    ips:
      - "10.0.0.1"
      - "192.168.1.1"

    # Discovery protocols
    lldp:
      enabled: true
      system_description: "Enterprise Core Router"
      port_description: "GigabitEthernet0/0"

    cdp:
      enabled: true
      platform: "Cisco ISR 4451"
      software_version: "IOS XE 17.9.3"

    # ICMP for ping health checks
    icmp:
      enabled: true
      ttl: 255  # Router TTL

    # DNS for name resolution health checks
    dns:
      enabled: true
      records:
        - name: "core-rtr.network.local"
          type: "A"
          value: "10.0.0.1"
          ttl: 3600

    # iPerf3 for bandwidth testing (100Mbps simulated WAN link)
    iperf3:
      enabled: true
      port: 5201
      upload_mbps: 100
      download_mbps: 100
      typical_latency_ms: 5.0
      jitter_ms: 1.0
      packet_loss_percent: 0.1

    snmp_agent:
      community: "public"
      sysname: "core-rtr-01"
      syslocation: "Data Center - Core Network"

  # =================================================================
  # Database Server Cluster (MySQL, PostgreSQL, MSSQL)
  # =================================================================
  - name: db-server-01
    mac: "00:1A:2B:02:01:01"
    ip: "10.0.10.10"

    lldp:
      enabled: true
      system_description: "MySQL Database Server"

    icmp:
      enabled: true
      ttl: 64  # Linux default

    # MySQL server responds on port 3306
    # PostgreSQL on 5432
    # MSSQL on 1433
    # Health checks will receive valid protocol responses

    # OS fingerprinting to simulate Linux server
    os_fingerprint:
      os_type: "linux"
      ttl: 64
      window_size: 29200
      ssh_banner: "SSH-2.0-OpenSSH_8.9p1 Ubuntu-3ubuntu0.6"

    snmp_agent:
      community: "public"
      sysname: "db-server-01"
      syslocation: "Data Center - Database Tier"

  # =================================================================
  # LDAP/Active Directory Server
  # =================================================================
  - name: ldap-server-01
    mac: "00:1A:2B:02:02:01"
    ip: "10.0.10.20"

    lldp:
      enabled: true
      system_description: "LDAP Directory Server"

    icmp:
      enabled: true
      ttl: 128  # Windows default

    # Responds to LDAP bind requests on 389/636
    os_fingerprint:
      os_type: "windows-server"
      ttl: 128
      window_size: 65535
      http_server: "Microsoft-IIS/10.0"

    # SMB for Windows file sharing health checks
    http:
      enabled: true
      server_name: "Microsoft-IIS/10.0"

    snmp_agent:
      community: "public"
      sysname: "ldap-server-01"
      syslocation: "Data Center - Identity Services"

  # =================================================================
  # IP Camera / Streaming Server (RTSP)
  # =================================================================
  - name: camera-server-01
    mac: "00:1A:2B:03:01:01"
    ip: "10.0.20.10"

    lldp:
      enabled: true
      system_description: "IP Camera NVR"
      port_description: "eth0"

    icmp:
      enabled: true
      ttl: 64

    # Responds to RTSP OPTIONS on port 554
    os_fingerprint:
      os_type: "linux"
      http_server: "NVR-Streamer/3.0"

    http:
      enabled: true
      server_name: "NVR-Streamer/3.0"

    snmp_agent:
      community: "public"
      sysname: "camera-server-01"

  # =================================================================
  # Industrial Control (Modbus TCP, OPC UA)
  # =================================================================
  - name: plc-controller-01
    mac: "00:1A:2B:04:01:01"
    ip: "10.0.30.10"

    lldp:
      enabled: true
      system_description: "Industrial PLC Controller"

    icmp:
      enabled: true
      ttl: 64

    # Responds to Modbus TCP requests on port 502
    # Responds to OPC UA Hello on port 4840

    snmp_agent:
      community: "public"
      sysname: "plc-controller-01"
      syslocation: "Factory Floor - Line 1"

  # =================================================================
  # Healthcare System (DICOM, HL7)
  # =================================================================
  - name: pacs-server-01
    mac: "00:1A:2B:05:01:01"
    ip: "10.0.40.10"

    lldp:
      enabled: true
      system_description: "PACS Imaging Server"

    icmp:
      enabled: true
      ttl: 64

    # Responds to DICOM A-ASSOCIATE on port 104
    # Responds to HL7 MLLP messages on port 2575

    os_fingerprint:
      os_type: "linux"

    snmp_agent:
      community: "public"
      sysname: "pacs-server-01"
      syslocation: "Hospital - Radiology"

  # =================================================================
  # File Server (SMB/CIFS)
  # =================================================================
  - name: file-server-01
    mac: "00:1A:2B:06:01:01"
    ip: "10.0.50.10"

    lldp:
      enabled: true
      system_description: "Windows File Server"

    icmp:
      enabled: true
      ttl: 128

    # Responds to SMB negotiate on port 445
    os_fingerprint:
      os_type: "windows-server"
      ttl: 128

    netbios:
      enabled: true
      name: "FILESERVER01"
      workgroup: "CORPNET"

    snmp_agent:
      community: "public"
      sysname: "file-server-01"
      syslocation: "Data Center - Storage"

  # =================================================================
  # Bandwidth Test Server (High-Speed iPerf3)
  # =================================================================
  - name: iperf-server-01
    mac: "00:1A:2B:07:01:01"
    ip: "10.0.60.10"

    lldp:
      enabled: true
      system_description: "Bandwidth Test Server"

    icmp:
      enabled: true
      ttl: 64

    # High-performance iPerf3 server (1 Gbps simulated)
    iperf3:
      enabled: true
      port: 5201
      upload_mbps: 1000
      download_mbps: 1000
      typical_latency_ms: 0.5
      jitter_ms: 0.1
      packet_loss_percent: 0.0
      max_bandwidth_mbps: 10000

    os_fingerprint:
      os_type: "linux"
      ssh_banner: "SSH-2.0-OpenSSH_9.0"

    snmp_agent:
      community: "public"
      sysname: "iperf-server-01"
      syslocation: "Data Center - Testing"

  # =================================================================
  # WAN Edge Router (Lower Bandwidth iPerf3)
  # =================================================================
  - name: wan-edge-01
    mac: "00:1A:2B:08:01:01"
    ips:
      - "10.0.70.1"
      - "203.0.113.1"  # Public IP

    lldp:
      enabled: true
      system_description: "WAN Edge Router"

    cdp:
      enabled: true
      platform: "Cisco ISR 1111"

    icmp:
      enabled: true
      ttl: 255

    # Simulated 50Mbps business internet connection
    iperf3:
      enabled: true
      port: 5201
      upload_mbps: 10
      download_mbps: 50
      typical_latency_ms: 25.0
      jitter_ms: 5.0
      packet_loss_percent: 0.5

    snmp_agent:
      community: "public"
      sysname: "wan-edge-01"
      syslocation: "Branch Office"

  # =================================================================
  # DNS/DHCP Infrastructure Server
  # =================================================================
  - name: infra-server-01
    mac: "00:1A:2B:09:01:01"
    ip: "10.0.0.10"

    lldp:
      enabled: true
      system_description: "Infrastructure Services"

    icmp:
      enabled: true
      ttl: 64

    dhcp:
      enabled: true
      pools:
        - network: "10.0.0.0/8"
          range_start: "10.0.100.1"
          range_end: "10.0.100.254"
          gateway: "10.0.0.1"
          dns_servers:
            - "10.0.0.10"
          domain: "network.local"
          lease_time: 86400

    dns:
      enabled: true
      records:
        - name: "gateway.network.local"
          type: "A"
          value: "10.0.0.1"
        - name: "db.network.local"
          type: "A"
          value: "10.0.10.10"
        - name: "ldap.network.local"
          type: "A"
          value: "10.0.10.20"
        - name: "camera.network.local"
          type: "A"
          value: "10.0.20.10"
        - name: "plc.network.local"
          type: "A"
          value: "10.0.30.10"
        - name: "pacs.network.local"
          type: "A"
          value: "10.0.40.10"
        - name: "files.network.local"
          type: "A"
          value: "10.0.50.10"
        - name: "iperf.network.local"
          type: "A"
          value: "10.0.60.10"

    os_fingerprint:
      os_type: "linux"

    snmp_agent:
      community: "public"
      sysname: "infra-server-01"
      syslocation: "Data Center - Core Services"

# =================================================================
# Usage Notes
# =================================================================
#
# Run this configuration:
#   sudo niac en0 examples/health-check-network.yaml
#
# Test health checks (from another machine):
#   # ICMP ping
#   ping 10.0.0.1
#
#   # iPerf3 bandwidth test
#   iperf3 -c 10.0.60.10 -t 10
#   iperf3 -c 10.0.0.1 -t 5    # Test against router
#
#   # TCP connection tests
#   nc -zv 10.0.10.10 3306     # MySQL
#   nc -zv 10.0.10.10 5432     # PostgreSQL
#   nc -zv 10.0.10.20 389      # LDAP
#   nc -zv 10.0.20.10 554      # RTSP
#   nc -zv 10.0.30.10 502      # Modbus
#   nc -zv 10.0.40.10 104      # DICOM
#   nc -zv 10.0.50.10 445      # SMB
#
#   # SNMP queries
#   snmpwalk -v2c -c public 10.0.0.1 system
#
# Integration with Seed:
#   This network provides realistic responses for:
#   - Service availability health checks
#   - Bandwidth testing via iPerf3
#   - Protocol-specific health probes
#   - SNMP monitoring
#   - DNS resolution
#   - Traceroute path analysis
