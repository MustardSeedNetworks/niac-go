# Complete NIAC-Go Configuration Example - "Kitchen Sink"
# This file demonstrates EVERY configurable feature currently available in NIAC-Go v1.6.0+
# Use this as a reference for all possible configuration options
#
# Topology:
# =========
#                        [cisco-router-full] (Core Router)
#                       /         |          \
#        Gi0/1         Gi0/2        Gi0/3
#        (VLANs 1,10,20,30)      (VLANs 1,10,20)
#                     /           |              \
#   [extreme-switch-01]  [brocade-switch-01]  [multi-protocol-device]
#      /      |     \        /         \
#    1:2    1:3    1:4    1/1/2       1/1/3
#     |      |      |      |           |
# [multi-  [router- [router- [ipv6-only- [silent-
#  homed]   traps]  traffic]  device]    device]
#

include_path: "."

capture_playbacks:
  - file_name: "pcaps/lldp-cdp-mixed.pcap"
    loop_time: 30000
    scale_time: 1.0

devices:
  # =================================================================
  # Device 1: Cisco Router with EVERYTHING
  # =================================================================
  - name: cisco-router-full
    type: router
    mac: "00:1a:2b:3c:4d:01"
    ips:
      - "192.168.1.1"                    # IPv4
      - "fe80::21a:2bff:fe3c:4d01"      # IPv6 link-local
      - "2001:db8::1"                    # IPv6 global

    # Trunk Port Topology Connections
    trunk_ports:
      - interface: "GigabitEthernet0/1"
        vlans: [1, 10, 20, 30]
        native_vlan: 1
        remote_device: "extreme-switch-01"
        remote_interface: "1:1"
      - interface: "GigabitEthernet0/2"
        vlans: [1, 10, 20, 30]
        native_vlan: 1
        remote_device: "brocade-switch-01"
        remote_interface: "1/1/1"
      - interface: "GigabitEthernet0/3"
        vlans: [1, 10, 20]
        native_vlan: 1
        remote_device: "multi-protocol-device"
        remote_interface: "eth0"

    # LLDP Configuration (IEEE 802.1AB)
    lldp:
      enabled: true
      advertise_interval: 30
      ttl: 120
      system_description: "Cisco IOS Software, 2900 Software (C2900-UNIVERSALK9-M), Version 15.4(3)M6a"
      port_description: "GigabitEthernet0/0"
      chassis_id_type: "mac"

    # CDP Configuration (Cisco Discovery Protocol)
    cdp:
      enabled: true
      advertise_interval: 60
      holdtime: 180
      version: 2
      software_version: "Cisco IOS Software, 2900 Software (C2900-UNIVERSALK9-M), Version 15.4(3)M6a, RELEASE SOFTWARE"
      platform: "Cisco 2921"
      port_id: "GigabitEthernet0/0"

    # STP Configuration (Spanning Tree Protocol)
    stp:
      enabled: true
      bridge_priority: 4096        # Low priority = root bridge candidate
      hello_time: 2
      max_age: 20
      forward_delay: 15
      version: "rstp"              # Rapid Spanning Tree Protocol

    # DHCP Server Configuration
    dhcp:
      enabled: true
      pools:
        - network: "192.168.1.0/24"
          range_start: "192.168.1.100"
          range_end: "192.168.1.200"
          gateway: "192.168.1.1"
          dns_servers:
            - "192.168.1.10"
            - "8.8.8.8"
          domain: "corp.example.com"
          lease_time: 86400
          options:
            - code: 42
              value: "c0a80165"

    # DNS Server Configuration
    dns:
      enabled: true
      records:
        - name: "router.example.com"
          type: "A"
          value: "192.168.1.1"
          ttl: 3600
        - name: "router.example.com"
          type: "AAAA"
          value: "2001:db8::1"
          ttl: 3600
        - name: "example.com"
          type: "NS"
          value: "router.example.com"
          ttl: 86400

    # SNMP Configuration
    snmp_agent:
      community: "public"
      location: "Data Center - Rack A1"
      contact: "Network Admin <netadmin@example.com>"
      engine_id: "80000009030011223344"
      walk_file: "device_walks_sanitized/cisco/niac-cisco-c3850-48p.walk"
      community_includes:
        - community: "private"
          walk_file: "device_walks_sanitized/cisco/niac-cisco-c9300-48p.walk"
      # Bridge MIB FDB table injection — exercised so an snmpwalk against the
      # dot1dTpFdbTable / dot1qTpFdbTable returns synthesized entries.
      dot1d_fdb_table:
        port: 1
        vlan: 1
      dot1q_fdb_table:
        port: 1
        vlan: 10

    # HTTP Server Configuration
    http:
      enabled: true
      server_name: "Cisco-HTTP/1.0"
      endpoints:
        - path: "/api/v1/status"
          method: "GET"
          status_code: 200
          content_type: "application/json"
          body: '{"status": "online", "uptime": 86400}'
        - path: "/admin"
          status_code: 403
          content_type: "text/html"
          body: '<html><body><h1>403 Forbidden</h1></body></html>'

    # FTP Server Configuration
    ftp:
      enabled: true
      welcome_banner: "220 Cisco IOS FTP Server ready."
      system_type: "UNIX Type: L8"
      allow_anonymous: false
      users:
        - username: "admin"
          password: "cisco123"
          home_dir: "/flash"

    # NetBIOS Configuration
    netbios:
      enabled: true
      name: "CISCO-RTR-01"
      workgroup: "INFRASTRUCTURE"
      node_type: "H"       # Hybrid node
      services:
        - "workstation"
      ttl: 600

    # ICMP Configuration (v1.5.0 Group 3)
    icmp:
      enabled: true
      ttl: 128             # Windows-like TTL (routers often use 255)
      rate_limit: 100      # Max 100 ICMP responses/sec (0 = unlimited)

    # ICMPv6 Configuration (v1.5.0 Group 3)
    icmpv6:
      enabled: true
      hop_limit: 255       # Maximum hop limit for router
      rate_limit: 100      # Max 100 ICMPv6 responses/sec

    # iPerf3 Bandwidth Testing Configuration (v1.25.0)
    iperf3:
      enabled: true
      port: 5201           # Default iPerf3 port
      upload_mbps: 100     # Simulated upload bandwidth
      download_mbps: 100   # Simulated download bandwidth
      typical_latency_ms: 1.0
      jitter_ms: 0.1
      packet_loss_percent: 0.0

    # OS Fingerprinting Configuration (v1.24.0)
    os_fingerprint:
      os_type: "cisco-ios"
      ttl: 255                   # Cisco default TTL

    # DHCPv6 Server Configuration (v1.5.0 Group 3)
    dhcpv6:
      enabled: true
      pools:
        - network: "2001:db8::/64"
          range_start: "2001:db8::100"
          range_end: "2001:db8::1ff"
      preferred_lifetime: 604800      # 7 days
      valid_lifetime: 2592000         # 30 days
      preference: 255                 # Highest preference (primary server)
      dns_servers:
        - "2001:db8::10"
        - "2001:4860:4860::8888"      # Google IPv6 DNS
      domain_list:
        - "corp.example.com"
      sntp_servers:
        - "2001:db8::20"
      ntp_servers:
        - "2001:db8::21"
      sip_servers:
        - "2001:db8::30"
      sip_domains:
        - "sip.corp.example.com"

  # =================================================================
  # Device 2: Extreme Switch with EDP
  # =================================================================
  - name: extreme-switch-01
    type: switch
    mac: "00:04:96:ab:cd:02"
    ip: "192.168.1.20"

    snmp_agent:
      community: "public"
      walk_file: "device_walks_sanitized/extreme/niac-extreme-x465-48w.walk"

    # OS Fingerprinting
    os_fingerprint:
      os_type: "linux"
      ttl: 64

    # Port-Channel / LAG Configuration (v1.23.0)
    port_channels:
      - id: 1
        members: ["1:5", "1:6"]
        mode: "active"                # LACP active

    # Trunk Port Topology Connections
    trunk_ports:
      - interface: "1:1"
        vlans: [1, 10, 20, 30]
        native_vlan: 1
        remote_device: "cisco-router-full"
        remote_interface: "GigabitEthernet0/1"
      - interface: "1:2"
        vlans: [10]
        native_vlan: 10
        remote_device: "multi-homed-server"
        remote_interface: "eth0"
      - interface: "1:3"
        vlans: [10, 20]
        native_vlan: 10
        remote_device: "router-with-traps"
        remote_interface: "eth0"
      - interface: "1:4"
        vlans: [10, 20]
        native_vlan: 10
        remote_device: "router-with-traffic"
        remote_interface: "eth0"

    lldp:
      enabled: true
      advertise_interval: 30
      ttl: 120
      system_description: "ExtremeXOS version 22.6.1.4 v2261b4"
      port_description: "1:1"

    edp:
      enabled: true
      advertise_interval: 30
      version_string: "ExtremeXOS version 22.6.1.4 v2261b4"
      display_string: "X460-G2-24t-10G4"

    stp:
      enabled: true
      bridge_priority: 8192        # Secondary bridge
      hello_time: 2
      max_age: 20
      forward_delay: 15
      version: "rstp"

  # =================================================================
  # Device 3: Brocade/Ruckus Switch with FDP
  # =================================================================
  - name: brocade-switch-01
    type: switch
    mac: "00:e0:52:11:22:03"
    ip: "192.168.1.30"

    snmp_agent:
      community: "public"
      walk_file: "device_walks_sanitized/brocade/niac-brocade-communications.walk"

    # OS Fingerprinting
    os_fingerprint:
      os_type: "linux"
      ttl: 64

    # Trunk Port Topology Connections
    trunk_ports:
      - interface: "1/1/1"
        vlans: [1, 10, 20, 30]
        native_vlan: 1
        remote_device: "cisco-router-full"
        remote_interface: "GigabitEthernet0/2"
      - interface: "1/1/2"
        vlans: [10]
        native_vlan: 10
        remote_device: "ipv6-only-device"
        remote_interface: "eth0"
      - interface: "1/1/3"
        vlans: [10]
        native_vlan: 10
        remote_device: "silent-device"
        remote_interface: "eth0"

    lldp:
      enabled: true
      system_description: "Brocade ICX7450-48 Switch, IronWare Version 08.0.30T211"
      port_description: "1/1/1"

    fdp:
      enabled: true
      advertise_interval: 60
      holdtime: 180
      software_version: "IronWare Version 08.0.30T211"
      platform: "Brocade ICX7450-48"
      port_id: "1/1/1"

    stp:
      enabled: true
      bridge_priority: 32768       # Default priority
      hello_time: 2
      max_age: 20
      forward_delay: 15
      version: "stp"               # Classic STP

  # =================================================================
  # Device 4: Multi-Homed Server (Multiple IPs)
  # =================================================================
  - name: multi-homed-server
    type: server
    mac: "00:11:22:33:44:04"

    snmp_agent:
      community: "public"
      walk_file: "device_walks_sanitized/misc/niac-misc-c3900.walk"

    os_fingerprint:
      os_type: "linux"
      ttl: 64
    ips:
      - "192.168.1.50"                   # Management network
      - "192.168.2.50"                   # Production network
      - "10.0.0.50"                      # Storage network
      - "fe80::211:22ff:fe33:4404"      # IPv6 link-local
      - "2001:db8::50"                   # IPv6 global

    trunk_ports:
      - interface: "eth0"
        vlans: [10]
        native_vlan: 10
        remote_device: "extreme-switch-01"
        remote_interface: "1:2"

    lldp:
      enabled: true
      system_description: "Ubuntu 22.04 LTS Server"
      port_description: "eth0"

    # DNS Server with various record types
    dns:
      enabled: true
      records:
        - name: "server.example.com"
          type: "A"
          value: "192.168.1.50"
          ttl: 3600
        - name: "server.example.com"
          type: "AAAA"
          value: "2001:db8::50"
          ttl: 3600
        - name: "www.example.com"
          type: "CNAME"
          value: "server.example.com"
          ttl: 3600
        - name: "example.com"
          type: "MX"
          value: "10 mail.example.com"
          ttl: 3600
        - name: "example.com"
          type: "TXT"
          value: "v=spf1 mx a ip4:192.168.1.0/24 -all"
          ttl: 3600
        - name: "_ldap._tcp.example.com"
          type: "SRV"
          value: "10 5 389 ldap.example.com"
          ttl: 3600

  # =================================================================
  # Device 5: IPv6-Only Device
  # =================================================================
  - name: ipv6-only-device
    type: server
    mac: "00:11:22:33:44:05"
    ips:
      - "fe80::211:22ff:fe33:4405"      # Link-local
      - "2001:db8::100"                  # Global unicast
      - "fd00::100"                      # Unique local

    trunk_ports:
      - interface: "eth0"
        vlans: [10]
        native_vlan: 10
        remote_device: "brocade-switch-01"
        remote_interface: "1/1/2"

    lldp:
      enabled: true
      system_description: "IPv6-Only Linux Server"
      chassis_id_type: "network_address"

  # =================================================================
  # Device 6: All Discovery Protocols Enabled (Multi-Vendor)
  # =================================================================
  - name: multi-protocol-device
    type: switch
    mac: "00:11:22:33:44:06"
    ip: "192.168.1.60"

    trunk_ports:
      - interface: "eth0"
        vlans: [1, 10, 20]
        native_vlan: 1
        remote_device: "cisco-router-full"
        remote_interface: "GigabitEthernet0/3"

    lldp:
      enabled: true
    cdp:
      enabled: true
    edp:
      enabled: true
    fdp:
      enabled: true

  # =================================================================
  # Device 7: Configurable Traffic Patterns (v1.6.0)
  # =================================================================
  - name: router-with-traffic
    type: router
    mac: "00:11:22:33:44:07"
    ip: "192.168.1.70"

    trunk_ports:
      - interface: "eth0"
        vlans: [10, 20]
        native_vlan: 10
        remote_device: "extreme-switch-01"
        remote_interface: "1:4"

    lldp:
      enabled: true
      system_description: "Cisco IOS Router with Traffic"

    # Customizable traffic patterns (v1.6.0)
    traffic:
      enabled: true

      arp_announcements:
        enabled: true
        interval: 30        # More frequent than default (60s)

      periodic_pings:
        enabled: true
        interval: 60        # Faster than default (120s)
        payload_size: 128   # Larger than default (32 bytes)

      random_traffic:
        enabled: true
        interval: 90        # More frequent than default (180s)
        packet_count: 20    # More packets than default (5)
        patterns:
          - broadcast_arp
          - multicast
          - udp

  # =================================================================
  # Device 8: SNMP Trap Generation (v1.6.0)
  # =================================================================
  - name: router-with-traps
    type: router
    mac: "00:11:22:33:44:08"
    ip: "192.168.1.80"

    os_fingerprint:
      os_type: "cisco-ios"
      ttl: 255

    trunk_ports:
      - interface: "eth0"
        vlans: [10, 20]
        native_vlan: 10
        remote_device: "extreme-switch-01"
        remote_interface: "1:3"

    lldp:
      enabled: true
      system_description: "Cisco IOS Router with SNMP Traps"

    # SNMP agent with trap generation (v1.6.0)
    snmp_agent:
      community: "public"
      walk_file: "device_walks_sanitized/cisco/niac-cisco-2800-67.walk"
      traps:
        enabled: true
        receivers:
          - "192.168.1.100:162"    # NMS station

        # Event-based traps
        cold_start:
          enabled: true
          on_startup: true

        link_state:
          enabled: true
          link_down: true
          link_up: true

        authentication_failure:
          enabled: true

        # Threshold-based traps
        high_cpu:
          enabled: true
          threshold: 80      # 80% CPU
          interval: 300      # Check every 5 minutes

        high_memory:
          enabled: true
          threshold: 90      # 90% memory
          interval: 300

        interface_errors:
          enabled: true
          threshold: 100     # 100 errors
          interval: 60       # Check every minute

  # =================================================================
  # Device 9: All Discovery Protocols Disabled (Silent Device)
  # =================================================================
  - name: silent-device
    type: host
    mac: "00:11:22:33:44:09"
    ip: "192.168.1.90"

    trunk_ports:
      - interface: "eth0"
        vlans: [10]
        native_vlan: 10
        remote_device: "brocade-switch-01"
        remote_interface: "1/1/3"

    lldp:
      enabled: false
    cdp:
      enabled: false
    edp:
      enabled: false
    fdp:
      enabled: false

# Configuration Summary:
# =====================
# This file demonstrates ALL v1.6.0+ features:
#
# Topology Features:
# - Trunk port connections between all 9 devices (11 links total)
# - Bidirectional link references for proper topology graph generation
# - VLAN tagging (VLANs 1, 10, 20, 30) with native VLAN
# - Device type annotations (router, switch, server, host)
#
#
# Phase 1 Features:
# - Multiple IP addresses per device (IPv4 and IPv6)
# - Color-coded debug output
# - Per-protocol debug level control
#
# Phase 2 Group 1 - Discovery Protocols:
# - LLDP configuration (system description, port description, chassis ID type)
# - CDP configuration (version, platform, software version, port ID)
# - EDP configuration (version string, display string)
# - FDP configuration (platform, software version, port ID)
#
# Phase 2 Group 1b - Layer 2 Protocols:
# - STP configuration (bridge priority, timers, version: stp/rstp/mstp)
#
# Phase 2 Group 2 - Application Protocols:
# - HTTP server configuration (server name, endpoints, responses)
# - FTP server configuration (welcome banner, system type, users)
# - NetBIOS configuration (name, workgroup, node type, services, TTL)
#
# Phase 2 Group 3 - Network Protocols:
# - ICMP configuration (TTL, rate limiting)
# - ICMPv6 configuration (hop limit, rate limiting)
#   * NDP packets always use hop limit 255 per RFC 4861
# - DHCPv6 server (pools, lifetimes, preference, DNS/SNTP/NTP/SIP servers)
#
# Core Services:
# - DHCP server with pools and options
# - DNS server with A, AAAA, CNAME, MX, TXT, SRV, NS records
# - SNMP agent configuration
#
# Network Configurations:
# - IPv4-only, IPv6-only, and dual-stack devices
# - Multi-homed devices (multiple IPs on different networks)
# - Per-device protocol enable/disable
#
# Phase 3 Features (v1.6.0):
# - Configurable Traffic Patterns:
#   * ARP announcement intervals
#   * Periodic ping intervals and payload sizes
#   * Random traffic generation (packet count, intervals, patterns)
# - SNMP Trap Generation:
#   * Event-based traps (coldStart, linkUp/Down, authenticationFailure)
#   * Threshold-based traps (high CPU, high memory, interface errors)
#   * Configurable trap receivers, thresholds, and check intervals
#
# Phase 4 Features (v1.24.0+):
# - OS Fingerprinting Configuration:
#   * OS type (linux, windows, cisco-ios, etc.)
#   * TTL defaults per OS type
#   * TCP window size and options
#   * Service banners (SSH, HTTP, FTP, SMTP, Telnet)
#
# Phase 5 Features (v1.25.0):
# - Health Check Protocol Emulation:
#   * HTTPS/TLS (port 443)
#   * LDAP/LDAPS (ports 389, 636)
#   * RTSP streaming (port 554)
#   * MySQL (port 3306)
#   * PostgreSQL (port 5432)
#   * MS SQL Server (port 1433)
#   * Modbus TCP (port 502) - industrial
#   * DICOM (port 104) - healthcare imaging
#   * HL7 MLLP (port 2575) - healthcare messaging
#   * OPC UA (port 4840) - industrial
#   * SMB/CIFS (port 445) - file sharing
# - iPerf3 Bandwidth Testing Emulation:
#   * Configurable upload/download bandwidth
#   * Simulated latency and jitter
#   * Packet loss simulation
#   * Full iPerf3 protocol support
