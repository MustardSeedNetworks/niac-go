# Seed-Compatible Enterprise Network - Full Emulation
# ====================================================
#
# This configuration provides a complete enterprise network simulation that
# supports ALL health checks and monitoring capabilities of the Seed tool.
#
# Network Topology:
# =================
#
#                            [INTERNET]
#                                |
#                    [WAN Edge Routers] (BGP, NAT)
#                         |         |
#                    [ISP1-1Gbps] [ISP2-500Mbps]
#                         |         |
#                    [Core Firewall Cluster]
#                         |         |
#                    [Core Router 1]---[Core Router 2]
#                         |                   |
#            +------------+-------------------+------------+
#            |            |                   |            |
#     [DC Firewall]  [Bldg A FW]        [Bldg B FW]   [WAN to Remote]
#            |            |                   |            |
#     [DC ToR Switch] [Dist-A]           [Dist-B]    +-----+-----+
#            |            |                   |      |           |
#     [Server Farm]   [Access]            [Access]  [Bldg C]  [Bldg D]
#                     Fl1,2,3             Fl1,2     (Branch)  (Mfg)
#
# Buildings:
# ==========
#   Building A - Corporate HQ (3 floors) - On-campus
#   Building B - Engineering Center (2 floors) - On-campus
#   Building C - Remote Branch Office (2 floors) - WAN connected
#   Building D - Manufacturing Facility (1 floor + warehouse) - WAN connected
#
# VLANs:
# ======
#   VLAN 1    - Native/Management
#   VLAN 10   - Core Infrastructure
#   VLAN 20   - Server Farm
#   VLAN 30   - User Workstations - Building A
#   VLAN 40   - User Workstations - Building B
#   VLAN 50   - Voice/VoIP
#   VLAN 60   - Guest/Visitor
#   VLAN 70   - User Workstations - Building C
#   VLAN 80   - User Workstations - Building D
#   VLAN 100  - Industrial/SCADA
#   VLAN 200  - Healthcare/Medical
#   VLAN 250  - Wireless
#   VLAN 999  - Quarantine
#
# Supported Health Checks (Seed Compatible):
# ==========================================
#   - ICMP Ping (all devices)
#   - TCP Port Checks (all protocol ports)
#   - SNMP v2c Polling and Walks
#   - SNMP Traps
#   - DNS Resolution
#   - DHCP/DHCPv6 Server
#   - HTTP/HTTPS
#   - FTP
#   - LDAP/LDAPS
#   - Database (MySQL, PostgreSQL, MSSQL)
#   - SMB/CIFS File Sharing
#   - RTSP Streaming
#   - Modbus TCP (Industrial)
#   - OPC UA (Industrial)
#   - DICOM (Healthcare)
#   - HL7 MLLP (Healthcare)
#   - iPerf3 Bandwidth Testing
#   - Traceroute Path Analysis
#   - Discovery Protocols (LLDP, CDP)
#   - STP/RSTP
#
# Version: v1.25.0+
# Author: NiAC-Go Team

# Include path for walk files (must be set to the examples directory when running)
# When running niac from go directory: include_path: "examples"
# When running from examples directory: include_path: "."
include_path: "examples"

devices:

  # =========================================================================
  # WAN EDGE LAYER
  # =========================================================================

  # Primary WAN Edge Router (ISP1 - 1Gbps Fiber)
  - name: wan-edge-primary
    type: router
    mac: "00:01:01:01:01:01"
    ips:
      - "10.0.0.1"           # Internal gateway
      - "203.0.113.1"        # Public IP (ISP1)
      - "2001:db8:1::1"      # IPv6

    lldp:
      enabled: true
      system_name: "wan-edge-primary"
      system_description: "Cisco ASR 1001-X - Primary WAN Edge"
      port_description: "TenGigabitEthernet0/0/0"
      advertise_interval: 30

    cdp:
      enabled: true
      platform: "Cisco ASR 1001-X"
      software_version: "IOS XE 17.9.3"
      capabilities: "Router"

    # TTL config for traceroute simulation (hop 1)
    ttl:
      ttl: 1
      ip: "10.0.0.1"

    icmp:
      enabled: true
      ttl: 255
      rate_limit: 1000

    icmpv6:
      enabled: true
      hop_limit: 255

    # Primary WAN - 1Gbps symmetric fiber
    iperf3:
      enabled: true
      port: 5201
      upload_mbps: 1000
      download_mbps: 1000
      typical_latency_ms: 2.0
      jitter_ms: 0.5
      packet_loss_percent: 0.01

    os_fingerprint:
      os_type: "cisco-ios"
      ttl: 255

    # Neighbor connections for topology discovery
    trunk_ports:
      - interface: "TenGigabitEthernet0/0/0"
        vlans: [1, 10]
        native_vlan: 1
        remote_device: "core-fw-01"
        remote_interface: "ethernet1/1"

    snmp_agent:
      enabled: true
      community: "enterprise-ro"
      sysname: "wan-edge-primary"
      sysdescr: "Cisco ASR 1001-X - Primary WAN Edge Router"
      syscontact: "noc@enterprise.com"
      syslocation: "Enterprise HQ - Data Center - WAN Edge Rack"
      walk_file: "device_walks/cisco/2800_10.250.1.6.walk"
      add_mibs:
        # Interface traffic counters (varimib - time-varying)
        - oid: "1.3.6.1.2.1.2.2.1.10.1"  # ifInOctets.1
          type: Counter32
          value: "varimib((100 50000))"  # +50KB/sec
        - oid: "1.3.6.1.2.1.2.2.1.16.1"  # ifOutOctets.1
          type: Counter32
          value: "varimib((100 30000))"  # +30KB/sec
        - oid: "1.3.6.1.2.1.2.2.1.10.2"  # ifInOctets.2
          type: Counter32
          value: "varimib((100 25000))"  # +25KB/sec
        - oid: "1.3.6.1.2.1.2.2.1.16.2"  # ifOutOctets.2
          type: Counter32
          value: "varimib((100 20000))"  # +20KB/sec
      traps:
        enabled: true
        receivers: ["10.20.1.100:162"]
        community: "enterprise-trap"
        cold_start:
          enabled: true
        link_up:
          enabled: true
        link_down:
          enabled: true
        high_cpu:
          enabled: true
          threshold: 80
        high_memory:
          enabled: true
          threshold: 85

  # Secondary WAN Edge Router (ISP2 - 500Mbps Cable)
  - name: wan-edge-secondary
    type: router
    mac: "00:01:01:01:01:02"
    ips:
      - "10.0.0.2"
      - "198.51.100.1"       # Public IP (ISP2)

    lldp:
      enabled: true
      system_name: "wan-edge-secondary"
      system_description: "Cisco ASR 1001-X - Secondary WAN Edge"

    cdp:
      enabled: true
      platform: "Cisco ASR 1001-X"
      software_version: "IOS XE 17.9.3"

    ttl:
      ttl: 1
      ip: "10.0.0.2"

    icmp:
      enabled: true
      ttl: 255

    # Secondary WAN - 500Mbps/100Mbps cable
    iperf3:
      enabled: true
      port: 5201
      upload_mbps: 100
      download_mbps: 500
      typical_latency_ms: 15.0
      jitter_ms: 3.0
      packet_loss_percent: 0.1

    os_fingerprint:
      os_type: "cisco-ios"

    # Neighbor connections for topology discovery
    trunk_ports:
      - interface: "TenGigabitEthernet0/0/0"
        vlans: [1, 10]
        native_vlan: 1
        remote_device: "core-fw-02"
        remote_interface: "ethernet1/1"

    snmp_agent:
      enabled: true
      community: "enterprise-ro"
      sysname: "wan-edge-secondary"
      syslocation: "Enterprise HQ - Data Center - WAN Edge Rack"
      walk_file: "device_walks/cisco/2800_10.250.1.6.walk"
      add_mibs:
        # Interface traffic counters (varimib - time-varying)
        - oid: "1.3.6.1.2.1.2.2.1.10.1"  # ifInOctets.1
          type: Counter32
          value: "varimib((100 50000))"  # +50KB/sec
        - oid: "1.3.6.1.2.1.2.2.1.16.1"  # ifOutOctets.1
          type: Counter32
          value: "varimib((100 30000))"  # +30KB/sec
        - oid: "1.3.6.1.2.1.2.2.1.10.2"  # ifInOctets.2
          type: Counter32
          value: "varimib((100 25000))"  # +25KB/sec
        - oid: "1.3.6.1.2.1.2.2.1.16.2"  # ifOutOctets.2
          type: Counter32
          value: "varimib((100 20000))"  # +20KB/sec

  # =========================================================================
  # CORE FIREWALL CLUSTER (Perimeter Security)
  # =========================================================================

  # Primary Core Firewall - Palo Alto PA-5250
  - name: core-fw-01
    type: router
    mac: "00:01:01:02:01:01"
    ips:
      - "10.0.0.10"          # Management
      - "10.0.0.254"         # Inside gateway

    lldp:
      enabled: true
      system_name: "core-fw-01"
      system_description: "Palo Alto PA-5250 - Primary Core Firewall"
      port_description: "ethernet1/1"
      advertise_interval: 30

    cdp:
      enabled: true
      platform: "Palo Alto PA-5250"
      software_version: "PAN-OS 11.1.2"
      capabilities: "Router"

    icmp:
      enabled: true
      ttl: 64
      rate_limit: 500

    os_fingerprint:
      os_type: "linux"
      ttl: 64

    http:
      enabled: true
      server_name: "PAN-OS"
      endpoints:
        - path: "/php/login.php"
          response: "<html><title>Palo Alto Networks</title></html>"
        - path: "/api/"
          status_code: 403
          response: '{"error":"API key required"}'

    # Neighbor connections for topology discovery
    trunk_ports:
      - interface: "ethernet1/1"
        vlans: [1, 10]
        native_vlan: 1
        remote_device: "wan-edge-primary"
        remote_interface: "TenGigabitEthernet0/0/0"
      - interface: "ethernet1/2"
        vlans: [1, 10, 20, 30, 40, 50, 60, 100, 200, 250]
        native_vlan: 1
        remote_device: "core-rtr-01"
        remote_interface: "TenGigabitEthernet1/0/2"
      - interface: "ethernet1/10"
        vlans: [1]
        native_vlan: 1
        remote_device: "core-fw-02"
        remote_interface: "ethernet1/10"

    snmp_agent:
      enabled: true
      community: "enterprise-ro"
      sysname: "core-fw-01"
      sysdescr: "Palo Alto Networks PA-5250 series firewall"
      syscontact: "security@enterprise.com"
      syslocation: "Data Center - Core Security Rack"
      add_mibs:
        # Interface traffic counters (varimib - time-varying)
        - oid: "1.3.6.1.2.1.2.2.1.10.1"  # ifInOctets.1
          type: Counter32
          value: "varimib((100 50000))"  # +50KB/sec
        - oid: "1.3.6.1.2.1.2.2.1.16.1"  # ifOutOctets.1
          type: Counter32
          value: "varimib((100 30000))"  # +30KB/sec
        - oid: "1.3.6.1.2.1.2.2.1.10.2"  # ifInOctets.2
          type: Counter32
          value: "varimib((100 25000))"  # +25KB/sec
        - oid: "1.3.6.1.2.1.2.2.1.16.2"  # ifOutOctets.2
          type: Counter32
          value: "varimib((100 20000))"  # +20KB/sec
      traps:
        enabled: true
        receivers: ["10.20.1.100:162"]
        community: "enterprise-trap"
        link_up:
          enabled: true
        link_down:
          enabled: true

  # Secondary Core Firewall - Palo Alto PA-5250 (HA Peer)
  - name: core-fw-02
    type: router
    mac: "00:01:01:02:01:02"
    ips:
      - "10.0.0.11"          # Management
      - "10.0.0.253"         # Inside gateway (HA standby)

    lldp:
      enabled: true
      system_name: "core-fw-02"
      system_description: "Palo Alto PA-5250 - Secondary Core Firewall (HA)"

    cdp:
      enabled: true
      platform: "Palo Alto PA-5250"
      software_version: "PAN-OS 11.1.2"

    icmp:
      enabled: true
      ttl: 64

    os_fingerprint:
      os_type: "linux"

    # Neighbor connections for topology discovery
    trunk_ports:
      - interface: "ethernet1/1"
        vlans: [1, 10]
        native_vlan: 1
        remote_device: "wan-edge-secondary"
        remote_interface: "TenGigabitEthernet0/0/0"
      - interface: "ethernet1/2"
        vlans: [1, 10, 20, 30, 40, 50, 60, 100, 200, 250]
        native_vlan: 1
        remote_device: "core-rtr-02"
        remote_interface: "TenGigabitEthernet1/0/2"
      - interface: "ethernet1/10"
        vlans: [1]
        native_vlan: 1
        remote_device: "core-fw-01"
        remote_interface: "ethernet1/10"

    snmp_agent:
      enabled: true
      community: "enterprise-ro"
      sysname: "core-fw-02"
      sysdescr: "Palo Alto Networks PA-5250 series firewall"
      syslocation: "Data Center - Core Security Rack"
      add_mibs:
        # Interface traffic counters (varimib - time-varying)
        - oid: "1.3.6.1.2.1.2.2.1.10.1"  # ifInOctets.1
          type: Counter32
          value: "varimib((100 50000))"  # +50KB/sec
        - oid: "1.3.6.1.2.1.2.2.1.16.1"  # ifOutOctets.1
          type: Counter32
          value: "varimib((100 30000))"  # +30KB/sec
        - oid: "1.3.6.1.2.1.2.2.1.10.2"  # ifInOctets.2
          type: Counter32
          value: "varimib((100 25000))"  # +25KB/sec
        - oid: "1.3.6.1.2.1.2.2.1.16.2"  # ifOutOctets.2
          type: Counter32
          value: "varimib((100 20000))"  # +20KB/sec

  # =========================================================================
  # CORE LAYER
  # =========================================================================

  # Core Router 1
  - name: core-rtr-01
    type: router
    mac: "00:01:02:01:01:01"
    ips:
      - "10.1.0.1"
      - "10.10.0.1"          # VLAN 10 - Core
      - "10.20.0.1"          # VLAN 20 - Server
      - "2001:db8:10::1"

    lldp:
      enabled: true
      system_name: "core-rtr-01"
      system_description: "Cisco Catalyst 9500 - Core Router 1"
      advertise_interval: 30

    cdp:
      enabled: true
      platform: "C9500-24Y4C"
      software_version: "IOS XE 17.9.3"
      capabilities: "Router Switch"

    stp:
      enabled: true
      bridge_priority: 4096    # Root bridge for VLAN 10
      version: "rstp"

    trunk_ports:
      - interface: "TenGigabitEthernet1/0/1"
        vlans: [1, 10, 20, 30, 40, 50, 60, 100, 200, 250]
        native_vlan: 1
        remote_device: "core-rtr-02"
        remote_interface: "TenGigabitEthernet1/0/1"
      - interface: "TenGigabitEthernet1/0/2"
        vlans: [1, 10, 20, 30, 40, 50, 60, 100, 200, 250]
        native_vlan: 1
        remote_device: "core-fw-01"
        remote_interface: "ethernet1/2"
      - interface: "TenGigabitEthernet1/0/3"
        vlans: [1, 20]
        native_vlan: 1
        remote_device: "fw-datacenter"
        remote_interface: "ethernet1/1"
      - interface: "TenGigabitEthernet1/0/4"
        vlans: [1, 30, 50, 60, 250]
        native_vlan: 1
        remote_device: "fw-bldg-a"
        remote_interface: "ethernet1/1"
      - interface: "TenGigabitEthernet1/0/10"
        vlans: [1, 10]
        native_vlan: 1
        remote_device: "wlc-primary"
        remote_interface: "GigabitEthernet0/0/1"
      # WAN links to remote sites (via MPLS/VPN)
      - interface: "GigabitEthernet0/0/1"
        vlans: [1]
        native_vlan: 1
        remote_device: "wan-rtr-bldg-c"
        remote_interface: "GigabitEthernet0/0/1"
      - interface: "GigabitEthernet0/0/2"
        vlans: [1]
        native_vlan: 1
        remote_device: "wan-rtr-bldg-d"
        remote_interface: "GigabitEthernet0/0/1"

    ttl:
      ttl: 2
      ip: "10.1.0.1"

    icmp:
      enabled: true
      ttl: 255

    snmp_agent:
      enabled: true
      community: "enterprise-ro"
      sysname: "core-rtr-01"
      sysdescr: "Cisco Catalyst 9500 - Core Router 1"
      syslocation: "Data Center - Core Rack 1"
      walk_file: "device_walks/cisco/C3750_10.250.0.1.walk"
      add_mibs:
        # Interface traffic counters (varimib - time-varying)
        - oid: "1.3.6.1.2.1.2.2.1.10.1"  # ifInOctets.1
          type: Counter32
          value: "varimib((100 50000))"  # +50KB/sec
        - oid: "1.3.6.1.2.1.2.2.1.16.1"  # ifOutOctets.1
          type: Counter32
          value: "varimib((100 30000))"  # +30KB/sec
        - oid: "1.3.6.1.2.1.2.2.1.10.2"  # ifInOctets.2
          type: Counter32
          value: "varimib((100 25000))"  # +25KB/sec
        - oid: "1.3.6.1.2.1.2.2.1.16.2"  # ifOutOctets.2
          type: Counter32
          value: "varimib((100 20000))"  # +20KB/sec
      traps:
        enabled: true
        receivers: ["10.20.1.100:162"]
        link_up:
          enabled: true
        link_down:
          enabled: true

  # Core Router 2 (Redundant)
  - name: core-rtr-02
    type: router
    mac: "00:01:02:01:01:02"
    ips:
      - "10.1.0.2"
      - "10.10.0.2"
      - "10.20.0.2"
      - "2001:db8:10::2"

    lldp:
      enabled: true
      system_name: "core-rtr-02"
      system_description: "Cisco Catalyst 9500 - Core Router 2"

    cdp:
      enabled: true
      platform: "C9500-24Y4C"
      software_version: "IOS XE 17.9.3"

    stp:
      enabled: true
      bridge_priority: 8192    # Secondary root

    trunk_ports:
      - interface: "TenGigabitEthernet1/0/1"
        vlans: [1, 10, 20, 30, 40, 50, 60, 100, 200, 250]
        native_vlan: 1
        remote_device: "core-rtr-01"
        remote_interface: "TenGigabitEthernet1/0/1"
      - interface: "TenGigabitEthernet1/0/2"
        vlans: [1, 10, 20, 30, 40, 50, 60, 100, 200, 250]
        native_vlan: 1
        remote_device: "core-fw-02"
        remote_interface: "ethernet1/2"
      - interface: "TenGigabitEthernet1/0/4"
        vlans: [1, 40, 50, 60, 250]
        native_vlan: 1
        remote_device: "fw-bldg-b"
        remote_interface: "ethernet1/1"
      - interface: "TenGigabitEthernet1/0/10"
        vlans: [1, 10]
        native_vlan: 1
        remote_device: "wlc-secondary"
        remote_interface: "GigabitEthernet0/0/1"

    ttl:
      ttl: 2
      ip: "10.1.0.2"

    icmp:
      enabled: true
      ttl: 255

    snmp_agent:
      enabled: true
      community: "enterprise-ro"
      sysname: "core-rtr-02"
      syslocation: "Data Center - Core Rack 2"
      walk_file: "device_walks/cisco/C3750_10.250.0.1.walk"
      add_mibs:
        # Interface traffic counters (varimib - time-varying)
        - oid: "1.3.6.1.2.1.2.2.1.10.1"  # ifInOctets.1
          type: Counter32
          value: "varimib((100 50000))"  # +50KB/sec
        - oid: "1.3.6.1.2.1.2.2.1.16.1"  # ifOutOctets.1
          type: Counter32
          value: "varimib((100 30000))"  # +30KB/sec
        - oid: "1.3.6.1.2.1.2.2.1.10.2"  # ifInOctets.2
          type: Counter32
          value: "varimib((100 25000))"  # +25KB/sec
        - oid: "1.3.6.1.2.1.2.2.1.16.2"  # ifOutOctets.2
          type: Counter32
          value: "varimib((100 20000))"  # +20KB/sec

  # =========================================================================
  # BUILDING A - CORPORATE HQ (On-Campus)
  # =========================================================================

  # Building A Firewall - Palo Alto PA-440
  - name: fw-bldg-a
    type: router
    mac: "00:01:03:01:00:01"
    ips:
      - "10.30.0.254"        # Building A gateway
      - "10.1.10.1"          # Uplink to core

    lldp:
      enabled: true
      system_name: "fw-bldg-a"
      system_description: "Palo Alto PA-440 - Building A Firewall"
      port_description: "ethernet1/1"

    cdp:
      enabled: true
      platform: "Palo Alto PA-440"
      software_version: "PAN-OS 11.1.2"

    # Neighbor connections for topology discovery
    trunk_ports:
      - interface: "ethernet1/1"
        vlans: [1, 30, 50, 60, 250]
        native_vlan: 1
        remote_device: "core-rtr-01"
        remote_interface: "TenGigabitEthernet1/0/4"
      - interface: "ethernet1/2"
        vlans: [1, 30, 50, 60, 250]
        native_vlan: 1
        remote_device: "dist-sw-bldg-a-01"
        remote_interface: "TenGigabitEthernet1/0/1"

    icmp:
      enabled: true
      ttl: 64

    os_fingerprint:
      os_type: "linux"

    http:
      enabled: true
      server_name: "PAN-OS"
      endpoints:
        - path: "/php/login.php"
          response: "<html><title>Palo Alto Networks - Building A</title></html>"

    snmp_agent:
      enabled: true
      community: "enterprise-ro"
      sysname: "fw-bldg-a"
      sysdescr: "Palo Alto Networks PA-440 series firewall"
      syslocation: "Building A - MDF - Security"
      add_mibs:
        # Interface traffic counters (varimib - time-varying)
        - oid: "1.3.6.1.2.1.2.2.1.10.1"  # ifInOctets.1
          type: Counter32
          value: "varimib((100 50000))"  # +50KB/sec
        - oid: "1.3.6.1.2.1.2.2.1.16.1"  # ifOutOctets.1
          type: Counter32
          value: "varimib((100 30000))"  # +30KB/sec
        - oid: "1.3.6.1.2.1.2.2.1.10.2"  # ifInOctets.2
          type: Counter32
          value: "varimib((100 25000))"  # +25KB/sec
        - oid: "1.3.6.1.2.1.2.2.1.16.2"  # ifOutOctets.2
          type: Counter32
          value: "varimib((100 20000))"  # +20KB/sec
      traps:
        enabled: true
        receivers: ["10.20.1.100:162"]
        link_up:
          enabled: true
        link_down:
          enabled: true

  # Building A Distribution Switch
  - name: dist-sw-bldg-a-01
    type: switch
    mac: "00:01:03:01:01:01"
    ips:
      - "10.30.0.1"          # VLAN 30 - Building A Users
    vlan: 30

    lldp:
      enabled: true
      system_name: "dist-sw-bldg-a-01"
      system_description: "Cisco Catalyst 9300 - Building A Distribution"

    cdp:
