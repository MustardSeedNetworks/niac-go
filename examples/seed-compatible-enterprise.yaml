#
# 2. TCP PORT CHECKS
#    nc -zv 10.20.1.10 3306     # MySQL
#    nc -zv 10.20.1.11 5432     # PostgreSQL
#    nc -zv 10.20.1.12 1433     # MSSQL
#    nc -zv 10.20.1.20 389      # LDAP
#    nc -zv 10.20.1.20 636      # LDAPS
#    nc -zv 10.20.1.30 445      # SMB
#    nc -zv 10.20.1.40 554      # RTSP
#    nc -zv 10.100.1.20 502     # Modbus
#    nc -zv 10.100.1.30 4840    # OPC UA
#    nc -zv 10.200.1.10 104     # DICOM
#    nc -zv 10.200.1.20 2575    # HL7
#
# 3. SNMP
#    snmpwalk -v2c -c enterprise-ro 10.0.0.1 system
#    snmpwalk -v2c -c enterprise-ro 10.1.0.1 system
