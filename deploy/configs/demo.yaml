devices:
  - name: api-router
    type: router
    mac: "02:00:00:00:00:01"
    ips:
      - "10.10.0.1"
    lldp:
      enabled: true
    snmp:
      enabled: true
    snmp_agent:
      # WARNING: Change community string for production use!
      # "public" is a well-known default targeted by attackers
      community: "public"  # CHANGE IN PRODUCTION
      sysname: "api-router"
    http:
      enabled: true
      server_name: "NIAC Demo"
