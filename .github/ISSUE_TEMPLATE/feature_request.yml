name: Feature Request
description: Suggest a new feature or enhancement for NIAC
title: "[FEATURE] "
labels: ["type: feature", "status: needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature! Please fill out this form to help us understand your idea.

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: A clear and concise description of the feature you'd like.
      placeholder: Describe the feature in a sentence or two...
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What problem does this feature solve?
      placeholder: |
        I'm always frustrated when...
        Currently there's no way to...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe how you envision this feature working.
      placeholder: |
        I would like to...
        The feature should...
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which part of NIAC would this affect?
      options:
        - API/Backend
        - UI/Frontend
        - SNMP
        - LLDP/CDP
        - Protocol Simulation
        - Device Simulation
        - Templates
        - PCAP Capture/Replay
        - Configuration
        - Installation/Deployment
        - Documentation
        - CI/CD Pipeline
        - New Area
        - Multiple Areas
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: How important is this feature to you?
      options:
        - Nice to have
        - Would improve my workflow
        - Important for my use case
        - Critical - blocking my use of NIAC
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or features you've considered?

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Mockups, links to similar features in other projects, etc.
