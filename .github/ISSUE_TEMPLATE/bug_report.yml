name: Bug Report
description: Report a bug to help us improve NIAC
title: "[BUG] "
labels: ["type: defect", "status: needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill out all required fields.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
      placeholder: Describe what went wrong...
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this issue?
      placeholder: |
        1. Run niac with config '...'
        2. Send packet '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
      placeholder: Describe what you expected...
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened?
      placeholder: Describe what actually happened...
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which part of NIAC is affected? (Drives auto-labeling — see .github/workflows/labeler.yml)
      options:
        - API/Backend
        - UI/Frontend
        - SNMP
        - LLDP/CDP
        - Protocol Simulation
        - Device Simulation
        - Templates
        - PCAP Capture/Replay
        - Configuration
        - Installation/Deployment
        - Documentation
        - CI/CD Pipeline
        - Other
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: Severity
      description: How severe is this bug?
      options:
        - Critical - App crashes or data loss
        - High - Major feature broken
        - Medium - Feature partially broken
        - Low - Minor issue or cosmetic
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: NIAC Version
      description: "Run: ./niac --version or check the UI footer"
      placeholder: "e.g., v0.83.0"
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating System
      description: Which OS are you running on?
      placeholder: "e.g., Ubuntu 24.04, macOS 15.1, Fedora 41"
    validations:
      required: true

  - type: dropdown
    id: architecture
    attributes:
      label: Architecture
      description: What CPU architecture?
      options:
        - amd64 (x86_64)
        - arm64 (aarch64)
        - Other
    validations:
      required: true

  - type: textarea
    id: config
    attributes:
      label: Config snippet
      description: Paste the relevant NIAC config (redact secrets!)
      render: yaml

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Paste relevant logs (check journalctl -u niac or niac.log)
      render: shell

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Any other context about the problem.

  - type: checkboxes
    id: checklist
    attributes:
      label: Pre-submission Checklist
      options:
        - label: I have searched existing issues to ensure this isn't a duplicate
          required: true
        - label: I have included version and environment information
          required: true
