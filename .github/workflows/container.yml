name: Container Build

# NOTE: Cloud Native Buildpacks don't include libpcap-dev, which this codebase
# requires (CGO + github.com/google/gopacket/pcap). Default builders fail with
# "pcap.h: No such file or directory". Re-enable PR/push triggers once a
# builder with libpcap-dev is configured (or migrate to a Dockerfile-based
# build that installs the native dep explicitly).
on:
  workflow_dispatch:

jobs:
  pack-build:
    name: Validate Pack Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Pack CLI
        run: |
          curl -sSL https://github.com/buildpacks/pack/releases/download/v0.35.1/pack-v0.35.1-linux.tgz | tar -xz
          sudo mv pack /usr/local/bin/

      - name: Validate Pack Build
        run: pack build niac:ci --builder paketobuildpacks/builder-jammy-base
