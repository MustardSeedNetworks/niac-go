# =============================================================================
# NIAC CI Pipeline
# =============================================================================
# Network Infrastructure Analysis & Capture - Mustard Seed Networks
#
# Runs on: push to main, pull requests to main
# Jobs: backend, frontend, security, quality, build
# =============================================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ===========================================================================
  # Backend (Go)
  # ===========================================================================
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install libpcap-dev
        run: sudo apt-get update && sudo apt-get install -y libpcap-dev

      - name: Download dependencies
        run: go mod download

      - name: Verify dependencies
        run: go mod verify

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.7.2
          args: --timeout=5m

      - name: Run tests
        run: go test -v -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Check coverage threshold
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | sed 's/%//')
          echo "Coverage: ${COVERAGE}%"
          if (( $(echo "$COVERAGE < 40" | bc -l) )); then
            echo "Coverage ${COVERAGE}% is below 40% threshold"
            exit 1
          fi

      - name: Upload coverage
        uses: codecov/codecov-action@v5
        with:
          file: ./coverage.out
          flags: backend
          fail_ci_if_error: false

  # ===========================================================================
  # Frontend (TypeScript)
  # ===========================================================================
  frontend:
    name: Frontend (TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '25'
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Biome lint
        run: npx @biomejs/biome check src/

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Upload frontend build
        uses: actions/upload-artifact@v6
        with:
          name: frontend-dist
          path: ui/dist/
          retention-days: 1

  # ===========================================================================
  # Security Scanning
  # ===========================================================================
  security:
    name: Security Scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install libpcap-dev
        run: sudo apt-get update && sudo apt-get install -y libpcap-dev

      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: Run gosec
        uses: securego/gosec@v2.22.11
        with:
          args: "-fmt sarif -out gosec-results.sarif ./..."

      - name: Upload gosec results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: gosec-results.sarif

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '25'
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json

      - name: Run npm audit
        working-directory: ui
        run: |
          npm ci
          npm audit --audit-level=high || true

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@0.33.1
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif

  # ===========================================================================
  # Quality Checks
  # ===========================================================================
  quality:
    name: Quality Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Check for sensitive files
        run: |
          SENSITIVE_FILES=$(find . -type f \( \
            -name "*.env" -o \
            -name "*.pem" -o \
            -name "*.key" -o \
            -name "*secret*" -o \
            -name "*credential*" \
          \) ! -path "./.git/*" ! -name "*.example" ! -name "*.sample" 2>/dev/null || true)
          if [ -n "$SENSITIVE_FILES" ]; then
            echo "Sensitive files found:"
            echo "$SENSITIVE_FILES"
            exit 1
          fi
          echo "No sensitive files found"

      - name: Check for TODO/FIXME in critical paths
        run: |
          if grep -rn "TODO\|FIXME" --include="*.go" internal/ cmd/ pkg/ 2>/dev/null | head -20; then
            echo "Note: TODOs found in Go code (info only)"
          fi

      - name: Check for unsafe logging patterns
        run: |
          echo "Checking for dangerous logging patterns..."
          DANGEROUS_PATTERNS=(
            'log\.Print.*password'
            'log\.Print.*token'
            'log\.Print.*Authorization'
            'log\.Print.*apikey'
            'log\.Print.*secret'
            'fmt\.Printf.*password'
            'fmt\.Printf.*token'
          )
          VIOLATIONS=0
          for pattern in "${DANGEROUS_PATTERNS[@]}"; do
            if grep -rn -E "$pattern" --include="*.go" --exclude="*_test.go" internal/ cmd/ pkg/ 2>/dev/null; then
              echo "Found dangerous logging pattern: $pattern"
              VIOLATIONS=$((VIOLATIONS + 1))
            fi
          done
          if [ $VIOLATIONS -gt 0 ]; then
            echo ""
            echo "ERROR: Found $VIOLATIONS unsafe logging pattern(s)"
            echo "Avoid logging sensitive data like passwords, tokens, or secrets"
            exit 1
          fi
          echo "No unsafe logging patterns detected"

  # ===========================================================================
  # Build
  # ===========================================================================
  build:
    name: Build (${{ matrix.os }}-${{ matrix.arch }})
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
            goos: linux
            goarch: amd64
          - os: linux
            arch: arm64
            goos: linux
            goarch: arm64
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install libpcap-dev
        run: sudo apt-get update && sudo apt-get install -y libpcap-dev

      - name: Download frontend build
        uses: actions/download-artifact@v6
        with:
          name: frontend-dist
          path: ui/dist/

      - name: Copy UI dist to embed directory
        run: |
          rm -rf pkg/api/ui/* 2>/dev/null || true
          mkdir -p pkg/api/ui
          cp -r ui/dist/* pkg/api/ui/

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          VERSION=$(git describe --tags --always --dirty 2>/dev/null || echo "dev")
          go build -trimpath -buildvcs=false \
            -ldflags="-s -w -X main.version=${VERSION}" \
            -o niac-${{ matrix.os }}-${{ matrix.arch }} ./cmd/niac

      - name: Verify binary
        if: matrix.arch == 'amd64'
        run: ./niac-${{ matrix.os }}-${{ matrix.arch }} --help || ./niac-${{ matrix.os }}-${{ matrix.arch }} version || echo "Binary runs"

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: niac-${{ matrix.os }}-${{ matrix.arch }}
          path: niac-${{ matrix.os }}-${{ matrix.arch }}
          retention-days: 7
