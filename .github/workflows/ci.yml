# =============================================================================
# NIAC CI Pipeline
# =============================================================================
# Network Infrastructure Analysis & Capture - Mustard Seed Networks
#
# Runs on: push to main, pull requests to main
# Jobs: backend, frontend, security, quality, build
# =============================================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Required for the merge queue: `CI Complete` is a required status check, so
  # it must report on merge_group events too. Without this the queue would
  # accept PRs and then wait forever for a check that never fires.
  merge_group:
  workflow_dispatch:

concurrency:
  # Include the commit so a wedged run cannot block validation of a newer
  # commit on the same pull request.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

# Least-privilege default: read-only for every job. No job in this workflow
# comments on PRs or annotates checks via the API (grepped for github-script /
# octokit / gh pr / gh api — none found), so pull-requests/checks write scopes
# aren't granted anywhere. The security job below grants its own narrower
# elevated set (actions: read + security-events: write) for SARIF upload.
permissions:
  contents: read

jobs:
  # ===========================================================================
  # Path filter — classifies which areas changed so downstream jobs can skip
  # ===========================================================================
  # Adds ~5s to every run; saves several minutes when a PR only touches one
  # area (docs-only / c-only / frontend-only). The CI Complete aggregator at
  # the bottom of this file enforces that all required jobs either passed or
  # were intentionally skipped, so branch protection can require just CI
  # Complete (plus "Lint PR Title" / "Lint PR Body" from their own
  # workflows) instead of every individual job. CodeQL and License
  # Compliance are advisory, not required contexts — the `semgrep` job in
  # this file is the required SAST gate.
  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      # merge_group has no PR base to diff against, and the queue exists to test
      # the merged result — so every filter reports true there and the full
      # suite runs. Path filtering stays in effect for pull_request/push.
      backend: ${{ github.event_name == 'merge_group' && 'true' || steps.filter.outputs.backend }}
      frontend: ${{ github.event_name == 'merge_group' && 'true' || steps.filter.outputs.frontend }}
      c: ${{ github.event_name == 'merge_group' && 'true' || steps.filter.outputs.c }}
      docs: ${{ github.event_name == 'merge_group' && 'true' || steps.filter.outputs.docs }}
      ci_infra: ${{ github.event_name == 'merge_group' && 'true' || steps.filter.outputs.ci_infra }}
      schema: ${{ github.event_name == 'merge_group' && 'true' || steps.filter.outputs.schema }}
      https: ${{ github.event_name == 'merge_group' && 'true' || steps.filter.outputs.https }}
      hooks: ${{ github.event_name == 'merge_group' && 'true' || steps.filter.outputs.hooks }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        if: github.event_name != 'merge_group'
        with:
          filters: |
            backend:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - 'Makefile'
              - 'mk/**'
            frontend:
              - 'ui/**'
              - 'internal/i18n/locales/**'
              - 'scripts/i18n/**'
            c:
              - 'src/**'
              - 'include/**'
              - 'tests/c/**'
              - '.clang-tidy'
              - '.clang-format'
            docs:
              - '**/*.md'
            # Everything that *implements* a CI gate, not just the workflow
            # that calls it. niac carries 39 scripts under scripts/, most of
            # them gate implementations, and the filters enumerated only a
            # handful by name — so a PR could rewrite a gate and run no job
            # that used it, and stay green: CI Complete accepts `skipped`.
            # Enumerating scripts one at a time IS the failure mode; this is
            # the directory class that replaces it. Every job that OR'd
            # `workflows` now ORs this.
            ci_infra:
              - '.github/workflows/**'
              - '.github/actions/**'
              - 'scripts/**'
              - '.golangci.yml'
              - 'biome.json'
              - 'ui/biome.json'
            schema:
              - 'docs/schemas/**'
              - 'cmd/niac-schema/**'
            https:
              - 'cmd/niac/**'
              - 'internal/api/**'
              - 'internal/daemon/**'
              - 'deploy/macos/build-pkg.sh'
              - 'deploy/windows/build.ps1'
              - 'docs/API_EXAMPLES.md'
              - 'docs/CI_CD.md'
              - 'docs/FAQ.md'
              - 'docs/MONITORING.md'
              - 'docs/PERFORMANCE.md'
              - 'docs/README.md'
              - 'docs/WEBUI.md'
              - 'docs/openapi.yaml'
              - 'scripts/check-https-only.sh'
              - 'tests/smoke/run_smoke_tests.sh'
              - 'ui/vite.config.ts'
            hooks:
              - '.husky/**'
              - '.github/release-please-config.json'
              - '.goreleaser.yml'
              - '.goreleaser.content.yml'
              - 'deploy/nfpm/**'
              - 'deploy/windows/install.ps1'
              - 'scripts/tests/pre-commit-hook-test.sh'
              - 'scripts/tests/package-firewall-ownership-test.sh'
              - 'scripts/tests/release-content-integrity-test.sh'

  # ===========================================================================
  # Backend (Go)
  # ===========================================================================
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    # p95 ~2m15s (5 recent main/PR runs, 2026-08-15) describes runs where apt
    # was fast. The budget is sized instead so the 10-min libpcap step can go
    # to its worst case and still leave room for the work — see the e2e job.
    timeout-minutes: 20
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.schema == 'true' || needs.changes.outputs.ci_infra == 'true' || needs.changes.outputs.https == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: ./.github/actions/setup-go

      - name: Install libpcap-dev
        uses: MustardSeedNetworks/.github/.github/actions/apt-install@37513d7fbaacf4a7adaab1ac1514f021115868d1 # v1.4.0
        timeout-minutes: 10
        # packages.microsoft.com intermittently serves an unsigned/invalid
        # InRelease that aborts `apt-get update` for the whole runner, even
        # though libpcap-dev comes from the Ubuntu archive (killed Lighthouse
        # /#928 + Security Scanning/#932). A stalled Ubuntu mirror can also
        # hang apt itself for the whole job budget without running a test
        # (job 95072124340 hung 25 minutes on this exact step). The composite
        # drops the unused Microsoft source, bounds apt's own network waits,
        # and retries transient hiccups with backoff.
        with:
          packages: libpcap-dev

      - name: Verify dependencies
        # ./.github/actions/setup-go already runs `go mod download`; this
        # step only needs the extra verification setup-go doesn't do.
        run: go mod verify

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.1
          args: --timeout=5m

      - name: Verify niac.schema.json is up to date
        run: |
          # Regenerate from the current converter.Config and fail if the
          # committed schema drifts. Forces struct changes to bring the
          # schema along; refresh locally with `make schema`.
          go run ./cmd/niac-schema -o /tmp/niac.schema.json
          if ! diff -u docs/schemas/niac.schema.json /tmp/niac.schema.json; then
            echo "::error::docs/schemas/niac.schema.json is stale. Run 'make schema' and commit the result."
            exit 1
          fi
          echo "Schema is up to date."

      - name: Output-escaping / XSS gate (#742)
        run: ./scripts/check-output-escaping.sh

      - name: HTTPS-only listener gate (#1037)
        run: ./scripts/check-https-only.sh

      - name: Route-policy gate (capability registry)
        run: ./scripts/check-route-policy.sh

      - name: JSON wire-casing gate — camelCase ratchet (ADR-0007)
        run: ./scripts/check-json-casing.sh

      - name: Filename-policy gate — no monolith naming outside internal/api
        run: ./scripts/check-filename-policy.sh

      # The four products each own their tsconfig, so the strictness flags
      # drift silently — a missing one never announces itself, it just checks
      # less than its sibling does.
      - name: TypeScript strictness contract
        run: python3 scripts/check-tsconfig-flags.py

      - name: Banned-vocabulary gate (strategy reset)
        # Ported from seed, which was the only repo enforcing it. "magic" in
        # the capture/pcap/snoop parsers is file-format terminology, not
        # marketing copy, and the IEEE OUI registry carries vendor names the
        # policy would otherwise flag; both are exact, reviewable exceptions
        # in scripts/banned-vocabulary-exclusions.txt.
        run: |
          python3 scripts/test-check-banned-vocabulary.py
          python3 scripts/check-banned-vocabulary.py

      - name: Run tests
        # Plain run: fast feedback plus the coverage profile. The race
        # detector runs in its own `race` job so a race-detector crash (see
        # the Go GC segfault flake seen on stem) cannot take out the entire
        # test signal, and so a non-race failure is distinguishable at a
        # glance. This matches seed and stem.
        run: go test -v -coverprofile=coverage.out ./...

      - name: Check coverage threshold
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | sed 's/%//')
          echo "Current coverage: ${COVERAGE}%"

          # Minimum coverage threshold. Acts as an anti-regression floor.
          # Project target is 90% (CLAUDE.md). Current measured ~55%.
          #
          # Ratchet plan (raise after each release exceeds the next tier
          # by 5+ points):
          #   2026-Q2: 50 (current)
          #   2026-Q3: 55
          #   2026-Q4: 60
          #   2027-Q2: 70
          #   long-term: 90
          MIN_COVERAGE=50

          if (( $(echo "$COVERAGE < $MIN_COVERAGE" | bc -l) )); then
            echo "ERROR: Coverage ${COVERAGE}% is below minimum threshold of ${MIN_COVERAGE}%"
            exit 1
          fi

      - name: Upload coverage
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          file: ./coverage.out
          flags: backend
          fail_ci_if_error: false

  # ===========================================================================
  # Backend (macOS)
  # ===========================================================================
  # niac ships a darwin build (goreleaser `niac-darwin`, CGO_ENABLED=1), but
  # every CI job runs on ubuntu, so `internal/truststore/truststore_darwin.go`
  # and the darwin half of the library lock/sync pair were never compiled — a
  # break in them would surface at release time, not here. Cross-compiling from
  # ubuntu cannot stand in: gopacket/pcap needs cgo, so `GOOS=darwin go build`
  # fails on the pure-Go builder. macOS ships libpcap, so this needs no apt step.
  backend-darwin:
    name: Backend (macOS)
    runs-on: macos-latest
    timeout-minutes: 20
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.schema == 'true' || needs.changes.outputs.ci_infra == 'true' || needs.changes.outputs.https == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: ./.github/actions/setup-go

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # truststore is the only package with darwin-specific logic and it has
      # tests, so this both links the darwin build and exercises it.
      - name: Test
        run: go test -race ./internal/truststore/...

  # ===========================================================================
  # Backend (Windows)
  # ===========================================================================
  # niac ships a windows.exe (release.yml's build-windows, CGO+Npcap on real
  # Windows runners), but ubuntu CI never compiles internal/api's
  # _windows.go half — a break in it would surface at release time, not
  # here. Running on windows-latest links and executes the real Winsock errno
  # path (#1537: syscall.EADDRINUSE is not WSAEADDRINUSE).
  #
  # CGO_ENABLED=0 because this runner has no Npcap. That is also why the test
  # step is scoped rather than running the package: parts of internal/api do
  # reach libpcap at runtime, so a full `go test` here fails on a missing
  # wpcap.dll for reasons that have nothing to do with the code under review.
  backend-windows:
    name: Backend (Windows)
    runs-on: windows-latest
    timeout-minutes: 20
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.schema == 'true' || needs.changes.outputs.ci_infra == 'true' || needs.changes.outputs.https == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: ./.github/actions/setup-go

      - name: Build
        env:
          CGO_ENABLED: "0"
        run: go build ./internal/api/...

      - name: Vet
        env:
          CGO_ENABLED: "0"
        run: go vet ./internal/api/...

      # server_port_fallback_windows.go is the only file with Windows-specific
      # logic in this package; this both links it and exercises it.
      #
      # Scoped to those tests rather than the whole package: validateReplayRequest
      # compiles a BPF filter, which reaches libpcap and needs wpcap.dll, and
      # windows-latest has no Npcap. Build and Vet above already cover the rest of
      # the package compiling on Windows.
      - name: Test
        env:
          CGO_ENABLED: "0"
        run: go test ./internal/api/ -run 'AddrInUse|BindWithFallback' -v

  race:
    name: Backend (race detector)
    runs-on: ubuntu-latest
    # p95 ~6m20s (5 recent main/PR runs, 2026-08-15), plus headroom for the
    # 10-min libpcap step's worst case — see the e2e job.
    timeout-minutes: 20
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.schema == 'true' || needs.changes.outputs.ci_infra == 'true' || needs.changes.outputs.https == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: ./.github/actions/setup-go

      - name: Install libpcap-dev
        uses: MustardSeedNetworks/.github/.github/actions/apt-install@37513d7fbaacf4a7adaab1ac1514f021115868d1 # v1.4.0
        timeout-minutes: 10
        # packages.microsoft.com intermittently serves an unsigned/invalid
        # InRelease that aborts `apt-get update` for the whole runner, even
        # though libpcap-dev comes from the Ubuntu archive (killed Lighthouse
        # /#928 + Security Scanning/#932). A stalled Ubuntu mirror can also
        # hang apt itself for the whole job budget without running a test
        # (job 95072124340 hung 25 minutes on this exact step). The composite
        # drops the unused Microsoft source, bounds apt's own network waits,
        # and retries transient hiccups with backoff.
        with:
          packages: libpcap-dev

      - name: Run tests with race detector
        run: go test -race ./...

  # ===========================================================================
  # Frontend (TypeScript)
  # ===========================================================================
  frontend:
    name: Frontend (TypeScript)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.ci_infra == 'true'
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: ./.github/actions/setup-node

      - name: Install dependencies
        run: npm ci

      - name: Run Biome lint
        run: npx @biomejs/biome check src/

      - name: Design token discipline (Phase 0 gate)
        run: ../scripts/check-token-discipline.sh

      - name: Type check
        run: npm run typecheck

      - name: Run unit tests
        # vitest gates the frontend job so a red or missing-provider test can
        # never reach main invisibly (regression: #930 landed a red test while
        # this job only ran lint/typecheck/build).
        run: npm run test

      - name: Build
        run: npm run build

      - name: Upload frontend build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-dist
          path: internal/api/ui/
          retention-days: 1

      - name: Build Storybook
        run: npm run build-storybook -- --output-dir storybook-static --quiet

      - name: Upload Storybook static
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: storybook-static
          path: ui/storybook-static/
          retention-days: 7

  # ===========================================================================
  # Security Scanning
  # ===========================================================================
  security:
    name: Security Scanning
    runs-on: ubuntu-latest
    timeout-minutes: 16
    # Always runs — security checks are non-negotiable on every PR.
    permissions:
      # Job-level `permissions:` REPLACES the workflow-level block entirely
      # (they don't merge) — `actions: read` from the top-level block was
      # silently dropped here, which broke the codeql-action/upload-sarif
      # step below ("Resource not accessible by integration") and skipped
      # every step after it (npm audit, gitleaks, Trivy) on 2026-07-04.
      actions: read
      contents: read
      # github/codeql-action/upload-sarif@v4 requires security-events: write
      # to push results to the Security tab (regressed from a default-on
      # permission in earlier versions). Trivy and gosec both use this
      # action to upload SARIF.
      security-events: write
    steps:
      # fetch-depth: 0 required for gitleaks-action's commit-range scan
      # (default shallow clone fails with "unknown revision" when base^
      # isn't reachable, especially after rebases/force-pushes).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: ./.github/actions/setup-go

      - name: Install libpcap-dev
        uses: MustardSeedNetworks/.github/.github/actions/apt-install@37513d7fbaacf4a7adaab1ac1514f021115868d1 # v1.4.0
        timeout-minutes: 10
        # packages.microsoft.com intermittently serves an unsigned/invalid
        # InRelease that aborts `apt-get update` for the whole runner, even
        # though libpcap-dev comes from the Ubuntu archive (killed Lighthouse
        # /#928 + Security Scanning/#932). A stalled Ubuntu mirror can also
        # hang apt itself for the whole job budget without running a test
        # (job 95072124340 hung 25 minutes on this exact step). The composite
        # drops the unused Microsoft source, bounds apt's own network waits,
        # and retries transient hiccups with backoff.
        with:
          packages: libpcap-dev

      - name: Run govulncheck
        # make security-backend runs `go tool govulncheck` (declared in
        # go.mod's tool directive, resolved via go.sum); using the target
        # here keeps the invocation in sync with `make security` / `make
        # verify` locally instead of duplicating it.
        run: make security-backend

      - name: Run gosec
        uses: securego/gosec@9e75c0576c9878035d4221392108d458abe10fc3 # v2.28.0
        with:
          args: "-no-fail -fmt sarif -out gosec-results.sarif ./..."

      - name: Upload gosec results
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        # Code scanning requires a public repo or Advanced Security (same
        # gate as codeql.yml); gosec enforcement stays blocking via the
        # golangci-lint gosec linter in the backend job.
        if: always() && github.event.repository.visibility == 'public'
        with:
          sarif_file: gosec-results.sarif

      - name: Set up Node.js
        uses: ./.github/actions/setup-node

      - name: Install npm dependencies
        working-directory: ui
        run: npm ci

      - name: Run npm audit
        # Was `npm audit --audit-level=high || true` — the `|| true` silently
        # discarded npm audit's exit code, so this step reported green
        # regardless of findings. make security-frontend propagates the
        # real exit code (see mk/security.mk).
        run: make security-frontend

      # gitleaks-action requires a paid licence for organization repos. Use the
      # MIT-licensed gitleaks CLI directly instead — same engine, same config.
      # Scans full history (the security job checks out with fetch-depth: 0).
      - name: Run gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
          # SHA-256 of gitleaks_8.30.1_linux_x64.tar.gz from the upstream
          # checksums.txt. Rotate this together with GITLEAKS_VERSION on upgrade.
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git . --config .gitleaks.toml --redact --no-banner --exit-code 1

      - name: Run Trivy vulnerability scanner
        # Trivy moved to v-prefixed tags between 0.35 and 0.36; the bare
        # version no longer resolves.
        # exit-code is 0 here so the SARIF always gets written; we still
        # surface findings as a separate step that fails CI when the SARIF
        # contains CRITICAL/HIGH entries.
        id: trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      - name: Upload Trivy results
        # Code scanning requires a public repo or Advanced Security (same
        # gate as codeql.yml); the "Fail on CRITICAL/HIGH findings" step
        # below still blocks on the SARIF content regardless of visibility.
        if: always() && hashFiles('trivy-results.sarif') != '' && github.event.repository.visibility == 'public'
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          sarif_file: trivy-results.sarif

      - name: Fail on CRITICAL/HIGH findings
        # Reads the SARIF Trivy just produced and fails CI if any CRITICAL or
        # HIGH-severity result is present. We do this in a separate step so
        # the SARIF is always uploaded for security tab visibility.
        if: always() && hashFiles('trivy-results.sarif') != ''
        run: |
          if jq -e '.runs[].results[] | select(.level=="error" or .properties.security_severity == "high" or .properties.security_severity == "critical")' trivy-results.sarif >/dev/null; then
            echo "::error::Trivy found CRITICAL or HIGH severity issues — see Security tab."
            jq '.runs[].results[] | {ruleId, level, severity: .properties.security_severity, message: .message.text}' trivy-results.sarif
            exit 1
          fi

  # ===========================================================================
  # Semgrep SAST — required gate (Phase 4, replaces CodeQL as the required
  # SAST signal since CodeQL is advisory-only)
  # ===========================================================================
  # Blocking on ERROR severity only for now — a deliberate first step,
  # mirroring the seed/stem rollout. WARNING/MEDIUM findings are visible in
  # the job log but do not fail the build yet; ratchet to a stricter
  # --severity once any WARNING backlog is triaged in a follow-up.
  #
  # Runs unconditionally (no path filter) — same rationale as `security`
  # above: SAST coverage on every PR is non-negotiable, and Semgrep is fast
  # enough (~1-2 min for this ruleset) that gating it behind path filters
  # isn't worth the added complexity.
  # Defined once in MustardSeedNetworks/.github (fleet-shared); ci-complete
  # still needs: [semgrep]. Edit the pinned version / config policy there.
  semgrep:
    uses: MustardSeedNetworks/.github/.github/workflows/semgrep.yml@37513d7fbaacf4a7adaab1ac1514f021115868d1 # v1.4.0
    permissions:
      contents: read

  # Asserts this repo's own gates are wired to gate: every job below is either
  # in ci-complete's needs or documented in .github/ci-advisory-jobs.txt, the
  # enabled linters meet the declared tier, and tool installs are pinned. Two
  # such gaps were found by hand on 2026-08-16; both arrived via a merge, which
  # is why this runs per PR rather than on a schedule.
  # Defined once in MustardSeedNetworks/.github (fleet-shared); ci-complete
  # still needs: [ci-conformance].
  ci-conformance:
    uses: MustardSeedNetworks/.github/.github/workflows/ci-conformance.yml@37513d7fbaacf4a7adaab1ac1514f021115868d1 # v1.4.0
    permissions:
      contents: read

  # ===========================================================================
  # Quality Checks
  # ===========================================================================
  quality:
    name: Quality Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true' || needs.changes.outputs.c == 'true' || needs.changes.outputs.ci_infra == 'true' || needs.changes.outputs.hooks == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check file sizes
        run: |
          chmod +x scripts/check-file-size.sh
          ./scripts/check-file-size.sh

      - name: Test pre-commit hook
        run: ./scripts/tests/pre-commit-hook-test.sh

      - name: Test release content integrity contract
        run: ./scripts/tests/release-content-integrity-test.sh

      - name: Test package firewall ownership lifecycle
        run: ./scripts/tests/package-firewall-ownership-test.sh

      - name: Check for sensitive files
        run: |
          SENSITIVE_FILES=$(find . -type f \( \
            -name "*.env" -o \
            -name "*.pem" -o \
            -name "*.key" -o \
            -name "*secret*" -o \
            -name "*credential*" \
          \) ! -path "./.git/*" ! -name "*.example" ! -name "*.sample" 2>/dev/null || true)
          if [ -n "$SENSITIVE_FILES" ]; then
            echo "Sensitive files found:"
            echo "$SENSITIVE_FILES"
            exit 1
          fi
          echo "No sensitive files found"

      - name: Check for TODO/FIXME in critical paths
        run: |
          if grep -rn "TODO\|FIXME" --include="*.go" internal/ cmd/ pkg/ 2>/dev/null | head -20; then
            echo "Note: TODOs found in Go code (info only)"
          fi

      - name: Check for unsafe logging patterns
        run: |
          echo "Checking for dangerous logging patterns..."
          DANGEROUS_PATTERNS=(
            'log\.Print.*password'
            'log\.Print.*token'
            'log\.Print.*Authorization'
            'log\.Print.*apikey'
            'log\.Print.*secret'
            'fmt\.Printf.*password'
            'fmt\.Printf.*token'
          )
          VIOLATIONS=0
          for pattern in "${DANGEROUS_PATTERNS[@]}"; do
            if grep -rn -E "$pattern" --include="*.go" --exclude="*_test.go" internal/ cmd/ pkg/ 2>/dev/null; then
              echo "Found dangerous logging pattern: $pattern"
              VIOLATIONS=$((VIOLATIONS + 1))
            fi
          done
          if [ $VIOLATIONS -gt 0 ]; then
            echo ""
            echo "ERROR: Found $VIOLATIONS unsafe logging pattern(s)"
            echo "Avoid logging sensitive data like passwords, tokens, or secrets"
            exit 1
          fi
          echo "No unsafe logging patterns detected"

  # ===========================================================================
  # Documentation Checks
  # ===========================================================================
  # Internationalization (i18n) Checks
  # ===========================================================================
  # Workflow Linting
  # ===========================================================================
  # Static analysis of the workflows themselves. Kept out of `quality` so it
  # runs in parallel and only when workflow files actually change.
  #   actionlint — syntax, expression and shell errors inside run: blocks.
  #                It caught a duplicated `with:` key that PyYAML accepts
  #                silently by keeping the last occurrence.
  #   zizmor     — Actions security scanner. Blocks on High findings only.
  #                The repo is at zero High; the one that survives review carries
  #                a `# zizmor: ignore[...]` comment with the reasoning inline
  #                (release-please.yml:21).
  #                Low/Informational (~29) are reported but not yet enforced.
  workflow-lint:
    name: Workflow Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: changes
    if: needs.changes.outputs.ci_infra == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: ./.github/actions/setup-go

      - name: Run actionlint
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          # SC2129 is a pure style preference about grouping `>>` redirects in
          # step summaries; the ungrouped form stays readable and diffs one
          # line at a time. Every correctness-level rule stays enabled.
          actionlint -ignore 'SC2129' -color

      - name: Run zizmor
        env:
          # zizmor resolves action refs against the API; without a token it
          # falls back to unauthenticated requests and gets rate-limited.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pipx install zizmor==1.29.0
          zizmor --min-severity high --color always .github/workflows/


  # ===========================================================================
  # Validates the translation locale files in internal/i18n/locales/ against
  # the cross-repo conventions in msn-docs-internal/05-Engineering/. The checks
  # live once in MustardSeedNetworks/.github; this repo keeps only its own
  # glossary, banned vocabulary, glossary exceptions and dynamic-prefix
  # allow-list. The extractor-drift check below is niac-only and stays here.
  i18n:
    name: i18n Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: changes
    if: |
      needs.changes.outputs.frontend == 'true'
      || needs.changes.outputs.ci_infra == 'true'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-node

      - name: Install frontend dependencies
        working-directory: ui
        run: npm ci

      - name: Check extracted keys and extractor fixtures
        working-directory: ui
        run: npm run i18n:lint && npm run i18n:check && npm run i18n:test

      # The shared gate: installs semgrep, self-tests the key checker, then
      # validates. Defined once in MustardSeedNetworks/.github — edit the
      # checks there, the data files here. See scripts/i18n/README.md and
      # msn-docs-internal/05-Engineering/I18N_CONVENTIONS.md.
      - name: Validate i18n (parity, glossary, banned vocab, etc.)
        uses: MustardSeedNetworks/.github/.github/actions/i18n-validate@e6d74ebd42168c9b89f2b93f14841f58b90edece # v1.5.0

  # ===========================================================================
  # Documentation Checks
  # ===========================================================================
  # Markdown lint + link check. Mirrors seed's docs job (#56). Both substeps
  # are advisory (continue-on-error) — they surface issues without blocking
  # the build, matching seed's stance that doc quality is a ratcheting goal.
  docs:
    name: Documentation Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # External link checking is NOT here: it walked every URL in every .md file
    # and measured ~6 min — the longest job in this workflow and, on a
    # backend-only change, the entire critical path. It also failed on
    # third-party link rot rather than on the change under review, which is why
    # it was pinned to continue-on-error and enforced nothing.
    # It now runs on a schedule: .github/workflows/docs-link-check.yml

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Needed to diff against the base ref for changed-file scoping.
          fetch-depth: 0

      - name: Collect changed markdown files
        id: changed-md
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: |
          set -euo pipefail
          if [ -n "${BASE_SHA}" ] && git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            files=$(git diff --name-only --diff-filter=ACMR "${BASE_SHA}" HEAD -- '*.md')
          else
            files=$(git ls-files '*.md')
          fi
          files=$(printf '%s\n' "${files}" | grep -vE '^(node_modules|build|dist|coverage)/' | grep -v 'CHANGELOG.md$' || true)
          {
            echo "files<<EOF"
            printf '%s\n' "${files}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          if [ -z "${files}" ]; then echo "empty=true" >> "$GITHUB_OUTPUT"; fi

      # Blocking, but scoped to the files this change touches. The repo carries
      # ~1.2k pre-existing violations of its own markdownlint config; gating the
      # full tree would fail every PR, and gating nothing (the previous
      # continue-on-error) enforced nothing. Scoping ratchets the debt down as
      # files are touched, matching the file-size gate's baseline approach.
      - name: Lint changed markdown files
        if: steps.changed-md.outputs.empty != 'true'
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
        with:
          globs: ${{ steps.changed-md.outputs.files }}

  # ===========================================================================
  # Build
  # ===========================================================================
  build:
    name: Build (${{ matrix.os }}-${{ matrix.arch }})
    needs: [changes, backend, frontend]
    runs-on: ubuntu-latest
    # p95 ~1m10s (5 recent main/PR runs, 2026-08-15). Was 6 — under the 10-min
    # libpcap step it contains, so a slow mirror could not fail cleanly here.
    timeout-minutes: 16
    # gopacket/pcap requires CGO + libpcap. CI verifies a native amd64 build
    # only — release.yml handles the arm64 cross-compile (gcc-aarch64-linux-gnu
    # + libpcap-dev:arm64) when actually publishing artifacts.
    # always() lets the if: evaluate when backend was skipped upstream.
    if: |
      always() &&
      needs.frontend.result == 'success' &&
      (needs.backend.result == 'success' || needs.backend.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
            goos: linux
            goarch: amd64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: ./.github/actions/setup-go

      - name: Install libpcap-dev
        uses: MustardSeedNetworks/.github/.github/actions/apt-install@37513d7fbaacf4a7adaab1ac1514f021115868d1 # v1.4.0
        timeout-minutes: 10
        # packages.microsoft.com intermittently serves an unsigned/invalid
        # InRelease that aborts `apt-get update` for the whole runner, even
        # though libpcap-dev comes from the Ubuntu archive (killed Lighthouse
        # /#928 + Security Scanning/#932). A stalled Ubuntu mirror can also
        # hang apt itself for the whole job budget without running a test
        # (job 95072124340 hung 25 minutes on this exact step). The composite
        # drops the unused Microsoft source, bounds apt's own network waits,
        # and retries transient hiccups with backoff.
        with:
          packages: libpcap-dev

      - name: Download frontend build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: frontend-dist
          path: internal/api/ui/

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '1'
        run: |
          VERSION=$(git describe --tags --always --dirty 2>/dev/null || echo "dev")
          COMMIT=$(git rev-parse --short HEAD 2>/dev/null || echo "unknown")
          BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          # UI build hash matches Makefile recipe; mandatory per CLAUDE.md
          # Universal Build Contract.
          UI_BUILD_HASH=$(find internal/api/ui -type f -exec md5sum {} \; 2>/dev/null | sort | md5sum 2>/dev/null | cut -d' ' -f1)
          echo "UI_BUILD_HASH=${UI_BUILD_HASH}"

          go build -trimpath -buildvcs=false \
            -ldflags="-s -w \
              -X github.com/MustardSeedNetworks/niac-go/internal/version.Version=${VERSION} \
              -X github.com/MustardSeedNetworks/niac-go/internal/version.Commit=${COMMIT} \
              -X github.com/MustardSeedNetworks/niac-go/internal/version.BuildTime=${BUILD_TIME} \
              -X github.com/MustardSeedNetworks/niac-go/internal/version.UIBuildHash=${UI_BUILD_HASH}" \
            -o niac-${{ matrix.os }}-${{ matrix.arch }} ./cmd/niac

      - name: Verify binary
        run: ./niac-${{ matrix.os }}-${{ matrix.arch }} --help || ./niac-${{ matrix.os }}-${{ matrix.arch }} version || echo "Binary runs"

      - name: Verify UIBuildHash embedded (Universal Build Contract)
        # seed and stem both verify this; niac injected the ldflag but never
        # checked it landed. Without the check a build that misses the flag
        # ships happily and /__version returns uiBuildHash="unknown" — exactly
        # the silent contract violation Build Contract rule #6 exists to catch.
        # Static check: the binary must contain the md5 of the embedded UI
        # assets. Cheaper and more reliable than booting the server in CI.
        run: |
          if [ -z "$(find internal/api/ui -mindepth 1 ! -name '.gitkeep' -print -quit 2>/dev/null)" ]; then
            echo "::error::internal/api/ui is empty — frontend-dist artifact missing?"
            exit 1
          fi
          EXPECTED=$(find internal/api/ui -type f -exec md5sum {} \; 2>/dev/null | sort | md5sum 2>/dev/null | cut -d' ' -f1)
          if [ "${#EXPECTED}" -ne 32 ]; then
            echo "::error::Computed UI_BUILD_HASH is not 32 chars: '${EXPECTED}'"
            exit 1
          fi
          echo "Expected UIBuildHash: ${EXPECTED}"
          BIN="niac-${{ matrix.os }}-${{ matrix.arch }}"
          if strings "${BIN}" | grep -qF "${EXPECTED}"; then
            echo "  ✓ ${BIN}: UIBuildHash embedded correctly"
          else
            echo "::error::${BIN} does not contain UIBuildHash ${EXPECTED}"
            echo "  → Universal Build Contract violated. Check the -X ...UIBuildHash=... ldflag in the 'Build binary' step."
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: niac-${{ matrix.os }}-${{ matrix.arch }}
          path: niac-${{ matrix.os }}-${{ matrix.arch }}
          retention-days: 7

  # ===========================================================================
  # E2E Browser Tests (Playwright)
  # ===========================================================================
  e2e:
    name: E2E Browser Tests
    runs-on: ubuntu-latest
    needs: [changes, backend, frontend]
    # NOT sized from p95. A job budget has to exceed its apt steps' worst case
    # plus the actual work, or a slow mirror becomes indistinguishable from a
    # hung test. This job has two apt steps at 10 min each; p95 (~5m8s) only
    # describes runs where apt was fast, so budgeting to it guarantees the
    # pathological run dies. Sized to 12 that way, it did: on 2026-08-18 a slow
    # libpcap install took 5.5 min, the job hit its budget mid-test, and the
    # merge queue ejected release PR #1349 for what looked like a test failure
    # (run 32161326698). That is the mechanism behind stem#664's "PRs silently
    # leave the merge queue after successful runs".
    timeout-minutes: 25
    # Skipped on draft PRs (slow); also skipped if no frontend/backend changed.
    # always() lets the if: evaluate when backend was skipped upstream.
    if: |
      always() &&
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false) &&
      needs.frontend.result == 'success' &&
      (needs.backend.result == 'success' || needs.backend.result == 'skipped')

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: ./.github/actions/setup-go

      - name: Set up Node.js
        uses: ./.github/actions/setup-node

      - name: Install libpcap-dev
        uses: MustardSeedNetworks/.github/.github/actions/apt-install@37513d7fbaacf4a7adaab1ac1514f021115868d1 # v1.4.0
        timeout-minutes: 10
        # packages.microsoft.com intermittently serves an unsigned/invalid
        # InRelease that aborts `apt-get update` for the whole runner, even
        # though libpcap-dev comes from the Ubuntu archive (killed Lighthouse
        # /#928 + Security Scanning/#932). A stalled Ubuntu mirror can also
        # hang apt itself for the whole job budget without running a test
        # (job 95072124340 hung 25 minutes on this exact step). The composite
        # drops the unused Microsoft source, bounds apt's own network waits,
        # and retries transient hiccups with backoff.
        with:
          packages: libpcap-dev

      - name: Download frontend build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: frontend-dist
          path: internal/api/ui/

      - name: Install frontend dependencies (for Playwright)
        working-directory: ui
        run: npm ci

      - name: Build backend
        run: |
          VERSION=$(git describe --tags --always --dirty 2>/dev/null || echo "dev")
          COMMIT=$(git rev-parse --short HEAD 2>/dev/null || echo "unknown")
          BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          UI_BUILD_HASH=$(find internal/api/ui -type f -exec md5sum {} \; 2>/dev/null | sort | md5sum 2>/dev/null | cut -d' ' -f1)
          go build -trimpath -buildvcs=false \
            -ldflags="-s -w \
              -X github.com/MustardSeedNetworks/niac-go/internal/version.Version=${VERSION} \
              -X github.com/MustardSeedNetworks/niac-go/internal/version.Commit=${COMMIT} \
              -X github.com/MustardSeedNetworks/niac-go/internal/version.BuildTime=${BUILD_TIME} \
              -X github.com/MustardSeedNetworks/niac-go/internal/version.UIBuildHash=${UI_BUILD_HASH}" \
            -o niac ./cmd/niac

      - name: Install Playwright OS dependencies
        uses: MustardSeedNetworks/.github/.github/actions/apt-install@37513d7fbaacf4a7adaab1ac1514f021115868d1 # v1.4.0
        timeout-minutes: 10
        # Not removable: the runner image ships none of webkit's GStreamer/font
        # stack. A stalled Ubuntu mirror can hang apt for the whole job budget
        # without running a test (stem job 95068053052), because apt waits
        # forever on a dead connection by default. The composite bounds apt's
        # own network waits (via playwright's internal apt calls) and retries
        # the transient case.
        with:
          command: cd ui && npx playwright install-deps chromium webkit
          command-timeout: '270'

      # Restore always; save only from the default branch. Caches are scoped
      # per ref, so a PR that saves writes its own copy that dies on merge —
      # see the comment in .github/actions/setup-go for the incident.
      - name: Restore Playwright browsers
        id: playwright-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ hashFiles('ui/package-lock.json') }}
          restore-keys: |
            playwright-browsers-${{ runner.os }}-

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: ui
        run: npx playwright install chromium webkit

      - name: Save Playwright browsers (default branch only)
        if: steps.playwright-cache.outputs.cache-hit != 'true' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ hashFiles('ui/package-lock.json') }}

      - name: Start backend server
        env:
          # The gui-daemon.spec.ts simulation test targets a synthetic
          # interface (e2e-dry-run0) that does not exist on the runner. The
          # daemon honours this env var to run simulations in dry-run mode,
          # skipping the real capture-engine bind. Without it the daemon
          # returns "interface does not exist" (500), which is exactly the
          # regression that slipped onto main when 4ebb685 added the test and
          # daemon support but never wired the env var into CI.
          NIAC_E2E_DRY_RUN_SIMULATION: "1"
        run: |
          # Backend is HTTPS-only since #663 (the --http flag was removed and
          # the legacy HTTP listener deleted). Self-signed cert auto-generated
          # on first start. Use canonical TLS port 8445 per CLAUDE.md.
          nohup ./niac daemon --listen 127.0.0.1:8445 > server.log 2>&1 &
          echo "Waiting for server to start..."
          for i in {1..30}; do
            if curl -skf https://localhost:8445/__version 2>/dev/null; then
              echo "Server ready after $i attempts"
              exit 0
            fi
            echo "Attempt $i: Server not ready, waiting..."
            sleep $((i < 5 ? 1 : 2))
          done
          echo "Server failed to start after 30 attempts"
          cat server.log
          exit 1

      - name: Run Playwright E2E tests
        working-directory: ui
        env:
          E2E_BASE_URL: https://localhost:8445
          PLAYWRIGHT_IGNORE_HTTPS_ERRORS: "true"
        run: npx playwright test --reporter=html

      - name: Run authenticated browser E2E tests
        working-directory: ui
        run: npm run test:e2e:auth

      - name: Upload Playwright report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: playwright-report
          path: ui/playwright-report/
          retention-days: 7

      - name: Upload server logs on failure
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: e2e-server-logs
          path: server.log

  # ===========================================================================
  # CI Complete — dispatcher / branch-protection aggregator
  # ===========================================================================
  # Every required-status-check on `main` is consolidated into this single
  # job. It fails if any upstream job actually failed; it passes if every
  # upstream either succeeded or was intentionally skipped via the path
  # filter. Branch protection requires ONLY "CI Complete" (plus "Lint PR
  # Title" / "Lint PR Body" from their own workflows) — not every individual
  # job — so docs-only PRs merge cleanly when backend/frontend/c are all
  # skipped. CodeQL and License Compliance are NOT required contexts: CodeQL
  # is advisory and License Compliance reports without blocking. The
  # `semgrep` job in this file is the required SAST gate (blocking on ERROR
  # severity).
  ci-complete:
    name: CI Complete
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Browser-engine E2E is release-blocking.
    needs:
      - changes
      - backend
      - backend-darwin
      - backend-windows
      - race
      - frontend
      - security
      - semgrep
      - ci-conformance
      - quality
      - workflow-lint
      - docs
      - build
      - e2e
      - i18n
    if: always()
    steps:
      - name: Verify upstream results
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "Upstream job results:"
          echo "$RESULTS" | jq '.'
          if ! echo "$RESULTS" | jq -e 'to_entries | map(.value.result) | all(. == "success" or . == "skipped")' >/dev/null; then
            echo "::error::One or more required CI jobs failed or were cancelled."
            exit 1
          fi
          echo "All required CI jobs passed (or were intentionally skipped)."
