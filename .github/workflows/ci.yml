# =============================================================================
# NIAC CI Pipeline
# =============================================================================
# Network Infrastructure Analysis & Capture - Mustard Seed Networks
#
# Runs on: push to main, pull requests to main
# Jobs: backend, frontend, security, quality, build
# =============================================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  pull-requests: write
  checks: write
  security-events: write

jobs:
  # ===========================================================================
  # Path filter — classifies which areas changed so downstream jobs can skip
  # ===========================================================================
  # Adds ~5s to every run; saves several minutes when a PR only touches one
  # area (docs-only / c-only / frontend-only). The CI Complete aggregator at
  # the bottom of this file enforces that all required jobs either passed or
  # were intentionally skipped, so branch protection can require just CI
  # Complete (plus CodeQL/license-check from other workflows) instead of
  # every individual job.
  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      c: ${{ steps.filter.outputs.c }}
      docker: ${{ steps.filter.outputs.docker }}
      docs: ${{ steps.filter.outputs.docs }}
      workflows: ${{ steps.filter.outputs.workflows }}
      schema: ${{ steps.filter.outputs.schema }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        id: filter
        with:
          filters: |
            backend:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - 'Makefile'
              - 'mk/**'
            frontend:
              - 'ui/**'
            c:
              - 'src/**'
              - 'include/**'
              - 'tests/c/**'
              - '.clang-tidy'
              - '.clang-format'
            docker:
              - 'Dockerfile*'
              - '.dockerignore'
            docs:
              - '**/*.md'
            workflows:
              - '.github/workflows/**'
            schema:
              - 'docs/schemas/**'
              - 'cmd/niac-schema/**'

  # ===========================================================================
  # Backend (Go)
  # ===========================================================================
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.schema == 'true' || needs.changes.outputs.workflows == 'true'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Go
        uses: ./.github/actions/setup-go

      - name: Install libpcap-dev
        run: sudo apt-get update && sudo apt-get install -y libpcap-dev

      - name: Download dependencies
        run: go mod download

      - name: Verify dependencies
        run: go mod verify

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@82606bf257cbaff209d206a39f5134f0cfbfd2ee # v9.2.1
        with:
          version: v2.12.1
          args: --timeout=5m

      - name: Verify niac.schema.json is up to date
        run: |
          # Regenerate from the current converter.Config and fail if the
          # committed schema drifts. Forces struct changes to bring the
          # schema along; refresh locally with `make schema`.
          go run ./cmd/niac-schema -o /tmp/niac.schema.json
          if ! diff -u docs/schemas/niac.schema.json /tmp/niac.schema.json; then
            echo "::error::docs/schemas/niac.schema.json is stale. Run 'make schema' and commit the result."
            exit 1
          fi
          echo "Schema is up to date."

      - name: Run tests
        run: go test -v -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Check coverage threshold
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | sed 's/%//')
          echo "Current coverage: ${COVERAGE}%"

          # Minimum coverage threshold. Acts as an anti-regression floor.
          # Project target is 90% (CLAUDE.md). Current measured ~55%.
          #
          # Ratchet plan (raise after each release exceeds the next tier
          # by 5+ points):
          #   2026-Q2: 50 (current)
          #   2026-Q3: 55
          #   2026-Q4: 60
          #   2027-Q2: 70
          #   long-term: 90
          MIN_COVERAGE=50

          if (( $(echo "$COVERAGE < $MIN_COVERAGE" | bc -l) )); then
            echo "ERROR: Coverage ${COVERAGE}% is below minimum threshold of ${MIN_COVERAGE}%"
            exit 1
          fi

      - name: Upload coverage
        uses: codecov/codecov-action@e79a6962e0d4c0c17b229090214935d2e33f8354 # v6.0.1
        with:
          file: ./coverage.out
          flags: backend
          fail_ci_if_error: false

  # ===========================================================================
  # Go Race Detector
  # ===========================================================================
  # Dedicated race-only job to match seed's CI matrix (#56). The main backend
  # job already runs the full suite under -race; this job is a separate gate
  # so a race-detector regression shows up as its own failing check rather
  # than blocking the broader backend pipeline.
  race:
    name: Backend (race detector)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true' || needs.changes.outputs.workflows == 'true'
    env:
      GOMODCACHE: ${{ github.workspace }}/.cache/go/pkg/mod
      GOCACHE: ${{ github.workspace }}/.cache/go/build

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Go
        uses: ./.github/actions/setup-go

      - name: Install libpcap-dev
        run: sudo apt-get update && sudo apt-get install -y libpcap-dev

      - name: Set up Node.js
        uses: ./.github/actions/setup-node

      - name: Build embedded UI assets
        working-directory: ui
        run: |
          npm ci
          npm run build

      - name: Run tests with race detector
        run: go test -short -race ./...

  # ===========================================================================
  # Frontend (TypeScript)
  # ===========================================================================
  frontend:
    name: Frontend (TypeScript)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.workflows == 'true'
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node.js
        uses: ./.github/actions/setup-node

      - name: Install dependencies
        run: npm ci

      - name: Run Biome lint
        run: npx @biomejs/biome check src/

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Upload frontend build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-dist
          path: internal/api/ui/
          retention-days: 1

      - name: Build Storybook
        run: npm run build-storybook -- --output-dir storybook-static --quiet

      - name: Upload Storybook static
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: storybook-static
          path: ui/storybook-static/
          retention-days: 7

  # ===========================================================================
  # Security Scanning
  # ===========================================================================
  security:
    name: Security Scanning
    runs-on: ubuntu-latest
    # Always runs — security checks are non-negotiable on every PR.
    permissions:
      contents: read
      # github/codeql-action/upload-sarif@v4 requires security-events: write
      # to push results to the Security tab (regressed from a default-on
      # permission in earlier versions). Trivy and gosec both use this
      # action to upload SARIF.
      security-events: write
    steps:
      # fetch-depth: 0 required for gitleaks-action's commit-range scan
      # (default shallow clone fails with "unknown revision" when base^
      # isn't reachable, especially after rebases/force-pushes).
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: ./.github/actions/setup-go

      - name: Install libpcap-dev
        run: sudo apt-get update && sudo apt-get install -y libpcap-dev

      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: Run gosec
        uses: securego/gosec@4a3bd8af174872c778439083ded7adbf3747e770 # v2.26.1
        with:
          args: "-no-fail -fmt sarif -out gosec-results.sarif ./..."

      - name: Upload gosec results
        uses: github/codeql-action/upload-sarif@7211b7c8077ea37d8641b6271f6a365a22a5fbfa # v4.36.0
        if: always()
        with:
          sarif_file: gosec-results.sarif

      - name: Set up Node.js
        uses: ./.github/actions/setup-node

      - name: Run npm audit
        working-directory: ui
        run: |
          npm ci
          npm audit --audit-level=high || true

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Trivy vulnerability scanner
        # Trivy moved to v-prefixed tags between 0.35 and 0.36; the bare
        # version no longer resolves.
        # exit-code is 0 here so the SARIF always gets written; we still
        # surface findings as a separate step that fails CI when the SARIF
        # contains CRITICAL/HIGH entries.
        id: trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      - name: Upload Trivy results
        if: always() && hashFiles('trivy-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@7211b7c8077ea37d8641b6271f6a365a22a5fbfa # v4.36.0
        with:
          sarif_file: trivy-results.sarif

      - name: Fail on CRITICAL/HIGH findings
        # Reads the SARIF Trivy just produced and fails CI if any CRITICAL or
        # HIGH-severity result is present. We do this in a separate step so
        # the SARIF is always uploaded for security tab visibility.
        if: always() && hashFiles('trivy-results.sarif') != ''
        run: |
          if jq -e '.runs[].results[] | select(.level=="error" or .properties.security_severity == "high" or .properties.security_severity == "critical")' trivy-results.sarif >/dev/null; then
            echo "::error::Trivy found CRITICAL or HIGH severity issues — see Security tab."
            jq '.runs[].results[] | {ruleId, level, severity: .properties.security_severity, message: .message.text}' trivy-results.sarif
            exit 1
          fi

  # ===========================================================================
  # C Lint (C23 Standard - NOT C++)
  # ===========================================================================
  c-lint:
    name: C Lint (C23)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.c == 'true' || needs.changes.outputs.workflows == 'true'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install C23 tools (clang-tidy, cppcheck, bear)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang-18 \
            clang-tidy-18 \
            clang-format-18 \
            cppcheck \
            bear \
            gcc-13

          # Set clang-18 as default
          sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-18 100
          sudo update-alternatives --install /usr/bin/clang-tidy clang-tidy /usr/bin/clang-tidy-18 100
          sudo update-alternatives --install /usr/bin/clang-format clang-format /usr/bin/clang-format-18 100

          # Verify versions
          clang --version
          clang-tidy --version
          gcc-13 --version

      - name: Check if C files exist
        id: check-c
        run: |
          if find . -name '*.c' -o -name '*.h' 2>/dev/null | grep -v node_modules | grep -q .; then
            echo "has_c=true" >> $GITHUB_OUTPUT
            echo "Found C source files"
          else
            echo "has_c=false" >> $GITHUB_OUTPUT
            echo "No C source files found - C23 linting ready for when C code is added"
          fi

      - name: Generate compile_commands.json
        if: steps.check-c.outputs.has_c == 'true'
        run: |
          # Create basic compile_commands.json for clang-tidy
          cat > compile_commands.json << 'EOF'
          [
            {
              "directory": "${{ github.workspace }}",
              "command": "gcc-13 -std=c23 -Wall -Wextra -Wpedantic -Iinclude -c placeholder.c",
              "file": "placeholder.c"
            }
          ]
          EOF

          # Use bear to generate proper compile_commands.json if Makefile exists
          if [ -f "Makefile" ]; then
            export CC=gcc-13
            bear -- make || true
          fi

      - name: Run clang-format check (C23)
        if: steps.check-c.outputs.has_c == 'true'
        run: |
          echo "Checking C code formatting (C23 standard)..."
          find . -name '*.c' -o -name '*.h' 2>/dev/null | grep -v node_modules | \
            xargs clang-format --dry-run --Werror --style=file

      - name: Run clang-tidy (C23)
        if: steps.check-c.outputs.has_c == 'true'
        run: |
          echo "Running clang-tidy with C23 checks..."
          find . -name '*.c' -o -name '*.h' 2>/dev/null | grep -v node_modules | \
            xargs clang-tidy \
              --config-file=.clang-tidy \
              --extra-arg=-std=c23 \
              --extra-arg=-Iinclude \
              --warnings-as-errors='*'

      - name: Run cppcheck (C only, not C++)
        if: steps.check-c.outputs.has_c == 'true'
        run: |
          echo "Running cppcheck for C code..."
          cppcheck \
            --std=c23 \
            --language=c \
            --enable=warning,style,performance,portability \
            --suppress=missingIncludeSystem \
            --suppress=unusedFunction \
            --inline-suppr \
            --error-exitcode=1 \
            --template='{file}:{line}: {severity}: {message} [{id}]' \
            -I include \
            . 2>&1 | tee cppcheck.log

          if [ -s cppcheck.log ]; then
            echo "::warning::cppcheck found issues"
          fi

  # ===========================================================================
  # Quality Checks
  # ===========================================================================
  quality:
    name: Quality Checks
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true' || needs.changes.outputs.c == 'true' || needs.changes.outputs.workflows == 'true'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Check file sizes
        run: |
          chmod +x scripts/check-file-size.sh
          ./scripts/check-file-size.sh

      - name: Check for sensitive files
        run: |
          SENSITIVE_FILES=$(find . -type f \( \
            -name "*.env" -o \
            -name "*.pem" -o \
            -name "*.key" -o \
            -name "*secret*" -o \
            -name "*credential*" \
          \) ! -path "./.git/*" ! -name "*.example" ! -name "*.sample" 2>/dev/null || true)
          if [ -n "$SENSITIVE_FILES" ]; then
            echo "Sensitive files found:"
            echo "$SENSITIVE_FILES"
            exit 1
          fi
          echo "No sensitive files found"

      - name: Check for TODO/FIXME in critical paths
        run: |
          if grep -rn "TODO\|FIXME" --include="*.go" internal/ cmd/ pkg/ 2>/dev/null | head -20; then
            echo "Note: TODOs found in Go code (info only)"
          fi

      - name: Check for unsafe logging patterns
        run: |
          echo "Checking for dangerous logging patterns..."
          DANGEROUS_PATTERNS=(
            'log\.Print.*password'
            'log\.Print.*token'
            'log\.Print.*Authorization'
            'log\.Print.*apikey'
            'log\.Print.*secret'
            'fmt\.Printf.*password'
            'fmt\.Printf.*token'
          )
          VIOLATIONS=0
          for pattern in "${DANGEROUS_PATTERNS[@]}"; do
            if grep -rn -E "$pattern" --include="*.go" --exclude="*_test.go" internal/ cmd/ pkg/ 2>/dev/null; then
              echo "Found dangerous logging pattern: $pattern"
              VIOLATIONS=$((VIOLATIONS + 1))
            fi
          done
          if [ $VIOLATIONS -gt 0 ]; then
            echo ""
            echo "ERROR: Found $VIOLATIONS unsafe logging pattern(s)"
            echo "Avoid logging sensitive data like passwords, tokens, or secrets"
            exit 1
          fi
          echo "No unsafe logging patterns detected"

  # ===========================================================================
  # Documentation Checks
  # ===========================================================================
  # Markdown lint + link check. Mirrors seed's docs job (#56). Both substeps
  # are advisory (continue-on-error) — they surface issues without blocking
  # the build, matching seed's stance that doc quality is a ratcheting goal.
  docs:
    name: Documentation Quality
    runs-on: ubuntu-latest
    # Always runs — cheap (runs in seconds) and applies to every PR.

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Check markdown links
        uses: gaurav-nelson/github-action-markdown-link-check@5c5dfc0ac2e225883c0e5f03a85311ec2830d368 # v1
        continue-on-error: true
        with:
          use-quiet-mode: "yes"

      - name: Lint markdown files
        uses: DavidAnson/markdownlint-cli2-action@ded1f9488f68a970bc66ea5619e13e9b52e601cd # v23.2.0
        continue-on-error: true
        with:
          globs: |
            **/*.md
            !**/node_modules/**
            !**/dist/**

  # ===========================================================================
  # Build
  # ===========================================================================
  build:
    name: Build (${{ matrix.os }}-${{ matrix.arch }})
    needs: [changes, backend, frontend]
    runs-on: ubuntu-latest
    # gopacket/pcap requires CGO + libpcap. CI verifies a native amd64 build
    # only — release.yml handles the arm64 cross-compile (gcc-aarch64-linux-gnu
    # + libpcap-dev:arm64) when actually publishing artifacts.
    # always() lets the if: evaluate when backend was skipped upstream.
    if: |
      always() &&
      needs.frontend.result == 'success' &&
      (needs.backend.result == 'success' || needs.backend.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
            goos: linux
            goarch: amd64
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Go
        uses: ./.github/actions/setup-go

      - name: Install libpcap-dev
        run: sudo apt-get update && sudo apt-get install -y libpcap-dev

      - name: Download frontend build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: frontend-dist
          path: internal/api/ui/

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '1'
        run: |
          VERSION=$(git describe --tags --always --dirty 2>/dev/null || echo "dev")
          COMMIT=$(git rev-parse --short HEAD 2>/dev/null || echo "unknown")
          BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          # UI build hash matches Makefile recipe; mandatory per CLAUDE.md
          # Universal Build Contract.
          UI_BUILD_HASH=$(find internal/api/ui -type f -exec md5sum {} \; 2>/dev/null | sort | md5sum 2>/dev/null | cut -d' ' -f1)
          echo "UI_BUILD_HASH=${UI_BUILD_HASH}"

          go build -trimpath -buildvcs=false \
            -ldflags="-s -w \
              -X github.com/krisarmstrong/niac-go/internal/version.Version=${VERSION} \
              -X github.com/krisarmstrong/niac-go/internal/version.Commit=${COMMIT} \
              -X github.com/krisarmstrong/niac-go/internal/version.BuildTime=${BUILD_TIME} \
              -X github.com/krisarmstrong/niac-go/internal/version.UIBuildHash=${UI_BUILD_HASH}" \
            -o niac-${{ matrix.os }}-${{ matrix.arch }} ./cmd/niac

      - name: Verify binary
        run: ./niac-${{ matrix.os }}-${{ matrix.arch }} --help || ./niac-${{ matrix.os }}-${{ matrix.arch }} version || echo "Binary runs"

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: niac-${{ matrix.os }}-${{ matrix.arch }}
          path: niac-${{ matrix.os }}-${{ matrix.arch }}
          retention-days: 7

  # ===========================================================================
  # E2E Browser Tests (Playwright)
  # ===========================================================================
  e2e:
    name: E2E Browser Tests
    runs-on: ubuntu-latest
    needs: [changes, backend, frontend]
    timeout-minutes: 30
    # Skipped on draft PRs (slow); also skipped if no frontend/backend changed.
    # always() lets the if: evaluate when backend was skipped upstream.
    if: |
      always() &&
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false) &&
      needs.frontend.result == 'success' &&
      (needs.backend.result == 'success' || needs.backend.result == 'skipped')

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Go
        uses: ./.github/actions/setup-go

      - name: Set up Node.js
        uses: ./.github/actions/setup-node

      - name: Install libpcap-dev
        run: sudo apt-get update && sudo apt-get install -y libpcap-dev

      - name: Download frontend build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: frontend-dist
          path: internal/api/ui/

      - name: Install frontend dependencies (for Playwright)
        working-directory: ui
        run: npm ci

      - name: Build backend
        run: |
          VERSION=$(git describe --tags --always --dirty 2>/dev/null || echo "dev")
          COMMIT=$(git rev-parse --short HEAD 2>/dev/null || echo "unknown")
          BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          UI_BUILD_HASH=$(find internal/api/ui -type f -exec md5sum {} \; 2>/dev/null | sort | md5sum 2>/dev/null | cut -d' ' -f1)
          go build -trimpath -buildvcs=false \
            -ldflags="-s -w \
              -X github.com/krisarmstrong/niac-go/internal/version.Version=${VERSION} \
              -X github.com/krisarmstrong/niac-go/internal/version.Commit=${COMMIT} \
              -X github.com/krisarmstrong/niac-go/internal/version.BuildTime=${BUILD_TIME} \
              -X github.com/krisarmstrong/niac-go/internal/version.UIBuildHash=${UI_BUILD_HASH}" \
            -o niac ./cmd/niac

      - name: Install Playwright browsers
        working-directory: ui
        # Per msn-docs-internal/05-Engineering/E2E_CONVENTIONS.md, every PR
        # runs Chromium (covers Chrome + Edge) and WebKit (covers Safari).
        run: npx playwright install --with-deps chromium webkit

      - name: Start backend server
        run: |
          # Backend is HTTPS-only since #663 (the --http flag was removed and
          # the legacy HTTP listener deleted). Self-signed cert auto-generated
          # on first start. Use canonical TLS port 8445 per CLAUDE.md.
          nohup ./niac daemon --listen 127.0.0.1:8445 > server.log 2>&1 &
          echo "Waiting for server to start..."
          for i in {1..30}; do
            if curl -skf https://localhost:8445/__version 2>/dev/null; then
              echo "Server ready after $i attempts"
              exit 0
            fi
            echo "Attempt $i: Server not ready, waiting..."
            sleep $((i < 5 ? 1 : 2))
          done
          echo "Server failed to start after 30 attempts"
          cat server.log
          exit 1

      - name: Run Playwright E2E tests
        working-directory: ui
        env:
          E2E_BASE_URL: https://localhost:8445
          PLAYWRIGHT_IGNORE_HTTPS_ERRORS: "true"
        # Both chromium and webkit run per E2E_CONVENTIONS — Firefox/mobile/
        # tablet/visual projects were deleted from playwright.config.ts.
        run: npx playwright test --reporter=html

      - name: Upload Playwright report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: playwright-report
          path: ui/playwright-report/
          retention-days: 7

      - name: Upload server logs on failure
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: e2e-server-logs
          path: server.log

  # ===========================================================================
  # Lighthouse Performance Audit
  # ===========================================================================
  lighthouse:
    name: Lighthouse Audit
    runs-on: ubuntu-latest
    needs: [changes, backend, frontend]
    timeout-minutes: 15
    # Skipped on draft PRs (slow); only runs when frontend changed.
    # always() lets the if: evaluate when backend was skipped upstream.
    if: |
      always() &&
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false) &&
      needs.frontend.result == 'success' &&
      (needs.changes.outputs.frontend == 'true' || needs.changes.outputs.workflows == 'true')

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Go
        uses: ./.github/actions/setup-go

      - name: Set up Node.js
        uses: ./.github/actions/setup-node

      - name: Install libpcap-dev
        run: sudo apt-get update && sudo apt-get install -y libpcap-dev

      - name: Download frontend build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: frontend-dist
          path: internal/api/ui/

      - name: Build backend
        run: |
          VERSION=$(git describe --tags --always --dirty 2>/dev/null || echo "dev")
          COMMIT=$(git rev-parse --short HEAD 2>/dev/null || echo "unknown")
          BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          UI_BUILD_HASH=$(find internal/api/ui -type f -exec md5sum {} \; 2>/dev/null | sort | md5sum 2>/dev/null | cut -d' ' -f1)
          go build -trimpath -buildvcs=false \
            -ldflags="-s -w \
              -X github.com/krisarmstrong/niac-go/internal/version.Version=${VERSION} \
              -X github.com/krisarmstrong/niac-go/internal/version.Commit=${COMMIT} \
              -X github.com/krisarmstrong/niac-go/internal/version.BuildTime=${BUILD_TIME} \
              -X github.com/krisarmstrong/niac-go/internal/version.UIBuildHash=${UI_BUILD_HASH}" \
            -o niac ./cmd/niac

      - name: Start server
        run: |
          # Backend is HTTPS-only since #663. Self-signed cert auto-generated.
          # Use canonical TLS port 8445.
          nohup ./niac daemon --listen 127.0.0.1:8445 > server.log 2>&1 &
          for i in {1..30}; do
            if curl -skf https://localhost:8445/__version 2>/dev/null; then
              echo "Server ready"
              exit 0
            fi
            sleep 1
          done
          cat server.log
          exit 1

      - name: Run Lighthouse
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # v12.6.2
        with:
          urls: |
            https://localhost:8445
          uploadArtifacts: true
          temporaryPublicStorage: true

      - name: Upload server logs on failure
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: lighthouse-server-logs
          path: server.log

  # ===========================================================================
  # CI Complete — dispatcher / branch-protection aggregator
  # ===========================================================================
  # Every required-status-check on `main` is consolidated into this single
  # job. It fails if any upstream job actually failed; it passes if every
  # upstream either succeeded or was intentionally skipped via the path
  # filter. Branch protection should require ONLY "CI Complete" plus the
  # security-critical checks from other workflows (CodeQL: Analyze (go),
  # Analyze (javascript-typescript); License Compliance Check) — not every
  # individual job — so docs-only PRs merge cleanly when backend/frontend/c
  # are all skipped.
  ci-complete:
    name: CI Complete
    runs-on: ubuntu-latest
    # NOTE: e2e and lighthouse are deliberately excluded from this aggregator.
    # They were dropped from required-status-checks on main because they're
    # advisory (flaky / surface real issues that are tracked separately).
    # Including them here would re-block merge via the dispatcher on the
    # same flakes. They still run on every PR and surface their own status;
    # they just don't gate merge.
    needs:
      - changes
      - backend
      - race
      - frontend
      - security
      - c-lint
      - quality
      - docs
      - build
    if: always()
    steps:
      - name: Verify upstream results
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "Upstream job results:"
          echo "$RESULTS" | jq '.'
          if ! echo "$RESULTS" | jq -e 'to_entries | map(.value.result) | all(. == "success" or . == "skipped")' >/dev/null; then
            echo "::error::One or more required CI jobs failed or were cancelled."
            exit 1
          fi
          echo "All required CI jobs passed (or were intentionally skipped)."
