# =============================================================================
# NIAC CI Pipeline
# =============================================================================
# Network Infrastructure Analysis & Capture - Mustard Seed Networks
#
# Runs on: pull requests to main, the merge queue, and manual dispatch.
# A push to main does not re-run this suite. The merge group already tested
# that commit. release-please and release.yml still need a green result on
# the main SHA; .github/workflows/ci-smoke.yml is that signal.
# Shared callers (changes, backend, race, frontend, storybook, e2e) pin
# MustardSeedNetworks/.github at e092081a97245d29978e229be7425179cc1dcde1.
# That commit pins apt-install and flake-budget inside the called workflows,
# so this repo does not vendor them.
# Jobs: backend, frontend, security, quality, build
# =============================================================================

name: CI

on:
  pull_request:
    branches: [main]
  # Required for the merge queue: `CI Complete` is a required status check, so
  # it must report on merge_group events too. Without this the queue would
  # accept PRs and then wait forever for a check that never fires.
  merge_group:
  workflow_dispatch:

concurrency:
  # PR runs are keyed by PR number, not by commit: cancel-in-progress cancels
  # the older run, it never blocks the newer one, so a per-commit key on a PR
  # meant cancel-in-progress could never fire and superseded runs burned
  # runners to completion.
  #
  # The SHA suffix stays on main. Fleet ci-conformance requires the group to
  # contain github.sha, and a workflow_dispatch on main must not cancel a
  # sibling dispatch of a different commit. Pushes to main are not this
  # workflow; ci-smoke.yml carries that signal and keys the same way, because
  # a merge burst used to cancel the pending main run and release-please,
  # gated on workflow_run success, skipped the commit.
  #
  # Superseded PR runs are still waste and still get cancelled.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}${{ github.ref == 'refs/heads/main' && format('-{0}', github.sha) || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Least-privilege default: read-only contents. The changes caller adds
# pull-requests: read and id-token: write so the shared path filter can list
# PR files and read its own commit. The security job grants actions: read and
# security-events: write for SARIF upload. dependency-review keeps
# pull-requests: write so it can post findings.
permissions:
  contents: read

jobs:
  # ===========================================================================
  # Path filter — classifies which areas changed so downstream jobs can skip
  # ===========================================================================
  # The matcher is scripts/ci-changes.py in the pinned .github commit. On
  # merge_group every declared filter is true: the queue has no PR base to
  # diff against. pull_request still filters. id-token: write is how that
  # workflow reads its own commit; without it the job fails closed.
  # workflow_dispatch diffs the parent commit. A missing parent lists every
  # tracked file, so a manual run does not silently skip the suite.
  changes:
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    uses: MustardSeedNetworks/.github/.github/workflows/ci-changes.yml@e092081a97245d29978e229be7425179cc1dcde1 # .github#163
    with:
      filters: |
        backend:
          - '**/*.go'
          - 'go.mod'
          - 'go.sum'
          - 'Makefile'
          - 'mk/**'
        frontend:
          - 'ui/**'
          - 'internal/i18n/locales/**'
          - 'scripts/i18n/**'
        c:
          - 'src/**'
          - 'include/**'
          - 'tests/c/**'
          - '.clang-tidy'
          - '.clang-format'
        docs:
          - '**/*.md'
        # Everything that *implements* a CI gate, not just the workflow
        # that calls it. niac carries 39 scripts under scripts/, most of
        # them gate implementations, and the filters enumerated only a
        # handful by name — so a PR could rewrite a gate and run no job
        # that used it, and stay green: CI Complete accepts `skipped`.
        # Enumerating scripts one at a time IS the failure mode; this is
        # the directory class that replaces it. Every job that OR'd
        # `workflows` now ORs this.
        ci_infra:
          - '.github/workflows/**'
          - '.github/actions/**'
          - 'scripts/**'
          - '.golangci.yml'
          - 'biome.json'
          - 'ui/biome.json'
        schema:
          - 'docs/schemas/**'
          - 'cmd/niac-schema/**'
          - 'cmd/niac-openapi/**'
          - 'docs/openapi-source.yaml'
          - 'docs/openapi.yaml'
          - 'docs/CLI_REFERENCE.md'
          - 'README.md'
        https:
          - 'cmd/niac/**'
          - 'internal/api/**'
          - 'internal/daemon/**'
          - 'deploy/macos/build-pkg.sh'
          - 'deploy/windows/build.ps1'
          - 'docs/API_EXAMPLES.md'
          - 'docs/CI_CD.md'
          - 'docs/FAQ.md'
          - 'docs/MONITORING.md'
          - 'docs/PERFORMANCE.md'
          - 'docs/README.md'
          - 'docs/WEBUI.md'
          - 'docs/openapi.yaml'
          - 'scripts/check-https-only.sh'
          - 'tests/smoke/run_smoke_tests.sh'
          - 'ui/vite.config.ts'
        hooks:
          - '.husky/**'
          - '.github/release-please-config.json'
          - '.goreleaser.yml'
          - '.goreleaser.content.yml'
          - 'deploy/nfpm/**'
          - 'deploy/windows/install.ps1'
          - 'scripts/tests/pre-commit-hook-test.sh'
          - 'scripts/tests/package-firewall-ownership-test.sh'
          - 'scripts/tests/release-content-integrity-test.sh'
          - 'scripts/tests/file-size-gate-test.sh'
          - 'scripts/check-file-size.sh'
        # The image installs a release archive by the name goreleaser
        # gives it, so a rename there breaks the image too.
        docker:
          - 'deploy/docker/**'
          - 'scripts/lab/docker-validate.sh'
          - '.goreleaser.yml'


  # ===========================================================================
  # Backend (Go, macOS, Windows) — fleet-shared ci-backend.yml
  # ===========================================================================
  # One caller. The Linux job is the product gate: golangci-lint, the drift
  # and policy scripts, the windows cross-build, tests, and the coverage
  # floor. macOS builds, vets, and race-tests internal/truststore. Windows
  # builds with CGO_ENABLED=0 and runs the listener, packet-decode, and
  # recovery tests that do not need Npcap. A full `go test` on that runner
  # fails on a missing wpcap.dll. Both native jobs stay off pull_request
  # (skip-native-on-pull-request defaults true). The merge queue still runs
  # them, because changes forces every filter true there.
  #
  # vet-command is a no-op. Linux does not run a separate `go vet`;
  # golangci-lint is that gate. The value is quoted because the input type
  # is string. lint-windows is false: the shared job cannot pass
  # only-new-issues and would lint pre-existing Windows findings on every
  # event, including the merge queue. That job stays below.
  #
  # Go comes from go.mod with the action cache off, which is what the shared
  # workflow pins. The default-branch cache save that used to live at the end
  # of this job has nowhere to go: a called workflow cannot take a trailing
  # step from the caller. ripgrep is not in the shared libpcap install, and
  # the library-stdout gate needs it.
  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.schema == 'true' || needs.changes.outputs.ci_infra == 'true' || needs.changes.outputs.https == 'true'
    permissions:
      contents: read
      actions: read
    uses: MustardSeedNetworks/.github/.github/workflows/ci-backend.yml@e092081a97245d29978e229be7425179cc1dcde1 # .github#163
    with:
      install-libpcap: true
      lint-windows: false
      golangci-lint-version: v2.14.0
      golangci-lint-args: --timeout=5m
      fetch-depth: 1
      native-fetch-depth: 1
      timeout-minutes: 20
      vet-command: "true"
      darwin-test-command: go test -race ./internal/truststore/...
      windows-build-command: go build ./internal/api/...
      windows-vet-only-command: go vet ./internal/api/...
      windows-test-command: |
        go test ./internal/api/ -run '^TestStartServesHTTP2AndRedirectsPlaintext$' -v
        go test ./internal/packetdecode/ -v
        go test ./internal/daemon/ -run 'Test(StateWriteCannotTraverseOutsideRoot|InlineFinishRetainsOriginalDirectoryCapability|RuntimeCleanupCannotFollowEscapedDirectory)$' -count=1 -v
      pre-command: |
        if ! command -v rg >/dev/null 2>&1; then
          attempt=1
          while [ "$attempt" -le 2 ]; do
            if sudo apt-get update && sudo apt-get install -y ripgrep; then
              break
            fi
            if [ "$attempt" -eq 2 ]; then
              echo "::error::ripgrep failed to install"
              exit 1
            fi
            sleep 10
            attempt=$((attempt + 1))
          done
        fi
        go mod download
        go mod verify
      build-command: |
        # CGO_ENABLED=0: gopacket/pcap loads its DLL at runtime on windows, so
        # this cross-build needs no Npcap SDK. It does not reproduce the
        # release link, which is CGO_ENABLED=1 against that SDK.
        CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build ./...
        CGO_ENABLED=0 GOOS=windows GOARCH=arm64 go build ./...
      extra-command: |
        # Verify niac.schema.json is up to date
        # Regenerate from the current converter.Config and fail if the
        # committed schema drifts. Forces struct changes to bring the
        # schema along; refresh locally with `make schema`.
        go run ./cmd/niac-schema -o /tmp/niac.schema.json
        if ! diff -u docs/schemas/niac.schema.json /tmp/niac.schema.json; then
          echo "::error::docs/schemas/niac.schema.json is stale. Run 'make schema' and commit the result."
          exit 1
        fi
        echo "Schema is up to date."

        # Verify docs/openapi.yaml is up to date
        # The API description is generated from the capability registry, so
        # a new or changed route brings its documentation along or fails
        # here. Refresh locally with `make openapi`.
        go run ./cmd/niac-openapi -o /tmp/openapi.yaml
        if ! diff -u docs/openapi.yaml /tmp/openapi.yaml; then
          echo "::error::docs/openapi.yaml is stale. Run 'make openapi' and commit the result."
          exit 1
        fi
        echo "OpenAPI description is up to date."

        # Verify the generated CLI documentation is up to date
        # README.md's command table and the Commands section of
        # docs/CLI_REFERENCE.md are generated from the cobra tree, so a new
        # command or a changed help string brings its documentation along or
        # fails here. Refresh locally with `make cli-docs`.
        go run ./cmd/niac docs --check
        echo "CLI documentation is up to date."

        # Output-escaping / XSS gate (#742)
        ./scripts/check-output-escaping.sh

        # HTTPS-only listener gate (#1037)
        ./scripts/check-https-only.sh

        # Library-stdout gate (#1805)
        ./scripts/check-library-stdout.sh

        # Fetch-error-state gate (U1)
        python3 scripts/test-check-fetch-error-states.py
        python3 scripts/check-fetch-error-states.py

        # Page-story gate (U6) — every route has Empty/Loaded/Error stories
        python3 scripts/test-check-page-stories.py
        python3 scripts/check-page-stories.py

        # Route-policy gate (capability registry)
        bash "$(go list -f '{{.Dir}}' github.com/MustardSeedNetworks/foundation/pkg/httpserver/route)/check-route-policy.sh" internal/api

        # JSON wire-casing gate — camelCase ratchet (ADR-0007)
        ./scripts/check-json-casing.sh

        # Filename-policy gate — no monolith naming outside internal/api
        ./scripts/check-filename-policy.sh

        # Layering gate — domain packages never import an outer layer (#2435)
        python3 scripts/test-check-layering.py
        python3 scripts/check-layering.py

        # Route-consumer gate — every route has a caller, every call has a route
        python3 scripts/test-check-route-consumers.py
        python3 scripts/check-route-consumers.py

        # Authoring-parity gate — every schema field is editable (owner decision 2026-09-02)
        python3 scripts/test-check-authoring-parity.py
        python3 scripts/check-authoring-parity.py

        # Variants on @layer components classes
        python3 scripts/test-check-component-variants.py
        python3 scripts/check-component-variants.py

        # Consumer demand extractor — SNMP request decoding
        python3 scripts/test-extract-oid-demand.py

        # Generated SNMP walks — representable speeds and memory pools
        python3 scripts/test_generate_modern_walk.py

        # Wire nightly runner — reject stale or dirty checkouts
        python3 scripts/test-wire-nightly.py

        # deploy-validate — probe the address the daemon bound
        python3 scripts/test-listen-url.py

        # validate-touched — selection and gate table
        python3 scripts/test-validate-touched.py

        # Device-editor manifest drift — generated forms match the schema
        python3 scripts/test-gen-device-editor-sections.py
        python3 scripts/gen-device-editor-sections.py --check

        # TypeScript strictness contract
        python3 scripts/check-tsconfig-flags.py

        # Banned-vocabulary gate (strategy reset)
        python3 scripts/test-check-banned-vocabulary.py
        python3 scripts/check-banned-vocabulary.py
      test-command: go test -v -coverprofile=coverage.out ./...
      coverage-command: |
        COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | sed 's/%//')
        echo "Current coverage: ${COVERAGE}%"
        # Anti-regression floor, a few points under the measured total so
        # ordinary churn does not fail the build. Project target is 90%.
        # Ratchet: 50 (2026-Q2), 68 (2026-Q3; measured 71.3% at b86fc10c),
        # 75 (2026-Q4), 82 (2027-Q2), 90 long-term.
        # bc -l may print 1 or 1.0. The shared step runs this with sh, which
        # has no (( )).
        MIN_COVERAGE=68
        below=$(echo "$COVERAGE < $MIN_COVERAGE" | bc -l)
        case "$below" in
          1*)
            echo "ERROR: Coverage ${COVERAGE}% is below minimum threshold of ${MIN_COVERAGE}%"
            exit 1
            ;;
        esac

  # Stays in this file. ci-backend.yml's lint-windows job cannot pass
  # only-new-issues and runs on every event. This repo has pre-existing
  # Windows findings (seed#2408); linting all of them would redden every
  # merge. The backend caller sets lint-windows: false.
  # Windows-tagged Go has never been linted: golangci-lint runs on ubuntu and
  # skips *_windows.go, and the Windows job runs build/vet/tests but no linter.
  # GOOS=windows makes golangci-lint compile and lint the whole Windows tree on
  # Linux -- nothing Windows-side needs cgo -- so this costs one job, no runner.
  #
  # only-new-issues: this repo carries pre-existing findings under
  # GOOS=windows (see MustardSeedNetworks/seed#2408); gating them all would
  # block every PR. New Windows debt is blocked from today.
  #
  # pull_request only: only-new-issues needs a base to diff against, and on
  # merge_group there is none -- it would fall back to all pre-existing
  # findings and redden every merge. ci-complete accepts skipped, so this is
  # not a deadlock.
  lint-windows:
    name: Lint (GOOS=windows)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: ./.github/actions/setup-go

      - name: Run golangci-lint for GOOS=windows
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        env:
          GOOS: windows
        with:
          version: v2.15.0
          only-new-issues: true
          # See the Backend (Go) step above: the action's cache key carries no
          # GOOS, so this job and that one share one entry while analysing two
          # different trees. #1942.
          skip-cache: true

  # ===========================================================================
  # Go race detector — fleet-shared ci-race.yml
  # ===========================================================================
  # Same path filter as Backend (Go). skip-network-tests is false: the shared
  # default exports SKIP_NETWORK_TESTS=1, and this suite does not use that
  # variable. The UI artifact is not downloaded; this job never embedded the
  # built UI.
  race:
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.schema == 'true' || needs.changes.outputs.ci_infra == 'true' || needs.changes.outputs.https == 'true'
    permissions:
      contents: read
      actions: read
    uses: MustardSeedNetworks/.github/.github/workflows/ci-race.yml@e092081a97245d29978e229be7425179cc1dcde1 # .github#163
    with:
      install-libpcap: true
      skip-network-tests: false
      timeout-minutes: 20
      test-command: go test -race ./...

  # ===========================================================================
  # Raw-socket boundary (Linux, explicit capabilities)
  # ===========================================================================
  # internal/capture is driven through the PacketSender and packetHandle seams
  # in every other job, so it needs no privileges there. What those seams cannot
  # cover is the boundary itself: opening a live pcap handle, compiling a real
  # BPF filter, and putting a frame on the wire. That is this job.
  #
  # The suite is behind the `rawsocket` build tag, so `go test ./...` elsewhere
  # never picks it up. It is built here and then granted CAP_NET_RAW /
  # CAP_NET_ADMIN on the binary, so the tests run as the normal unprivileged
  # runner user: `sudo go test` would instead pollute GOCACHE with root-owned
  # files and prove nothing about the capability grant.
  #
  # Nothing in the suite skips. A missing capability, a missing loopback or a
  # handle that will not open is a failure — a privileged suite that can quietly
  # no-op is exactly the defect this job exists to catch, so it fails closed and
  # NIAC_RAWSOCKET_TESTS must be set for it to run at all.
  capture-rawsocket:
    name: Raw-socket boundary (Linux)
    runs-on: ubuntu-latest
    # The suite itself runs in well under a second; the budget is sized for the
    # 10-min worst case of the libpcap step, same as the backend jobs.
    timeout-minutes: 20
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.ci_infra == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: ./.github/actions/setup-go

      - name: Install libpcap-dev
        uses: MustardSeedNetworks/.github/.github/actions/apt-install@76eb579ee0cbdef0a2aef9d9df1ae9ca38cad6bd # v1.14.0
        # 20 rather than 10: the release path may now take three attempts with
        # 90s then 180s between them. A backstop, not a wait -- raising it
        # costs an ordinary run nothing.
        timeout-minutes: 20
        # See the race job for why this composite exists rather than a bare
        # apt-get install.
        with:
          # A mirror outage lasting minutes is not a transient error, and
          # two attempts ten seconds apart cannot span one -- that is what
          # turned v0.94.46's release red (#1364). Ordinary CI keeps failing
          # fast: there a quick red is worth more than riding out an outage.
          attempts: ${{ startsWith(github.head_ref, 'release-please') && '3' || '2' }}
          retry-delay-seconds: ${{ startsWith(github.head_ref, 'release-please') && '90' || '10' }}
          packages: libpcap-dev

      # The binary must not live on /tmp: it is mounted nosuid on Ubuntu, and
      # nosuid strips file capabilities silently — setcap succeeds, getcap
      # reports the caps, and the process still gets EPERM opening the socket.
      - name: Build the raw-socket test binary
        run: go test -c -tags rawsocket -o "$GITHUB_WORKSPACE/capture-rawsocket.test" ./internal/capture/

      - name: Grant CAP_NET_RAW and CAP_NET_ADMIN to the test binary
        run: |
          sudo setcap cap_net_raw,cap_net_admin+eip "$GITHUB_WORKSPACE/capture-rawsocket.test"
          getcap "$GITHUB_WORKSPACE/capture-rawsocket.test"

      # Proves the grant is what makes the suite pass. Without it the preflight
      # must fail; if it passed here the job would be testing nothing, so a
      # zero exit is the failure condition.
      - name: Verify the suite fails closed without the capabilities
        run: |
          # cp does not carry file capabilities across, so the copy is
          # unprivileged without having to strip anything.
          cp "$GITHUB_WORKSPACE/capture-rawsocket.test" "$RUNNER_TEMP/no-caps.test"
          if getcap "$RUNNER_TEMP/no-caps.test" | grep -q cap_net_raw; then
            echo "::error::the unprivileged copy still carries capabilities"
            exit 1
          fi
          if NIAC_RAWSOCKET_TESTS=1 "$RUNNER_TEMP/no-caps.test" \
              -test.run TestPreflight_RawSocketCapabilitiesPresent; then
            echo "::error::the raw-socket preflight passed without CAP_NET_RAW - it is not actually checking anything"
            exit 1
          fi
          echo "Preflight correctly failed without the capability grant."

      - name: Run the raw-socket boundary suite
        env:
          NIAC_RAWSOCKET_TESTS: "1"
        run: |
          "$GITHUB_WORKSPACE/capture-rawsocket.test" -test.v

  # ===========================================================================
  # Frontend (TypeScript)
  # ===========================================================================
  # `build` and `e2e` both embed the built UI (internal/api/ui/ via go:embed),
  # so they need this artifact — but they used to take it from the `frontend`
  # job, which only runs when frontend files changed. A backend-only PR
  # therefore skipped `frontend`, and with it `build` and `e2e`, while
  # CI Complete still went green: nothing verified that a Go change still
  # produced a working binary or passed a browser test until the merge queue
  # forced the full suite (#1629 sibling finding; seed solved this the same way
  # with its own "Build UI (shared artifact)" job).
  #
  # Building the UI is the cheap part; the frontend job's lint, typecheck,
  # coverage and Storybook stay gated on frontend changes.
  # The shared frontend workflow typechecks and tests. It does not build
  # the production bundle, so this job stays here.
  build-ui:
    name: Build UI (shared artifact)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true' || needs.changes.outputs.ci_infra == 'true'
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: ./.github/actions/setup-node

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload frontend build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-dist
          path: internal/api/ui/
          retention-days: 1

  # ===========================================================================
  # Frontend (TypeScript) — fleet-shared ci-frontend.yml
  # ===========================================================================
  # Defaults cover `npm run typecheck` (tsc --build --noEmit) and `npm run lint`
  # (biome check src/ scripts/). Token discipline runs before the tests. The
  # production bundle is build-ui; this workflow does not build it again.
  # Storybook interactions run in their own caller. `build-storybook` stays
  # here so a broken static build still fails this job. Nothing downloads the
  # storybook-static artifact, so the upload is not repeated.
  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.ci_infra == 'true'
    permissions:
      contents: read
    uses: MustardSeedNetworks/.github/.github/workflows/ci-frontend.yml@e092081a97245d29978e229be7425179cc1dcde1 # .github#163
    with:
      timeout-minutes: 15
      extra-command: ../scripts/check-token-discipline.sh
      test-command: |
        npm run test:coverage
        npm run build-storybook -- --output-dir storybook-static --quiet

  # ===========================================================================
  # Storybook interactions and accessibility — fleet-shared ci-storybook.yml
  # ===========================================================================
  # Chromium's apt half goes through the shared apt-install action, pinned
  # inside that workflow. The download retries three times. The contract
  # script still plants an interaction defect and an a11y defect and asserts
  # each one fails the gate.
  storybook:
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.ci_infra == 'true'
    permissions:
      contents: read
    uses: MustardSeedNetworks/.github/.github/workflows/ci-storybook.yml@e092081a97245d29978e229be7425179cc1dcde1 # .github#163
    with:
      timeout-minutes: 25

  # ===========================================================================
  # Security Scanning
  # ===========================================================================
  security:
    name: Security Scanning
    runs-on: ubuntu-latest
    timeout-minutes: 16
    # Always runs — security checks are non-negotiable on every PR.
    permissions:
      # Job-level `permissions:` REPLACES the workflow-level block entirely
      # (they don't merge) — `actions: read` from the top-level block was
      # silently dropped here, which broke the codeql-action/upload-sarif
      # step below ("Resource not accessible by integration") and skipped
      # every step after it (npm audit, gitleaks, Trivy) on 2026-07-04.
      actions: read
      contents: read
      # github/codeql-action/upload-sarif@v4 requires security-events: write
      # to push results to the Security tab (regressed from a default-on
      # permission in earlier versions). Trivy and gosec both use this
      # action to upload SARIF.
      security-events: write
    steps:
      # fetch-depth: 0 required for gitleaks-action's commit-range scan
      # (default shallow clone fails with "unknown revision" when base^
      # isn't reachable, especially after rebases/force-pushes).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Go
        uses: ./.github/actions/setup-go

      - name: Install libpcap-dev
        uses: MustardSeedNetworks/.github/.github/actions/apt-install@76eb579ee0cbdef0a2aef9d9df1ae9ca38cad6bd # v1.14.0
        # 20 rather than 10: the release path may now take three attempts with
        # 90s then 180s between them. A backstop, not a wait -- raising it
        # costs an ordinary run nothing.
        timeout-minutes: 20
        # packages.microsoft.com intermittently serves an unsigned/invalid
        # InRelease that aborts `apt-get update` for the whole runner, even
        # though libpcap-dev comes from the Ubuntu archive (killed Lighthouse
        # /#928 + Security Scanning/#932). A stalled Ubuntu mirror can also
        # hang apt itself for the whole job budget without running a test
        # (job 95072124340 hung 25 minutes on this exact step). The composite
        # drops the unused Microsoft source, bounds apt's own network waits,
        # and retries transient hiccups with backoff.
        with:
          # A mirror outage lasting minutes is not a transient error, and
          # two attempts ten seconds apart cannot span one -- that is what
          # turned v0.94.46's release red (#1364). Ordinary CI keeps failing
          # fast: there a quick red is worth more than riding out an outage.
          attempts: ${{ startsWith(github.head_ref, 'release-please') && '3' || '2' }}
          retry-delay-seconds: ${{ startsWith(github.head_ref, 'release-please') && '90' || '10' }}
          packages: libpcap-dev

      - name: Run govulncheck
        # make security-backend runs `go tool govulncheck` (declared in
        # go.mod's tool directive, resolved via go.sum); using the target
        # here keeps the invocation in sync with `make security` / `make
        # verify` locally instead of duplicating it.
        run: make security-backend

      - name: Run gosec
        uses: securego/gosec@deb54465fea23d19a77f037e11e6589021f8501d # v2.29.0
        with:
          args: "-no-fail -fmt sarif -out gosec-results.sarif ./..."

      - name: Upload gosec results
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        # Code scanning requires a public repo or Advanced Security (same
        # gate as codeql.yml); gosec enforcement stays blocking via the
        # golangci-lint gosec linter in the backend job.
        #
        # Skip the upload on merge_group. The queue deletes
        # refs/heads/gh-readonly-queue/... while this job is still running,
        # and upload-sarif then fails the job with "ref ... not found"
        # (CI run 38978937411, PR #2756, 2026-10-16: gosec uploaded, the
        # later Trivy upload did not). The scan above still runs. The pull
        # request's own CI is what publishes the SARIF.
        if: always() && github.event.repository.visibility == 'public' && github.event_name != 'merge_group'
        with:
          sarif_file: gosec-results.sarif

      - name: Set up Node.js
        uses: ./.github/actions/setup-node

      - name: Install npm dependencies
        working-directory: ui
        run: npm ci

      - name: Run npm audit
        # Was `npm audit --audit-level=high || true` — the `|| true` silently
        # discarded npm audit's exit code, so this step reported green
        # regardless of findings. make security-frontend propagates the
        # real exit code (see mk/security.mk).
        run: make security-frontend

      # gitleaks-action requires a paid licence for organization repos. Use the
      # MIT-licensed gitleaks CLI directly instead — same engine, same config.
      # Scans full history (the security job checks out with fetch-depth: 0).
      - name: Check starter walks are safe to ship
        # Content, not code: nothing stopped an unsanitised walk landing in
        # the tree, and four were shipping tcpConnTable and LLDP management
        # addresses that record who a real device was talking to.
        run: ./scripts/check-starter-walks.sh

      - name: Run gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
          # SHA-256 of gitleaks_8.30.1_linux_x64.tar.gz from the upstream
          # checksums.txt. Rotate this together with GITLEAKS_VERSION on upgrade.
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git . --config .gitleaks.toml --redact --no-banner --exit-code 1

      - name: Run Trivy vulnerability scanner
        # Trivy moved to v-prefixed tags between 0.35 and 0.36; the bare
        # version no longer resolves.
        # exit-code is 0 here so the SARIF always gets written; we still
        # surface findings as a separate step that fails CI when the SARIF
        # contains CRITICAL/HIGH entries.
        id: trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      - name: Upload Trivy results
        # Code scanning requires a public repo or Advanced Security (same
        # gate as codeql.yml); the "Fail on CRITICAL/HIGH findings" step
        # below still blocks on the SARIF content regardless of visibility.
        #
        # Skip the upload on merge_group. Same deleted-ref failure as the
        # gosec upload above: this is the step that actually reddened run
        # 38978937411. The findings gate below still runs.
        if: always() && hashFiles('trivy-results.sarif') != '' && github.event.repository.visibility == 'public' && github.event_name != 'merge_group'
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: trivy-results.sarif

      - name: Fail on CRITICAL/HIGH findings
        # Reads the SARIF Trivy just produced and fails CI if any CRITICAL or
        # HIGH-severity result is present. On a pull request the upload step
        # publishes that SARIF first; on a merge group the upload is skipped
        # because the queue ref is already gone, and this step is the gate.
        if: always() && hashFiles('trivy-results.sarif') != ''
        run: |
          if jq -e '.runs[].results[] | select(.level=="error" or .properties.security_severity == "high" or .properties.security_severity == "critical")' trivy-results.sarif >/dev/null; then
            echo "::error::Trivy found CRITICAL or HIGH severity issues — see Security tab."
            jq '.runs[].results[] | {ruleId, level, severity: .properties.security_severity, message: .message.text}' trivy-results.sarif
            exit 1
          fi

  # ===========================================================================
  # Semgrep SAST — required gate (Phase 4, replaces CodeQL as the required
  # SAST signal since CodeQL is advisory-only)
  # ===========================================================================
  # Blocking on ERROR severity only for now — a deliberate first step,
  # mirroring the seed/stem rollout. WARNING/MEDIUM findings are visible in
  # the job log but do not fail the build yet; ratchet to a stricter
  # --severity once any WARNING backlog is triaged in a follow-up.
  #
  # Runs unconditionally (no path filter) — same rationale as `security`
  # above: SAST coverage on every PR is non-negotiable, and Semgrep is fast
  # enough (~1-2 min for this ruleset) that gating it behind path filters
  # isn't worth the added complexity.
  # Defined once in MustardSeedNetworks/.github (fleet-shared); ci-complete
  # still needs: [semgrep]. Edit the pinned version / config policy there.
  # .github#174 skips the SARIF upload on merge_group (the queue ref is
  # deleted before upload-sarif can attach it). The scan and the ERROR
  # gate still run. security-events: write stays required: pull_request
  # uploads are still not continue-on-error.
  semgrep:
    uses: MustardSeedNetworks/.github/.github/workflows/semgrep.yml@8f012be52b47d0be45104b0ed8d3eb72f20840f5 # .github#174
    permissions:
      contents: read
      # v1.8.0 publishes the all-severity SARIF to code scanning. The
      # upload is deliberately not continue-on-error, so this scope is
      # required, not optional.
      security-events: write

  # Refuses a PR that INTRODUCES a Go dependency carrying a High advisory,
  # whether or not the vulnerable symbol is ever called.
  #
  # The gap it closes is narrower than "nothing checks new dependencies", and
  # worth stating precisely: `npm audit --audit-level=high` already gates the
  # npm tree on *presence*, while govulncheck gates Go on *reachability* — it
  # passes a vulnerable module until something calls into it. The two halves of
  # the tree are held to different standards, so a Go dependency with a High
  # advisory can land unreachable and then fail CI on whatever unrelated PR
  # first calls into it. This gates the Go side on presence too, at the one
  # point where the fix is still "pick a different version". The shared
  # workflow's deny-licenses half duplicates license-check.yml — defence in
  # depth, not new coverage.
  #
  # pull_request only. The action diffs the PR's dependency manifests against
  # the base, so there is nothing for it to compare on a push or a merge_group;
  # ci-complete accepts success-or-skipped, so the skip on those events is not
  # a deadlock. Defined once in MustardSeedNetworks/.github (fleet-shared);
  # ci-complete still needs: [dependency-review].
  dependency-review:
    if: github.event_name == 'pull_request'
    uses: MustardSeedNetworks/.github/.github/workflows/dependency-review.yml@76eb579ee0cbdef0a2aef9d9df1ae9ca38cad6bd # v1.14.0
    permissions:
      contents: read
      # Only to post the findings comment when it fails.
      pull-requests: write

  # Asserts this repo's own gates are wired to gate: every job below is either
  # in ci-complete's needs or documented in .github/ci-advisory-jobs.txt, the
  # enabled linters meet the declared tier, and tool installs are pinned. Two
  # such gaps were found by hand on 2026-08-16; both arrived via a merge, which
  # is why this runs per PR rather than on a schedule.
  # Defined once in MustardSeedNetworks/.github (fleet-shared); ci-complete
  # still needs: [ci-conformance].
  # `id-token: write` is how the reusable workflow learns which commit of
  # itself is running, so its policy checkout reads the pinned commit instead
  # of .github@main (a canonical change there reaches this repo only when this
  # pin moves).
  ci-conformance:
    uses: MustardSeedNetworks/.github/.github/workflows/ci-conformance.yml@76eb579ee0cbdef0a2aef9d9df1ae9ca38cad6bd # v1.14.0
    permissions:
      contents: read
      id-token: write

  # ===========================================================================
  # Quality Checks
  # ===========================================================================
  quality:
    name: Quality Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true' || needs.changes.outputs.c == 'true' || needs.changes.outputs.ci_infra == 'true' || needs.changes.outputs.hooks == 'true' || needs.changes.outputs.docs == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check file sizes
        run: |
          chmod +x scripts/check-file-size.sh
          ./scripts/check-file-size.sh

      # The `docs` path filter had no consumer before this: no job ran on a
      # docs-only change, so the gate this step calls would never have fired
      # for exactly the edits it guards.
      - name: Docs-truth gate — documented env vars, links and examples/ paths exist
        run: python3 scripts/check-docs-truth.py

      - name: Test pre-commit hook
        run: ./scripts/tests/pre-commit-hook-test.sh

      - name: Test release content integrity contract
        run: ./scripts/tests/release-content-integrity-test.sh

      - name: Test package firewall ownership lifecycle
        run: ./scripts/tests/package-firewall-ownership-test.sh

      - name: Test file-size gate
        run: ./scripts/tests/file-size-gate-test.sh

      - name: Check for sensitive files
        run: |
          SENSITIVE_FILES=$(find . -type f \( \
            -name "*.env" -o \
            -name "*.pem" -o \
            -name "*.key" -o \
            -name "*secret*" -o \
            -name "*credential*" \
          \) ! -path "./.git/*" ! -name "*.example" ! -name "*.sample" 2>/dev/null || true)
          if [ -n "$SENSITIVE_FILES" ]; then
            echo "Sensitive files found:"
            echo "$SENSITIVE_FILES"
            exit 1
          fi
          echo "No sensitive files found"

      - name: Check for unsafe logging patterns
        run: |
          echo "Checking for dangerous logging patterns..."
          DANGEROUS_PATTERNS=(
            'log\.Print.*password'
            'log\.Print.*token'
            'log\.Print.*Authorization'
            'log\.Print.*apikey'
            'log\.Print.*secret'
            'fmt\.Printf.*password'
            'fmt\.Printf.*token'
          )
          VIOLATIONS=0
          for pattern in "${DANGEROUS_PATTERNS[@]}"; do
            if grep -rn -E "$pattern" --include="*.go" --exclude="*_test.go" internal/ cmd/ pkg/ 2>/dev/null; then
              echo "Found dangerous logging pattern: $pattern"
              VIOLATIONS=$((VIOLATIONS + 1))
            fi
          done
          if [ $VIOLATIONS -gt 0 ]; then
            echo ""
            echo "ERROR: Found $VIOLATIONS unsafe logging pattern(s)"
            echo "Avoid logging sensitive data like passwords, tokens, or secrets"
            exit 1
          fi
          echo "No unsafe logging patterns detected"

  # ===========================================================================
  # Documentation Checks
  # ===========================================================================
  # Internationalization (i18n) Checks
  # ===========================================================================
  # Workflow Linting
  # ===========================================================================
  # Static analysis of the workflows themselves. Kept out of `quality` so it
  # runs in parallel and only when workflow files actually change.
  #   actionlint — syntax, expression and shell errors inside run: blocks.
  #                It caught a duplicated `with:` key that PyYAML accepts
  #                silently by keeping the last occurrence.
  #   zizmor     — Actions security scanner. Blocks on High findings only.
  #                The repo is at zero High; the one that survives review carries
  #                a `# zizmor: ignore[...]` comment with the reasoning inline
  #                (release-please.yml:21).
  #                Low/Informational (~29) are reported but not yet enforced.
  # ===========================================================================
  # Release notes — a release PR must still describe the tree it will tag
  # ===========================================================================
  # The post-tag check in release-please.yml reports a short changelog; it
  # cannot prevent one, because by then the tag exists and the next release
  # compares against it (niac#1817). This runs the same comparison before the
  # merge, on the merge-queue tree, so a commit that landed while the release
  # PR was open ejects the PR instead of shipping unlisted inside its tag.
  # release-please regenerates the PR on its next tick.
  #
  # Not path-gated and not gated on `changes`: a release PR touches only
  # CHANGELOG.md and the version files, and this is the one job that has to
  # judge exactly that PR.
  release-notes:
    name: Release Notes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # The parse gate reads each queued PR's body: release-please takes a
    # commit's message from its BEGIN_COMMIT_OVERRIDE block (niac-go#2509).
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The check compares against the previous tag, so it needs the tags
          # and the commits between them.
          fetch-depth: 0

      - name: Gate self-test
        run: python3 scripts/test-check-release-notes.py

      # Only judge the tree that is about to land. On a push to main the
      # release commit is already history, so failing there would wedge the
      # tag rather than prevent a bad one; release-please.yml's post-tag check
      # reports that case instead. A pull_request run judges a merge ref that
      # never lands: while a release is pending it fails on the PR's own
      # unsquashed commits, and nothing reruns it once the release ships, so
      # the PR stays red with a stale failure (#2635).
      - name: An untagged release must list every commit it would ship
        if: github.event_name == 'merge_group'
        run: python3 scripts/check-release-notes.py --pending

      # release-please drops a commit its parser rejects without failing, so
      # the loss surfaces only as a short changelog (niac-go#2389). A queue
      # group's commits are the messages main will carry: parse them, with
      # each PR's body, the way release-please will, and eject the PR instead
      # of losing the entry.
      # The script needs Node alone, so no npm cache is restored.
      - uses: ./.github/actions/setup-node
        with:
          cache: ''

      - name: Commit parse gate self-test
        run: node --test ui/scripts/check-commit-parse.test.ts

      - name: Every queued commit parses as release-please parses it
        if: github.event_name == 'merge_group'
        env:
          BASE_SHA: ${{ github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.merge_group.head_sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node ui/scripts/check-commit-parse.ts "$BASE_SHA" "$HEAD_SHA"

  workflow-lint:
    name: Workflow Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: changes
    if: needs.changes.outputs.ci_infra == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: ./.github/actions/setup-go

      - name: Run actionlint
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          # SC2129 is a pure style preference about grouping `>>` redirects in
          # step summaries; the ungrouped form stays readable and diffs one
          # line at a time. Every correctness-level rule stays enabled.
          actionlint -ignore 'SC2129' -color

      - name: Run zizmor
        env:
          # zizmor resolves action refs against the API; without a token it
          # falls back to unauthenticated requests and gets rate-limited.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pipx install zizmor==1.30.1
          zizmor --min-severity high --color always .github/workflows/


  # ===========================================================================
  # Validates the translation locale files in internal/i18n/locales/ against
  # the cross-repo conventions in msn-docs-internal/05-Engineering/. The checks
  # live once in MustardSeedNetworks/.github; this repo keeps only its own
  # glossary, banned vocabulary, glossary exceptions and dynamic-prefix
  # allow-list. The extractor-drift check below is niac-only and stays here.
  i18n:
    name: i18n Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: changes
    if: |
      needs.changes.outputs.frontend == 'true'
      || needs.changes.outputs.ci_infra == 'true'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-node

      - name: Install frontend dependencies
        working-directory: ui
        run: npm ci

      - name: Check extracted keys and extractor fixtures
        working-directory: ui
        run: npm run i18n:lint && npm run i18n:check && npm run i18n:test

      # The shared gate: installs semgrep, self-tests the key checker, then
      # validates. Defined once in MustardSeedNetworks/.github — edit the
      # checks there, the data files here. See scripts/i18n/README.md and
      # msn-docs-internal/05-Engineering/I18N_CONVENTIONS.md.
      - name: Validate i18n (parity, glossary, banned vocab, etc.)
        uses: MustardSeedNetworks/.github/.github/actions/i18n-validate@d2aa4161d10bf8cb5a9ffb0e0985224df0faa617 # .github#105 + #106, untagged

  # ===========================================================================
  # Documentation Checks
  # ===========================================================================
  # Markdown lint + link check. Mirrors seed's docs job (#56). Both substeps
  # are advisory (continue-on-error) — they surface issues without blocking
  # the build, matching seed's stance that doc quality is a ratcheting goal.
  docs:
    name: Documentation Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # External link checking is NOT here: it walked every URL in every .md file
    # and measured ~6 min — the longest job in this workflow and, on a
    # backend-only change, the entire critical path. It also failed on
    # third-party link rot rather than on the change under review, which is why
    # it was pinned to continue-on-error and enforced nothing.
    # It now runs on a schedule: .github/workflows/docs-link-check.yml

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Needed to diff against the base ref for changed-file scoping.
          fetch-depth: 0

      - name: Collect changed markdown files
        id: changed-md
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: |
          set -euo pipefail
          if [ -n "${BASE_SHA}" ] && git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            files=$(git diff --name-only --diff-filter=ACMR "${BASE_SHA}" HEAD -- '*.md')
          else
            files=$(git ls-files '*.md')
          fi
          files=$(printf '%s\n' "${files}" | grep -vE '^(node_modules|build|dist|coverage)/' | grep -v 'CHANGELOG.md$' || true)
          {
            echo "files<<EOF"
            printf '%s\n' "${files}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          if [ -z "${files}" ]; then echo "empty=true" >> "$GITHUB_OUTPUT"; fi

      # Blocking, but scoped to the files this change touches. The repo carries
      # ~1.2k pre-existing violations of its own markdownlint config; gating the
      # full tree would fail every PR, and gating nothing (the previous
      # continue-on-error) enforced nothing. Scoping ratchets the debt down as
      # files are touched, matching the file-size gate's baseline approach.
      - name: Lint changed markdown files
        if: steps.changed-md.outputs.empty != 'true'
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
        with:
          globs: ${{ steps.changed-md.outputs.files }}

  # ===========================================================================
  # Build
  # ===========================================================================
  build:
    name: Build (${{ matrix.os }}-${{ matrix.arch }})
    needs: [changes, backend, build-ui]
    runs-on: ubuntu-latest
    # p95 ~1m10s (5 recent main/PR runs, 2026-08-15). Was 6 — under the 10-min
    # libpcap step it contains, so a slow mirror could not fail cleanly here.
    timeout-minutes: 16
    # gopacket/pcap requires CGO + libpcap. CI verifies a native amd64 build
    # only — release.yml handles the arm64 cross-compile (gcc-aarch64-linux-gnu
    # + libpcap-dev:arm64) when actually publishing artifacts.
    # always() lets the if: evaluate when backend was skipped upstream.
    if: |
      always() &&
      needs.build-ui.result == 'success' &&
      (needs.backend.result == 'success' || needs.backend.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
            goos: linux
            goarch: amd64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: ./.github/actions/setup-go

      - name: Install libpcap-dev
        uses: MustardSeedNetworks/.github/.github/actions/apt-install@76eb579ee0cbdef0a2aef9d9df1ae9ca38cad6bd # v1.14.0
        # 20 rather than 10: the release path may now take three attempts with
        # 90s then 180s between them. A backstop, not a wait -- raising it
        # costs an ordinary run nothing.
        timeout-minutes: 20
        # packages.microsoft.com intermittently serves an unsigned/invalid
        # InRelease that aborts `apt-get update` for the whole runner, even
        # though libpcap-dev comes from the Ubuntu archive (killed Lighthouse
        # /#928 + Security Scanning/#932). A stalled Ubuntu mirror can also
        # hang apt itself for the whole job budget without running a test
        # (job 95072124340 hung 25 minutes on this exact step). The composite
        # drops the unused Microsoft source, bounds apt's own network waits,
        # and retries transient hiccups with backoff.
        with:
          # A mirror outage lasting minutes is not a transient error, and
          # two attempts ten seconds apart cannot span one -- that is what
          # turned v0.94.46's release red (#1364). Ordinary CI keeps failing
          # fast: there a quick red is worth more than riding out an outage.
          attempts: ${{ startsWith(github.head_ref, 'release-please') && '3' || '2' }}
          retry-delay-seconds: ${{ startsWith(github.head_ref, 'release-please') && '90' || '10' }}
          packages: libpcap-dev

      - name: Download frontend build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: frontend-dist
          path: internal/api/ui/

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '1'
        run: |
          VERSION=$(git describe --tags --always --dirty 2>/dev/null || echo "dev")
          COMMIT=$(git rev-parse --short HEAD 2>/dev/null || echo "unknown")
          BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          # UI build hash matches Makefile recipe; mandatory per CLAUDE.md
          # Universal Build Contract.
          UI_BUILD_HASH=$(find internal/api/ui -type f -exec md5sum {} \; 2>/dev/null | sort | md5sum 2>/dev/null | cut -d' ' -f1)
          echo "UI_BUILD_HASH=${UI_BUILD_HASH}"

          go build -trimpath -buildvcs=false \
            -ldflags="-s -w \
              -X github.com/MustardSeedNetworks/niac-go/internal/version.Version=${VERSION} \
              -X github.com/MustardSeedNetworks/niac-go/internal/version.Commit=${COMMIT} \
              -X github.com/MustardSeedNetworks/niac-go/internal/version.BuildTime=${BUILD_TIME} \
              -X github.com/MustardSeedNetworks/niac-go/internal/version.UIBuildHash=${UI_BUILD_HASH}" \
            -o niac-${{ matrix.os }}-${{ matrix.arch }} ./cmd/niac

      - name: Verify binary
        # The trailing `|| echo "Binary runs"` exited 0, so a binary that
        # crashed on both invocations was reported as running and nothing in
        # the build job proved a niac artifact starts at all (#2181). The
        # matrix is native linux/amd64 on a Linux runner by design -- the
        # comment on this job's `runs-on` says release.yml owns the arm64
        # cross-build -- so the binary must actually execute here. A future
        # cross-target gates this step on the runner being able to run it; it
        # never restores a fallback that swallows the error.
        run: |
          BIN="./niac-${{ matrix.os }}-${{ matrix.arch }}"
          # `version` exercises the real cobra command and prints the ldflags
          # the previous step injected, so it proves startup and metadata at
          # once; --help proves the command tree still builds.
          "${BIN}" version
          "${BIN}" --help > /dev/null

      - name: Verify UIBuildHash embedded (Universal Build Contract)
        # seed and stem both verify this; niac injected the ldflag but never
        # checked it landed. Without the check a build that misses the flag
        # ships happily and /__version returns uiBuildHash="unknown" — exactly
        # the silent contract violation Build Contract rule #6 exists to catch.
        # Static check: the binary must contain the md5 of the embedded UI
        # assets. Cheaper and more reliable than booting the server in CI.
        run: |
          if [ -z "$(find internal/api/ui -mindepth 1 ! -name '.gitkeep' -print -quit 2>/dev/null)" ]; then
            echo "::error::internal/api/ui is empty — frontend-dist artifact missing?"
            exit 1
          fi
          EXPECTED=$(find internal/api/ui -type f -exec md5sum {} \; 2>/dev/null | sort | md5sum 2>/dev/null | cut -d' ' -f1)
          if [ "${#EXPECTED}" -ne 32 ]; then
            echo "::error::Computed UI_BUILD_HASH is not 32 chars: '${EXPECTED}'"
            exit 1
          fi
          echo "Expected UIBuildHash: ${EXPECTED}"
          BIN="niac-${{ matrix.os }}-${{ matrix.arch }}"
          if strings "${BIN}" | grep -qF "${EXPECTED}"; then
            echo "  ✓ ${BIN}: UIBuildHash embedded correctly"
          else
            echo "::error::${BIN} does not contain UIBuildHash ${EXPECTED}"
            echo "  → Universal Build Contract violated. Check the -X ...UIBuildHash=... ldflag in the 'Build binary' step."
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: niac-${{ matrix.os }}-${{ matrix.arch }}
          path: niac-${{ matrix.os }}-${{ matrix.arch }}
          retention-days: 7

  # ===========================================================================
  # E2E Browser Tests (Playwright) — fleet-shared ci-e2e.yml
  # ===========================================================================
  # Sharded chromium and webkit, plus a separate @smoke job, inside the
  # pinned Playwright 1.64 image. That image is the revert the Ubuntu 26.04
  # container was holding: Playwright 1.64 is installed, and the image ships
  # the browsers, so this job no longer calls apt. The libsoup check still
  # runs in prepare-command and fails if WebKit loads 3.6.5.
  #
  # The daemon cannot be built inside the image (no toolchain, no libpcap,
  # and apt sources there are not reachable). ci-e2e builds it on ubuntu-24.04,
  # the image's glibc, against a static libpcap, and the shards download
  # ./niac. build-backend-e2e.sh apt-installs libpcap-dev when
  # /usr/include/pcap/pcap.h is missing; the symlink makes that check pass so
  # the link stays static. require-static-libpcap fails the job otherwise.
  #
  # The auth, history, query, permissions, and unsaved configs start their own
  # daemons. They run once, on the smoke job, not on every shard. The history
  # fixture is `go run`, and the image has no Go, so that job installs the
  # toolchain from go.mod before those suites. Drafts skip the caller.
  # !cancelled() keeps a cancelled run from launching shards. build-ui has to
  # have succeeded because the daemon embeds that artifact. A failed frontend
  # does not skip this job: it never needed frontend.
  e2e:
    needs: [changes, backend, build-ui]
    if: |
      !cancelled() &&
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false) &&
      needs.build-ui.result == 'success' &&
      (needs.backend.result == 'success' || needs.backend.result == 'skipped')
    permissions:
      contents: read
      actions: write
    uses: MustardSeedNetworks/.github/.github/workflows/ci-e2e.yml@e092081a97245d29978e229be7425179cc1dcde1 # .github#163
    with:
      backend-result: ${{ needs.backend.result }}
      playwright-image: mcr.microsoft.com/playwright:v1.64.0-noble@sha256:06a9939e57531807f8d5fd76ce44b53165ffb7d7501d87ab10e285c20b1e971f
      ui-artifact: frontend-dist
      fetch-depth: 0
      build-daemon: true
      static-libpcap: true
      require-static-libpcap: true
      daemon-build-command: |
        header="$RUNNER_TEMP/libpcap-static/include/pcap/pcap.h"
        if [ ! -f "$header" ]; then
          header="$RUNNER_TEMP/libpcap-static/include/pcap.h"
        fi
        sudo mkdir -p /usr/include/pcap
        sudo ln -sfn "$header" /usr/include/pcap/pcap.h
        ./scripts/build-backend-e2e.sh
      daemon-binary: niac
      daemon-artifact: niac-e2e-daemon
      timeout-minutes: 25
      flake-report: 'ui/playwright-report/results*.json'
      prepare-command: |
        ./scripts/check-webkit-libsoup.sh
        nohup ./scripts/e2e-daemon.sh 8445 > server.log 2>&1 &
        echo "Waiting for server to start..."
        i=1
        while [ "$i" -le 30 ]; do
          if curl -skf https://localhost:8445/__version >/dev/null 2>&1; then
            echo "Server ready after $i attempts"
            exit 0
          fi
          echo "Attempt $i: Server not ready, waiting..."
          if [ "$i" -lt 5 ]; then
            sleep 1
          else
            sleep 2
          fi
          i=$((i + 1))
        done
        echo "Server failed to start after 30 attempts"
        cat server.log
        exit 1
      test-command: cd ui && E2E_BASE_URL=https://localhost:8445 PLAYWRIGHT_IGNORE_HTTPS_ERRORS=true npx playwright test --project="$BROWSER" --grep-invert @smoke --shard="$SHARD/$SHARD_COUNT"
      smoke-command: |
        cd ui
        E2E_BASE_URL=https://localhost:8445 PLAYWRIGHT_IGNORE_HTTPS_ERRORS=true npx playwright test --grep @smoke
        if ! command -v go >/dev/null 2>&1; then
          curl -fsSL -o /tmp/go.tgz https://go.dev/dl/go1.27.3.linux-amd64.tar.gz
          echo "65efbc80fdc1fa2cd2631cad5b481777a68e8725f34e89f50fc6ac714e379b40  /tmp/go.tgz" | sha256sum -c -
          rm -rf /usr/local/go
          tar -C /usr/local -xzf /tmp/go.tgz
        fi
        export PATH="/usr/local/go/bin:$PATH"
        export CGO_ENABLED=0
        export GOTOOLCHAIN=local
        npm run test:e2e:auth
        npm run test:e2e:history
        npm run test:e2e:query
        npm run test:e2e:permissions
        npm run test:e2e:unsaved

  # ===========================================================================
  # CI Complete — dispatcher / branch-protection aggregator
  # ===========================================================================
  # Every required-status-check on `main` is consolidated into this single
  # job. It fails if any upstream job actually failed; it passes if every
  # upstream either succeeded or was intentionally skipped via the path
  # filter. Branch protection requires ONLY "CI Complete" (plus "Lint PR
  # Title" / "Lint PR Body" from their own workflows) — not every individual
  # job — so docs-only PRs merge cleanly when backend/frontend/c are all
  # skipped. CodeQL and License Compliance are NOT required contexts: CodeQL
  # is advisory and License Compliance reports without blocking. The
  # `semgrep` job in this file is the required SAST gate (blocking on ERROR
  # severity).
  # Fails the build on any open High/Critical CodeQL alert on the default
  # branch. The CodeQL job itself reports success when the *analysis* succeeds,
  # regardless of what it found, so without this a repository can carry open
  # High alerts with every check green. Scoped to CodeQL rather than "any High
  # alert": the code-scanning tab also carries Scorecard *scores* at High
  # severity, several of which encode deliberate decisions.
  # Not the shared ci-complete.yml. GitHub would report that check as
  # `ci-complete / CI Complete`. Branch protection and release.yml require
  # the plain name `CI Complete`, so the aggregator stays in this file.
  # The macOS and Windows jobs are inside the backend caller.
  # Phone width (owner 2026-09-15: everything works at 390x844). The fleet's one
  # definition of "works" lives in MustardSeedNetworks/.github; this job points
  # it at niac's own daemon, started by the same script as the E2E job. niac
  # has no sign-in on loopback, so there is no setup-command or storage-state.
  # No primary-action-testid: niac marks a page's primary with data-variant,
  # not a test id (App.primaryAction.test.tsx counts them). `routes` must equal
  # pageRegistry's paths — src/pageRegistry.test.tsx fails when they diverge.
  phone-width:
    needs: [changes]
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.backend == 'true' || needs.changes.outputs.ci_infra == 'true'
    permissions:
      contents: read
      id-token: write
    uses: MustardSeedNetworks/.github/.github/workflows/phone-width.yml@042e037814c114aadc2b8b2caaedfba8e0149018 # .github#88, untagged
    with:
      base-url: https://127.0.0.1:8445
      prepare-command: ./scripts/build-backend-e2e.sh
      start-command: ./scripts/e2e-daemon.sh 8445
      routes: '["/", "/runtime", "/new-simulation", "/devices", "/segments", "/device-config", "/topology", "/alerts", "/traffic", "/debug", "/packets", "/config-diff", "/walk-validator", "/walk-analyzer", "/library/walks", "/library/pcaps"]'
      rail-testid: sidebar-desktop

  codeql-alert-gate:
    name: CodeQL Alert Gate
    uses: MustardSeedNetworks/.github/.github/workflows/codeql-alert-gate.yml@76eb579ee0cbdef0a2aef9d9df1ae9ca38cad6bd # v1.14.0
    permissions:
      security-events: read

  docker-image:
    name: Docker image (deploy/docker)
    runs-on: ubuntu-latest
    # Two image builds, two daemon starts and the 30 s restart-loop watch.
    timeout-minutes: 15
    needs: changes
    if: needs.changes.outputs.docker == 'true' || needs.changes.outputs.ci_infra == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The image installs a published release, so this checks the Dockerfile
      # and the documented run line against the latest release and the upgrade
      # from the one before it, not the code in this PR.
      - name: Validate the image against the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/lab/docker-validate.sh

  ci-complete:
    name: CI Complete
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Browser-engine E2E is release-blocking.
    needs:
      - changes
      - backend
      - lint-windows
      - race
      - capture-rawsocket
      - docker-image
      - build-ui
      - frontend
      - security
      - semgrep
      - dependency-review
      - ci-conformance
      - quality
      - release-notes
      - workflow-lint
      - docs
      - build
      - e2e
      - phone-width
      - i18n
      - storybook
      - codeql-alert-gate
    # always() also runs after a cancellation and then fails this aggregator,
    # which turns a superseded run into a red CI Complete. !cancelled() still
    # runs when an upstream job failed, and stays quiet when the run was
    # cancelled.
    if: ${{ !cancelled() }}
    steps:
      - name: Verify upstream results
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "Upstream job results:"
          echo "$RESULTS" | jq '.'
          if ! echo "$RESULTS" | jq -e 'to_entries | map(.value.result) | all(. == "success" or . == "skipped")' >/dev/null; then
            echo "::error::One or more required CI jobs failed or were cancelled."
            exit 1
          fi
          echo "All required CI jobs passed (or were intentionally skipped)."
