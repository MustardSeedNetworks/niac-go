name: First-Class Browser Channels

on:
  schedule:
    - cron: "17 7 * * 1"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-channels:
    name: Installed Chrome and Edge
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: ./.github/actions/setup-go

      - name: Set up Node.js
        uses: ./.github/actions/setup-node

      - name: Install libpcap
        run: |
          sudo grep -rlZ packages.microsoft.com /etc/apt/sources.list.d/ 2>/dev/null | xargs -0 -r sudo rm -f
          sudo apt-get update
          sudo apt-get install -y libpcap-dev

      - name: Install frontend dependencies
        working-directory: ui
        run: npm ci

      - name: Build NIAC
        run: make build

      - name: Install Chrome and Edge OS dependencies
        working-directory: ui
        timeout-minutes: 8
        # A stalled Ubuntu mirror can hang apt for the whole job budget without
        # running a test (stem job 95068053052), because apt waits forever on a
        # dead connection by default. Bound apt's own network waits, then retry
        # the transient case.
        run: |
          sudo tee /etc/apt/apt.conf.d/99-ci-timeouts >/dev/null <<'EOF'
          Acquire::http::Timeout "20";
          Acquire::https::Timeout "20";
          Acquire::Retries "2";
          DPkg::Lock::Timeout "60";
          EOF
          for attempt in 1 2 3; do
            # A timeout kill can leave dpkg half-configured; recover first.
            [ "$attempt" -gt 1 ] && sudo dpkg --configure -a >/dev/null 2>&1 || true
            if timeout -k 15 120 npx playwright install-deps chrome msedge; then
              exit 0
            fi
            echo "playwright install-deps attempt ${attempt} failed; retrying in $((attempt * 10))s..."
            sleep $((attempt * 10))
          done
          echo "::error::playwright install-deps failed after 3 attempts"
          exit 1

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-channels-${{ runner.os }}-${{ hashFiles('ui/package-lock.json') }}
          restore-keys: |
            playwright-channels-${{ runner.os }}-

      - name: Install Chrome and Edge channels
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: ui
        run: npx playwright install chrome msedge

      - name: Start NIAC
        env:
          NIAC_E2E_DRY_RUN_SIMULATION: "1"
        run: |
          nohup ./niac daemon --listen 127.0.0.1:8445 --storage disabled > browser-channels-server.log 2>&1 &
          for i in {1..30}; do
            if curl -skf https://127.0.0.1:8445/__version >/dev/null; then
              exit 0
            fi
            echo "Waiting for NIAC (attempt $i of 30)"
            sleep 2
          done
          cat browser-channels-server.log
          exit 1

      - name: Run installed browser journeys
        working-directory: ui
        env:
          E2E_BASE_URL: https://127.0.0.1:8445
          PLAYWRIGHT_IGNORE_HTTPS_ERRORS: "true"
        run: |
          set -euo pipefail
          for browser in chrome edge; do
            for shard in 1 2; do
              PLAYWRIGHT_REPORT_SUFFIX="${browser}-${shard}" \
                npx playwright test --config=playwright.channels.config.ts \
                --project="$browser" --shard="$shard/2"
            done
          done

      - name: Run installed browser authentication journeys
        working-directory: ui
        run: npx playwright test --config=playwright.channels.auth.config.ts

      - name: Upload browser reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: installed-browser-report
          path: ui/playwright-report/
          retention-days: 14

      - name: Upload server log on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: installed-browser-server-log
          path: browser-channels-server.log
          retention-days: 14
