name: First-Class Browser Channels

# Schedule + dispatch only, deliberately NOT on pull_request. Chrome and Edge
# are both Chromium; ci.yml's e2e job already runs the same specs on bundled
# Chromium, so a per-PR run here was a third execution of one engine. Real
# cross-engine risk is covered by the webkit and firefox projects in
# playwright.config.ts, which do gate. Channel-specific regressions (a Chrome
# stable rollout, an Edge-only quirk) are rare and slow-moving; the weekly
# audit catches them without spending ~4.5min on every frontend PR.
on:
  schedule:
    - cron: "17 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The path-filter job that used to gate this was pull_request-only machinery;
  # a scheduled audit runs the whole suite by definition. It also still filtered
  # on .lighthouserc.json, which no longer exists.
  browser-channels:
    name: Installed Chrome and Edge
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: ./.github/actions/setup-go

      - name: Set up Node.js
        uses: ./.github/actions/setup-node

      - name: Install libpcap
        uses: MustardSeedNetworks/.github/.github/actions/apt-install@3567cebc11a2277106bb350042287918ad92e542 # v1.2.0
        timeout-minutes: 8
        # A stalled Ubuntu mirror can hang apt for the whole job budget
        # without running a test, because apt waits forever on a dead
        # connection by default. The composite bounds apt's own network
        # waits, then retries the transient case.
        with:
          packages: libpcap-dev

      - name: Install frontend dependencies
        working-directory: ui
        run: npm ci

      - name: Build NIAC
        run: make build

      - name: Install Chrome and Edge OS dependencies
        uses: MustardSeedNetworks/.github/.github/actions/apt-install@3567cebc11a2277106bb350042287918ad92e542 # v1.2.0
        timeout-minutes: 8
        # A stalled Ubuntu mirror can hang apt for the whole job budget without
        # running a test (stem job 95068053052), because apt waits forever on a
        # dead connection by default. The composite bounds apt's own network
        # waits (via playwright's internal apt calls), then retries the
        # transient case.
        with:
          command: cd ui && npx playwright install-deps chrome msedge

      # Restore always; save only from the default branch. Caches are scoped
      # per ref, so a PR that saves writes its own copy that dies on merge —
      # see the comment in .github/actions/setup-go for the incident.
      - name: Restore Playwright browsers
        id: playwright-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-channels-${{ runner.os }}-${{ hashFiles('ui/package-lock.json') }}
          restore-keys: |
            playwright-channels-${{ runner.os }}-

      - name: Install Chrome and Edge channels
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: ui
        run: npx playwright install chrome msedge

      - name: Save Playwright browsers (default branch only)
        if: steps.playwright-cache.outputs.cache-hit != 'true' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-channels-${{ runner.os }}-${{ hashFiles('ui/package-lock.json') }}

      - name: Start NIAC
        env:
          NIAC_E2E_DRY_RUN_SIMULATION: "1"
        run: |
          nohup ./niac daemon --listen 127.0.0.1:8445 --storage disabled > browser-channels-server.log 2>&1 &
          for i in {1..30}; do
            if curl -skf https://127.0.0.1:8445/__version >/dev/null; then
              exit 0
            fi
            echo "Waiting for NIAC (attempt $i of 30)"
            sleep 2
          done
          cat browser-channels-server.log
          exit 1

      - name: Run installed browser journeys
        working-directory: ui
        env:
          E2E_BASE_URL: https://127.0.0.1:8445
          PLAYWRIGHT_IGNORE_HTTPS_ERRORS: "true"
        run: |
          set -euo pipefail
          for browser in chrome edge; do
            for shard in 1 2; do
              PLAYWRIGHT_REPORT_SUFFIX="${browser}-${shard}" \
                npx playwright test --config=playwright.channels.config.ts \
                --project="$browser" --shard="$shard/2"
            done
          done

      - name: Run installed browser authentication journeys
        working-directory: ui
        run: npx playwright test --config=playwright.channels.auth.config.ts

      - name: Upload browser reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: installed-browser-report
          path: ui/playwright-report/
          retention-days: 14

      - name: Upload server log on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: installed-browser-server-log
          path: browser-channels-server.log
          retention-days: 14
