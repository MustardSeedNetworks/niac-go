# =============================================================================
# Release Please - Automated Version Management
# =============================================================================
# Creates release PRs with changelogs when commits land on main.
# When a release PR is merged, creates a GitHub release which triggers
# release.yml for building packages (via version tag).
#
# Trigger pattern (shared with seed, stem, niac):
#   - workflow_run on CI completion: real trigger; gated on success.
#     Pushes to main run the "CI smoke" workflow, not the full suite — the
#     merge group already tested the commit. The release PR's own CI is
#     still the "CI" workflow.
#   - schedule: reconciles a release that a flaky CI run skipped
#   - workflow_dispatch: manual debug / force trigger
#
# Release cadence (owner 2026-09-14): the release PR is armed only once two or
# more PRs have merged since the latest release tag; see the arm step.
#
# Why the schedule exists (stem#662): the workflow_run gate means a TRANSIENT
# CI failure on main does not merely go red, it skips the release outright and
# says nothing — a merged release PR, no tag, and a workflow that "succeeded"
# by skipping. That fired for real on 2026-08-18 (stem v0.24.14 and seed the
# same day) and was only caught because someone was watching.
#
# The fix is convergence, not alerting. release-please is idempotent: with
# nothing to release it does nothing, so a periodic run is free of false
# positives — unlike a "release was skipped" alarm, which cannot tell a
# skipped release from a main CI failure on a commit that was never going to
# release anything. A skipped release now self-heals within the interval
# instead of waiting to be noticed. workflow_dispatch remains for recovering
# it immediately.
#
# The tag release-please pushes is what starts release.yml — there is no
# explicit hand-off job. This works ONLY because the tag is pushed with the
# msn-ci-bot App token: tags pushed with the default GITHUB_TOKEN do not
# trigger workflows (GitHub's recursion guard), so swapping back to it would
# silently stop every release from building.
#
# Versioning behaviour is driven by .github/release-please-config.json
# and .github/.release-please-manifest.json so that release-please knows
# the current version and applies the same changelog grouping across
# all three projects.
# =============================================================================

name: Release Please

on:
  # zizmor: ignore[dangerous-triggers]
  # workflow_run is the required trigger here: release-please must run after
  # CI succeeds on main, with write access, which pull_request cannot give.
  # The usual workflow_run hazard is checking out the triggering run's
  # untrusted head — this workflow performs no checkout at all, and is gated
  # on conclusion == 'success' from this repository (never a fork).
  #
  # The release branch is listed so the release PR's own CI completing runs
  # the enqueue step: the PR can only enter the queue once its checks are
  # green, and nothing else fires at that moment (G-18).
  workflow_run:
    # "CI" is the full suite (pull requests, the merge queue, dispatch).
    # "CI smoke" is the push-to-main signal. workflow_run matches the
    # workflow name, not the file name.
    workflows: ["CI", "CI smoke"]
    branches: [main, release-please--branches--main]
    types: [completed]
  # Offset from the hour so the fleet's four repos do not all fire at :00.
  schedule:
    - cron: '27 */3 * * *'
  workflow_dispatch:

# Serialise the runs. All three triggers can fire close together — a burst of
# merges produces a workflow_run each, and the reconciling schedule lands on
# top — and two overlapping runs both force-update
# heads/release-please--branches--main. One wins, the other dies with
# "Error updating ref", which is a red build for a race rather than a problem.
# It happened on stem, trellis and niac during a 29-PR drain on 2026-08-22.
#
# cancel-in-progress is false on purpose: cancelling a run mid-release is a
# worse failure than queueing behind it. release-please is idempotent, so a
# queued run simply converges on whatever main looks like when it starts.
concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  release-please:
    # Only run if CI succeeded — or if this is the reconciling schedule or a
    # manual dispatch, neither of which carries a workflow_run to gate on.
    # A fork PR can name its branch release-please--branches--main too; its CI
    # run must not drive this workflow.
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository) }}
    name: Release Please
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Mint GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          # Scope the installation token to what release-please actually needs:
          # write the changelog/tag/release (contents) and open, update and
          # label the release PR (pull-requests). Without these the token
          # inherits every permission the msn-ci-bot installation holds.
          #
          # Do NOT re-add permission-issues here. The msn-ci-bot installation
          # does not grant Issues, and create-github-app-token hard-fails when
          # asked for a permission the installation lacks — that broke every
          # release across the fleet. Labels on a pull request are covered by
          # pull-requests: write; the Issues scope is only needed for labelling
          # real issues, which release-please never does.
          permission-contents: write
          permission-pull-requests: write
          # release-please creates the release branch and the version tag. When a
          # workflow file has changed since the last release those refs carry a
          # .github/workflows/** diff, and GitHub refuses the ref write without
          # this scope — every release stalled fleet-wide until it was added.
          # create-github-app-token scopes the minted token to exactly these
          # inputs, so granting the installation the permission is necessary but
          # not sufficient; it has to be requested here too.
          permission-workflows: write

      # A queued release PR's branch is locked: release-please's ref update
      # fails ("Error updating ref heads/release-please--branches--main") and
      # main reads red until the merge-time release-notes guard either merges
      # the PR or ejects it, after which the next run regenerates it
      # (.github#110). Skip instead of failing; nothing is lost.
      - name: Skip while the release PR is in the merge queue
        id: queue
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          QUERY: >-
            query($owner: String!, $name: String!) {
              repository(owner: $owner, name: $name) {
                pullRequests(headRefName: "release-please--branches--main", states: OPEN, first: 1) {
                  nodes { number isInMergeQueue }
                }
              }
            }
        run: |
          set -euo pipefail
          queued="$(gh api graphql -F owner="${GITHUB_REPOSITORY_OWNER}" -F name="${GITHUB_REPOSITORY#*/}" \
                      -f query="${QUERY}" --jq '.data.repository.pullRequests.nodes[0].isInMergeQueue // false')"
          echo "queued=${queued}" >> "${GITHUB_OUTPUT}"
          if [ "${queued}" = "true" ]; then
            echo "::notice::Release PR is in the merge queue; skipping this run."
          fi

      - name: Run Release Please
        id: release
        if: steps.queue.outputs.queued != 'true'
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          # Short-lived GitHub App installation token (msn-ci-bot), minted
          # per-run. Unlike GITHUB_TOKEN, an App-authored tag/PR DOES trigger
          # downstream workflows — so release-please's release PR gets CI and
          # its v* tag fires release.yml's `push: tags` build. App tokens are
          # not subject to the org's fine-grained-PAT >366-day lifetime rule
          # that rejected the old RELEASE_PLEASE_TOKEN. Standardized across the
          # MSN fleet (seed/stem/niac/niac-java).
          token: ${{ steps.app-token.outputs.token }}
          # NOTE: do NOT pass release-type here. It is declared per-package in
          # release-please-config.json (release-type: go). Passing it as a
          # direct action input forces a mode that ignores the config-file's
          # per-package options — including bump-minor-pre-major /
          # bump-patch-for-minor-pre-major — which made release-please
          # propose a 1.0.0 major bump off a pre-1.0 breaking change on seed
          # (#1602). We are pre-alpha and stay on 0.x; the config governs
          # versioning.
          config-file: .github/release-please-config.json
          manifest-file: .github/.release-please-manifest.json

      # The release PR waited for a human, and the wait is not short: 38 commits sat behind #1687 from 2026-09-02. Nothing about the PR decides which it will be -- only
      # whether someone happens to look. Nothing about merging it is
      # a judgement call -- release-please generates the changelog and the
      # version bump from the commits already on main, and CI Complete still
      # has to go green before the queue takes it. Enqueuing it here makes a
      # release land on its own.
      #
      # It goes to the FRONT of the merge queue (`jump: true`), and only once
      # its required checks have passed. Auto-merge enqueued it at the back
      # when its checks went green, so PRs already queued merged ahead of it;
      # its merge group then held commits its changelog never lists, `Release
      # Notes` ejected it, release-please regenerated it, and the loop repeated
      # (seed#3484 was ejected three times on 2026-10-15; G-18). At the front,
      # its merge group is main plus the release, and the freshness check
      # below has just confirmed that is the main the changelog describes. A
      # group already merging when the jump lands can still beat it once;
      # that costs one regeneration, not a loop.
      #
      # Not the same as merging blind: the queue still runs every required
      # check on the merge group, exactly as for any other PR.
      #
      # To hold a release deliberately, label the PR `release: hold` -- this
      # step then leaves it alone and it stays a manual merge.
      #
      # No merge method is passed: the merge queue owns the strategy.
      # This job performs no checkout (see the workflow_run note at the top), so
      # gh has no repository to infer: without --repo both calls died with
      # "failed to run git: fatal: not a git repository" on every scheduled
      # tick after this step landed, and the job went red fleet-wide.
      - name: Enqueue the release PR at the front of the merge queue
        if: steps.queue.outputs.queued != 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          ENQUEUE: >-
            mutation($id: ID!, $jump: Boolean!) {
              enqueuePullRequest(input: {pullRequestId: $id, jump: $jump}) { mergeQueueEntry { position } }
            }
          QUEUE_DEPTH: >-
            query($owner: String!, $name: String!) {
              repository(owner: $owner, name: $name) { mergeQueue(branch: "main") { entries { totalCount } } }
            }
        run: |
          set -euo pipefail
          # `.[0] | select(...)` looked right and failed on the common case:
          # with no open release PR, `.[0]` is null and `.labels` on null is a
          # jq error, which under `set -e` would redden release-please on
          # every quiet tick. Filter the array, then take the first.
          # Cadence (owner 2026-09-14): a release ships after every TWO merged
          # PRs, not after every merge. Count the commits on main past the
          # latest release tag (one squash commit per PR); below two, leave the
          # release PR unarmed so it keeps accumulating. The reconciling
          # schedule tick still ships a lone PR that has waited more than six
          # hours, so a single fix never sits unreleased for a day. With no
          # release yet (a new repo) the gate does not apply.
          latest="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name 2>/dev/null || true)"
          if [ -n "${latest}" ]; then
            cmp="$(gh api "repos/${GITHUB_REPOSITORY}/compare/${latest}...main" \
                    --jq '{ahead: .ahead_by, newest: (.commits | last | .commit.committer.date // "")}')"
            ahead="$(jq -r .ahead <<<"${cmp}")"
            newest="$(jq -r .newest <<<"${cmp}")"
            if [ "${ahead}" -lt 2 ]; then
              age=0
              if [ -n "${newest}" ]; then
                age=$(( $(date -u +%s) - $(date -u -d "${newest}" +%s) ))
              fi
              if [ "${GITHUB_EVENT_NAME}" = "schedule" ] && [ "${ahead}" -ge 1 ] && [ "${age}" -ge 21600 ]; then
                echo "One PR since ${latest} has waited ${age}s: the schedule tick ships it."
              else
                echo "Holding: ${ahead} of 2 PRs merged since ${latest}; not arming."
                exit 0
              fi
            fi
          fi
          pr="$(gh pr list --repo "${GITHUB_REPOSITORY}" --head release-please--branches--main --state open \
                  --json number,labels,isCrossRepository \
                  --jq '[.[] | select(.isCrossRepository | not) | select((.labels | map(.name) | index("release: hold")) | not) | .number] | first // empty')"
          if [ -z "${pr}" ]; then
            echo "No open release PR to arm, or it carries release: hold."
            exit 0
          fi
          # Only arm a release PR that still describes main.
          #
          # This workflow runs on workflow_run after CI succeeds on main, and
          # that is slower than the release PR's own checks. So a commit merged
          # while the PR was open could go green, merge the PR, and ship inside
          # the tag with no changelog entry -- v0.94.91, v0.94.92 and v0.95.1
          # each lost commits that way (niac#1817). Nothing self-corrects: the
          # next release compares against the new tag.
          #
          # release-please branches its single commit off the main commit it
          # generated from, so that commit's parent is exactly the main it
          # described. If main has moved on, the PR is stale -- skip this tick.
          # The CI run for the newer commit will trigger this workflow again,
          # release-please will regenerate, and a later tick arms it.
          # `gh api` writes its error body to stdout, so `|| echo ""` would
          # capture the JSON as if it were a SHA and the emptiness check would
          # pass a blob straight into the comparison. Take the value only when
          # the call actually succeeded.
          pr_parent=""
          if parent_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/release-please--branches--main" \
                             --jq '.parents[0].sha' 2>/dev/null)"; then
            pr_parent="${parent_sha}"
          fi
          main_head="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq '.sha')"
          if [ -z "${pr_parent}" ]; then
            echo "Could not read the release branch's parent; not arming."
            exit 0
          fi
          if [ "${pr_parent}" != "${main_head}" ]; then
            echo "Release PR #${pr} was generated from ${pr_parent} but main is at ${main_head}."
            echo "It does not yet describe main; leaving it unarmed for this tick."
            exit 0
          fi

          # Pending or failed checks wait: the release PR's own CI completing
          # runs this workflow again (see the workflow_run trigger).
          #
          # `gh pr checks --required` is not sufficient by itself. It exits 0
          # when every check that has *reported* is green, and CI Complete is
          # created only after the rest of the suite. Lint PR Title and Lint
          # PR Body can therefore be green while the check the queue requires
          # does not exist yet. GitHub then rejects the enqueue with
          # `Required status check "CI Complete" is expected`, and the no-jump
          # fallback used to exit 1 under `set -e` (runs 38829059085,
          # 38835253494, 38852526513, 38852756821, and 38927442588 on
          # 2026-10-16). On PR #2744 that refusal landed at 15:52Z; CI
          # Complete did not start until 15:53:44Z.
          #
          # A missing or unfinished CI Complete is the same "not yet" as a
          # pending check: leave the PR unarmed. Do not block this job until
          # the suite finishes. The freshness check above is only true for
          # this tick, and holding the runner would enqueue a PR whose parent
          # is no longer main. The release PR's own CI completion fires this
          # workflow again.
          if ! gh pr checks --repo "${GITHUB_REPOSITORY}" "${pr}" --required; then
            echo "Release PR #${pr}'s required checks have not all passed; not enqueuing yet."
            exit 0
          fi
          # `--json` exits 0 even when a check failed, and exits non-zero when
          # nothing has reported yet. Read the bucket; only "pass" is success.
          ci_complete="pending"
          if checks_json="$(gh pr checks --repo "${GITHUB_REPOSITORY}" "${pr}" --json name,bucket 2>/dev/null)"; then
            if [ -n "${checks_json}" ]; then
              ci_complete="$(jq -r '[.[] | select(.name == "CI Complete") | .bucket] | first // "pending"' <<<"${checks_json}")"
            fi
          fi
          if [ "${ci_complete}" != "pass" ]; then
            echo "Release PR #${pr} has no passing CI Complete check yet (${ci_complete}); not enqueuing yet."
            exit 0
          fi
          echo "Enqueuing #${pr} at the front of the merge queue"
          id="$(gh pr view --repo "${GITHUB_REPOSITORY}" "${pr}" --json id --jq .id)"
          position='"queued at position \(.data.enqueuePullRequest.mergeQueueEntry.position)"'
          # 0: queued. 1: refused for some other reason (for example, the app
          # may not jump the queue). 2: the queue still says a required check
          # has not reported. That last case must not fail the run.
          enqueue_pr() {
            local jump="$1"
            local attempt delay
            for attempt in 1 2 3 4 5; do
              if gh api graphql -f id="${id}" -F jump="${jump}" -f query="${ENQUEUE}" --jq "${position}" >/tmp/enqueue.log 2>&1; then
                cat /tmp/enqueue.log
                return 0
              fi
              if ! grep -q 'is expected' /tmp/enqueue.log; then
                return 1
              fi
              if [ "${attempt}" -eq 5 ]; then
                return 2
              fi
              delay=$((attempt * 5))
              echo "Merge queue has not observed CI Complete yet (attempt ${attempt}); retrying in ${delay}s."
              sleep "${delay}"
            done
            return 2
          }
          if enqueue_pr true; then
            exit 0
          elif [ "$?" -eq 2 ]; then
            echo "Required status check CI Complete has not reported; not enqueuing yet."
            exit 0
          fi
          # Probe, to be settled by its first run (#2715): whether the msn-ci-bot
          # App may jump the queue is unverified. If it may not, the owner grants
          # it; until then a refusal must not stall releases, and an empty
          # queue's back is its front.
          echo "::warning::enqueue with jump refused: $(cat /tmp/enqueue.log)"
          depth="$(gh api graphql -F owner="${GITHUB_REPOSITORY_OWNER}" -F name="${GITHUB_REPOSITORY#*/}" \
                     -f query="${QUEUE_DEPTH}" --jq '.data.repository.mergeQueue.entries.totalCount')"
          if [ "${depth}" -ne 0 ]; then
            echo "::notice::${depth} PR(s) queued; enqueuing #${pr} behind them would eject it. Waiting."
            exit 0
          fi
          if enqueue_pr false; then
            exit 0
          elif [ "$?" -eq 2 ]; then
            echo "Required status check CI Complete has not reported; not enqueuing yet."
            exit 0
          fi
          cat /tmp/enqueue.log
          exit 1

      # Belt and braces: the guard above is a heuristic about branch
      # parentage evaluated when auto-merge is armed, so it cannot see a
      # commit that lands between arming and the queue taking the PR. CI's
      # `Release Notes` job closes that window by running the same check on
      # the merge-queue tree; this is the last word, on the tag itself.
      - name: Verify the tag's contents match its changelog entry
        if: steps.release.outputs.release_created
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG_NAME: ${{ steps.release.outputs.tag_name }}
        run: |
          set -euo pipefail
          # This job deliberately performs no checkout (see the workflow_run
          # note above), so fetch just what the check reads.
          tmp="$(mktemp -d)"
          git clone --quiet --filter=blob:none "https://github.com/${GITHUB_REPOSITORY}.git" "${tmp}/repo"
          cd "${tmp}/repo"
          git fetch --quiet --tags
          python3 scripts/check-release-notes.py "${TAG_NAME}"

      - name: Output release info
        if: steps.release.outputs.release_created
        env:
          TAG_NAME: ${{ steps.release.outputs.tag_name }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          echo "Release created: ${TAG_NAME}"
          echo "Version: ${VERSION}"

