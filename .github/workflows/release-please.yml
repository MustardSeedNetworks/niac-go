# =============================================================================
# Release Please - Automated Version Management
# =============================================================================
# Creates release PRs with changelogs when commits land on main.
# When a release PR is merged, creates a GitHub release which triggers
# release.yml for building packages (via version tag).
#
# Trigger pattern (shared with seed, stem, niac):
#   - workflow_run on CI completion: real trigger; gated on success
#   - workflow_dispatch: manual debug / force trigger
#
# Versioning behaviour is driven by .github/release-please-config.json
# and .github/.release-please-manifest.json so that release-please knows
# the current version and applies the same changelog grouping across
# all three projects.
# =============================================================================

name: Release Please

on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    # Only run if CI workflow succeeded (or this is a manual dispatch).
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    name: Release Please
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Run Release Please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          # niac uses the built-in GITHUB_TOKEN, not a fine-grained PAT. The
          # MustardSeedNetworks org forbids fine-grained PATs whose lifetime is
          # > 366 days, and rejects them at API-call time. That hard-fails
          # release-please when RELEASE_PLEASE_TOKEN holds such a token: the
          # `|| GITHUB_TOKEN` fallback never fires because the secret IS set
          # (just rejected), so `||` keeps the rejected token.
          #
          # Trade-off: a GITHUB_TOKEN-authored tag does not fire release.yml's
          # `push: tags: v*` trigger (GitHub's anti-recursion policy), so the
          # release build is kicked manually / via workflow_dispatch for now.
          # The longer-term fleet token strategy (a GitHub App token, which
          # stem uses) is tracked separately — niac deliberately diverges here
          # to keep release-please green without an org-forbidden PAT.
          token: ${{ secrets.GITHUB_TOKEN }}
          # NOTE: do NOT pass release-type here. It is declared per-package in
          # release-please-config.json (release-type: go). Passing it as a
          # direct action input forces a mode that ignores the config-file's
          # per-package options — including bump-minor-pre-major /
          # bump-patch-for-minor-pre-major — which made release-please
          # propose a 1.0.0 major bump off a pre-1.0 breaking change on seed
          # (#1602). We are pre-alpha and stay on 0.x; the config governs
          # versioning.
          config-file: .github/release-please-config.json
          manifest-file: .github/.release-please-manifest.json

      - name: Output release info
        if: steps.release.outputs.release_created
        env:
          TAG_NAME: ${{ steps.release.outputs.tag_name }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          echo "Release created: ${TAG_NAME}"
          echo "Version: ${VERSION}"

  trigger-release:
    name: Trigger Release Build
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger release workflow
        env:
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        run: |
          echo "Release ${TAG_NAME} created"
          echo "The release.yml workflow will be triggered by the new tag"
