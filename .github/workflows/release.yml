# =============================================================================
# Release (goreleaser)
# =============================================================================
# Canonical release pipeline. Drives .goreleaser.yml inside the
# goreleaser-cross container for Linux + macOS (one Linux runner
# cross-compiles both). Windows is the one platform NOT cross-compiled:
# build-windows runs natively on windows-latest/windows-11-arm so
# gopacket/pcap gets real CGO linked against the Npcap SDK. goreleaser's
# only OSS-legal way to import an already-built binary (the `prebuilt`
# builder) is Pro-only, so the resulting .exe is archived/checksummed/
# SBOM'd/signed by hand and appended to the same release in the
# `goreleaser` job — see build-windows below and .goreleaser.yml.
#
# Triggers:
#   - push to a v* tag: real release — builds, signs, publishes, generates
#     SLSA L3 provenance
#   - workflow_dispatch: snapshot only — no publish, signing, or provenance;
#     artifacts are uploaded for inspection
#   - workflow_dispatch with provenance_only=true (ref=<existing tag>):
#     skips goreleaser entirely, recomputes artifact subjects from the
#     already-published checksums.txt on that tag's GitHub release, then
#     runs attest-build-provenance + uploads the .intoto.jsonl. Used to
#     retroactively attest tags that shipped before the provenance job
#     existed. provenance_only skips the snapshot jobs.
#
# Toolchain notes:
#   The goreleaser-cross Docker image ships:
#     - gcc + gcc-aarch64-linux-gnu (Linux cross)
#     - osxcross + macOS SDK (Darwin cross)
#   It is NOT used for Windows anymore (see above). libpcap-dev:arm64 is
#   apt-installed at the start because the cross image doesn't ship libpcap
#   headers per target arch.
#
# Known limitation:
#   macOS .pkg installer is not produced (no native pkgbuild from Linux).
#   macOS users get the .tar.gz; deploy/macos/build-pkg.sh stays in-tree
#   for anyone who wants to assemble one locally.
# =============================================================================

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      provenance_only:
        description: "Backfill: skip build, recompute subjects from the existing release's checksums.txt, attest + upload bundle"
        type: boolean
        default: false
      target_tag:
        description: "Backfill target tag (e.g. v0.94.0). Required when provenance_only=true — workflow_dispatch must be issued against main since older tags don't have these inputs."
        type: string
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write # cosign keyless OIDC
  attestations: write

jobs:
  # =========================================================================
  # UI build — done outside the goreleaser-cross container because that
  # image is Go-focused and doesn't ship Node. Vite writes directly into
  # internal/api/ui/; the next job inherits the workspace.
  # =========================================================================
  build-ui:
    name: Build UI
    if: ${{ !inputs.provenance_only }}
    runs-on: ubuntu-latest
    outputs:
      ui_hash: ${{ steps.ui-hash.outputs.hash }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26.5.0"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Set up npm
        run: npm install --global npm@12.0.1

      - name: Build UI
        run: |
          cd ui
          npm ci
          npm run build

      - name: Compute UI build hash
        id: ui-hash
        run: |
          UI_BUILD_HASH=$(find internal/api/ui -type f -exec md5sum {} \; | sort | md5sum | cut -d' ' -f1)
          echo "hash=$UI_BUILD_HASH" >> "$GITHUB_OUTPUT"

      - name: Upload UI dist
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ui-dist
          path: internal/api/ui/
          retention-days: 1
          include-hidden-files: true

  # =========================================================================
  # Windows build — native GitHub Windows runners, CGO_ENABLED=1 linked
  # against the Npcap SDK, so gopacket/pcap gets real packet-capture cgo on
  # Windows instead of the old CGO_ENABLED=0 cross-compile from
  # goreleaser-cross (which can produce a Windows binary but not one that
  # can open a live capture). goreleaser-cross's Linux container has no
  # path to a Windows cgo toolchain linked against Npcap, so this has to
  # run on real Windows hardware. The goreleaser job downloads the built
  # .exe and archives/checksums/SBOMs/signs it by hand (goreleaser's
  # `prebuilt` builder, the OSS-legal way to import one, is Pro-only —
  # see .goreleaser.yml), so it still lands on the same release as
  # everything else.
  #
  # Toolchain per arch:
  #   - amd64 (windows-latest): MSYS2 MINGW64 gcc — the long-established
  #     pattern for gopacket/pcap + Npcap SDK on Windows (mingw's ld reads
  #     the SDK's MS-COFF import .libs directly).
  #   - arm64 (windows-11-arm): MSYS2 CLANGARM64 clang — windows-11-arm has
  #     no native ARM64 MinGW/gcc toolchain; CLANGARM64 is MSYS2's native
  #     ARM64-host environment. This combination (cgo + clang + Npcap SDK
  #     .lib on native Windows ARM64) is not a well-trodden path — treat it
  #     as unproven until the first green CI run.
  # =========================================================================
  build-windows:
    name: build windows/${{ matrix.goarch }}
    if: ${{ !inputs.provenance_only }}
    needs: [build-ui]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            goarch: amd64
            npcap_lib: x64
            msystem: MINGW64
            msys_packages: mingw-w64-x86_64-gcc
            cc: gcc
          - runner: windows-11-arm
            goarch: arm64
            npcap_lib: ARM64
            msystem: CLANGARM64
            # CLANGARM64 has no "-toolchain" meta-package like MINGW64 does;
            # mingw-w64-clang-aarch64-clang pulls in headers/crt/winpthreads
            # as pacman dependencies.
            msys_packages: mingw-w64-clang-aarch64-clang
            cc: clang
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-go

      - name: Download UI dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ui-dist
          path: internal/api/ui/

      - name: Install MSYS2 (${{ matrix.msystem }})
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2.32.0
        with:
          msystem: ${{ matrix.msystem }}
          install: ${{ matrix.msys_packages }}
          # Windows PATH (Go, git, etc.) must be visible from inside the
          # MSYS2 shell alongside the toolchain's own /mingw64 or
          # /clangarm64 bin dir, or `go build` below can't find `go`.
          path-type: inherit

      - name: Download + verify Npcap SDK
        shell: bash
        env:
          NPCAP_SDK_VERSION: "1.16"
          # SHA-256 of npcap-sdk-1.16.zip, computed locally from
          # https://npcap.com/dist/npcap-sdk-1.16.zip (upstream publishes
          # no checksum file). Rotate this together with the version.
          NPCAP_SDK_SHA256: "f0a8be7778ee3ae1b99bbbecb27a3ff0f6c111a4093f1c78c5c5a099607184db"
        run: |
          set -euo pipefail
          curl -sSfL -o npcap-sdk.zip \
            "https://npcap.com/dist/npcap-sdk-${NPCAP_SDK_VERSION}.zip"
          echo "${NPCAP_SDK_SHA256}  npcap-sdk.zip" | sha256sum -c -
          mkdir -p "${RUNNER_TEMP}/npcap-sdk"
          unzip -q npcap-sdk.zip -d "${RUNNER_TEMP}/npcap-sdk"
          rm -f npcap-sdk.zip

      - name: Build niac.exe (CGO + Npcap SDK)
        shell: msys2 {0}
        env:
          GOOS: windows
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "1"
          CC: ${{ matrix.cc }}
          NPCAP_LIB_DIR: ${{ matrix.npcap_lib }}
          UI_BUILD_HASH: ${{ needs.build-ui.outputs.ui_hash }}
          REF_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          sdk="$(cygpath -u "${RUNNER_TEMP}")/npcap-sdk"
          export CGO_CFLAGS="-I${sdk}/Include"
          export CGO_LDFLAGS="-L${sdk}/Lib/${NPCAP_LIB_DIR}"
          version="${REF_NAME#v}"
          build_time="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          pkg="github.com/MustardSeedNetworks/niac-go/internal/version"
          go build -trimpath -buildvcs=false \
            -ldflags "-s -w -X ${pkg}.Version=${version} -X ${pkg}.Commit=${COMMIT_SHA} -X ${pkg}.BuildTime=${build_time} -X ${pkg}.UIBuildHash=${UI_BUILD_HASH}" \
            -o niac.exe ./cmd/niac
          # gopacket/pcap's cgo directives reference pcap.h and -lwpcap, so a
          # successful build already proves the Npcap SDK headers/libs were
          # found and linked — this just makes that assertion explicit and
          # fails loud if a future change silently drops back to
          # CGO_ENABLED=0 (e.g. a go.mod change reintroducing a pure-Go pcap
          # shim).
          go version -m niac.exe | grep -q 'CGO_ENABLED=1'

      - name: Upload niac.exe
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: niac-windows-${{ matrix.goarch }}
          path: niac.exe
          retention-days: 1

  # =========================================================================
  # goreleaser build + publish — runs inside goreleaser-cross container
  # so all cross-compile toolchains are present.
  # =========================================================================
  goreleaser:
    name: goreleaser ${{ github.event_name == 'workflow_dispatch' && '(snapshot)' || '(release)' }}
    if: ${{ !inputs.provenance_only }}
    runs-on: ubuntu-latest
    needs: [build-ui, build-windows]
    container:
      # Docker Hub tag scheme: <go-version>-<goreleaser-version>. Pin so
      # behaviour stays reproducible; bump via dependabot when newer revs
      # land. Kept fresh so the image's baked Multi-Arch:same libs
      # (libsystemd0, …) stay aligned with ubuntu-ports — a stale image
      # drifts and breaks the arm64 libpcap install.
      image: goreleaser/goreleaser-cross:v1.26.4-v2.17.0
    outputs:
      # base64-encoded SHA-256 hashes of all release artifacts, formatted
      # for slsa-github-generator's base64-subjects input. Set only on a
      # real (non-snapshot) release.
      hashes: ${{ steps.hashes.outputs.hashes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Mark workspace as safe (container runs as root)
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install libpcap headers for amd64 + arm64
        # goreleaser-cross ships compilers but not libpcap headers. gopacket/pcap
        # needs pcap.h + libpcap.so (and its transitive link deps: libdbus-1-3,
        # libibverbs, …) for cgo, per target arch.
        #
        # The image is Ubuntu-based and already carries ubuntu-ports for the
        # non-amd64 architectures, so adding arm64 and installing the full
        # libpcap-dev:arm64 package pulls every arm64 link dependency from the
        # container's own (trusted) sources — no hand-written source list or
        # keyring. This only resolves cleanly when the image's baked amd64 libs
        # match ubuntu-ports (Multi-Arch:same lockstep), which is why the image
        # pin above is kept current. `apt-get update` runs strict so a future
        # drift fails loud instead of silently shipping a broken cross-build.
        shell: bash
        run: |
          set -euo pipefail
          dpkg --add-architecture arm64
          apt-get update
          apt-get install -y libpcap-dev libpcap-dev:arm64 zip

      - name: Download UI dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ui-dist
          path: internal/api/ui/

      - name: Download natively-built Windows binaries
        # build-windows compiled these on real Windows runners with CGO +
        # the Npcap SDK — goreleaser-cross can't produce them (see
        # .goreleaser.yml), so they're packaged by hand below instead of
        # through a goreleaser build/archive pipe.
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: niac-windows-*
          path: windows-raw/

      - name: Install Syft (SBOM) inside container
        env:
          SYFT_VERSION: "1.46.0"
          # SHA-256 of syft_1.46.0_linux_amd64.tar.gz from the upstream
          # syft_1.46.0_checksums.txt. Rotate this together with
          # SYFT_VERSION on upgrade. Mirrors the pinned+checksummed gitleaks
          # install pattern in ci.yml — never pipe an installer script
          # straight to a shell.
          SYFT_SHA256: "d654f678b709eb53c393d38519d5ed7d2e57205529404018614cfefa0fb2b5ca"
        # Container run steps default to `sh` (dash), which rejects
        # `set -o pipefail`; force bash (present in goreleaser-cross).
        shell: bash
        run: |
          set -euo pipefail
          # Download + extract under /tmp, never in the repo tree — goreleaser
          # aborts on a dirty git state, and a stray ./syft or ./syft.tar.gz
          # left in the checkout would trip it.
          curl -sSfL -o /tmp/syft.tar.gz \
            "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/syft_${SYFT_VERSION}_linux_amd64.tar.gz"
          echo "${SYFT_SHA256}  /tmp/syft.tar.gz" | sha256sum -c -
          tar -xzf /tmp/syft.tar.gz -C /tmp syft
          install -m 0755 /tmp/syft /usr/local/bin/syft
          rm -f /tmp/syft.tar.gz /tmp/syft

      - name: Install Cosign inside container
        run: |
          COSIGN_VERSION=v2.4.1
          curl -sSfL -o /usr/local/bin/cosign "https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}/cosign-linux-amd64"
          chmod +x /usr/local/bin/cosign

      - name: Install GitHub CLI inside container
        if: ${{ github.event_name == 'push' }}
        # goreleaser-cross has no gh CLI; needed below to upload the
        # hand-packaged Windows archives to the release goreleaser just
        # published. Pinned + checksummed tarball, same pattern as Syft.
        env:
          GH_CLI_VERSION: "2.96.0"
          GH_CLI_SHA256: "83d5c2ccad5498f58bf6368acb1ab32588cf43ab3a4b1c301bf36328b1c8bd60"
        shell: bash
        run: |
          set -euo pipefail
          curl -sSfL -o /tmp/gh.tar.gz \
            "https://github.com/cli/cli/releases/download/v${GH_CLI_VERSION}/gh_${GH_CLI_VERSION}_linux_amd64.tar.gz"
          echo "${GH_CLI_SHA256}  /tmp/gh.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gh.tar.gz -C /tmp "gh_${GH_CLI_VERSION}_linux_amd64/bin/gh"
          install -m 0755 "/tmp/gh_${GH_CLI_VERSION}_linux_amd64/bin/gh" /usr/local/bin/gh
          rm -rf /tmp/gh.tar.gz "/tmp/gh_${GH_CLI_VERSION}_linux_amd64"

      - name: Run goreleaser (snapshot/dry-run)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          UI_BUILD_HASH: ${{ needs.build-ui.outputs.ui_hash }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: goreleaser release --snapshot --clean --skip=publish,sign,announce

      - name: Run goreleaser (publish)
        if: ${{ github.event_name == 'push' }}
        env:
          UI_BUILD_HASH: ${{ needs.build-ui.outputs.ui_hash }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: goreleaser release --clean

      - name: Package Windows archives
        # goreleaser can't build these (see .goreleaser.yml), so replicate
        # its windows-archive convention by hand: same
        # "niac-{version}-windows-{arch}" naming and file set as the
        # linux/darwin archives, built from the build-windows binaries
        # downloaded above. Written into dist/ — which goreleaser just
        # populated and won't touch again this run — so these artifacts
        # ride along with everything else from here on (dry-run's
        # inspection bundle, the real run's SBOM/sign/upload below).
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          set -euo pipefail
          if [ "${DRY_RUN}" = "true" ]; then
            version="0.0.0-dryrun-$(git rev-parse --short HEAD)"
          else
            version="${REF_NAME#v}"
          fi
          for goarch in amd64 arm64; do
            stage="niac-${version}-windows-${goarch}"
            rm -rf "${stage}"
            mkdir -p "${stage}/templates"
            cp "windows-raw/niac-windows-${goarch}/niac.exe" "${stage}/niac.exe"
            cp README.md LICENSE "${stage}/"
            cp -r cmd/niac/templates/. "${stage}/templates/"
            cp deploy/windows/build.ps1 "${stage}/install.ps1"
            ( cd "${stage}" && zip -qr "../dist/${stage}.zip" . )
            rm -rf "${stage}"
          done

      - name: SBOM, sign, and publish Windows archives
        # Mirrors what goreleaser's sboms/signs/checksum config does for the
        # linux/darwin archives (same syft args, same cosign invocation),
        # then appends to the checksums.txt the goreleaser step above
        # already uploaded to the release and re-signs + re-uploads it so
        # it stays the single authoritative manifest for every platform.
        if: ${{ github.event_name == 'push' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${REF_NAME#v}"
          cd dist
          for goarch in amd64 arm64; do
            artifact="niac-${version}-windows-${goarch}.zip"
            SYFT_FILE_METADATA_CATALOGER_ENABLED=true \
              syft "${artifact}" --output "spdx-json=${artifact}.sbom.json"
            cosign sign-blob --yes --bundle "${artifact}.cosign.bundle" "${artifact}"
            sha256sum "${artifact}" >> checksums.txt
          done
          # checksums.txt now covers every platform; the entries goreleaser
          # signed already point at stale content, so re-sign + re-upload
          # the merged file rather than leaving two conflicting bundles.
          cosign sign-blob --yes --bundle checksums.txt.cosign.bundle checksums.txt
          gh release upload "${REF_NAME}" --clobber --repo "${GITHUB_REPOSITORY}" \
            "niac-${version}-windows-amd64.zip" "niac-${version}-windows-amd64.zip.sbom.json" "niac-${version}-windows-amd64.zip.cosign.bundle" \
            "niac-${version}-windows-arm64.zip" "niac-${version}-windows-arm64.zip.sbom.json" "niac-${version}-windows-arm64.zip.cosign.bundle" \
            checksums.txt checksums.txt.cosign.bundle

      - name: Capture artifact hashes for SLSA provenance
        if: ${{ github.event_name == 'push' }}
        id: hashes
        shell: bash
        run: |
          # dist/checksums.txt is already in "<sha256>  <filename>" form —
          # exactly the slsa-github-generator subject-checksums format —
          # and by this point in the job includes the Windows archives
          # appended above alongside goreleaser's own linux/darwin
          # archives and Linux packages, so this is the full, final
          # subject list for the release.
          set -euo pipefail
          echo "hashes=$(base64 -w0 dist/checksums.txt)" >> "$GITHUB_OUTPUT"

      - name: Upload dry-run artifact bundle for inspection
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: goreleaser-dryrun-${{ github.run_id }}
          path: dist/
          retention-days: 14

  # =========================================================================
  # niac-content package (workstream L3a) — the sanitized SNMP walk corpus
  # as a standalone, arch-neutral deb/rpm. The corpus lives in the private
  # MustardSeedNetworks/niac-demo-catalog repo, reachable only when the
  # CONTENT_REPO_DEPLOY_KEY secret (a read-only deploy key on that repo) is
  # set.
  #
  # RESILIENCE: every real step is gated on HAS_CONTENT_KEY. With no key the
  # whole job is a green no-op, so the core release (the `goreleaser` job
  # above) is entirely unaffected — you simply don't get a niac-content
  # package. It runs its own .goreleaser.content.yml with release.mode=append,
  # so on a real release it adds packages to the release the core job already
  # created; it never touches the core artifacts.
  #
  # UNVALIDATED end-to-end until a release runs with the key set. The nfpm
  # deb/rpm build itself is validated; the corpus deploy-key checkout and the
  # append-to-release upload run for the first time in CI here.
  # =========================================================================
  niac-content:
    name: niac-content package
    if: ${{ !inputs.provenance_only }}
    runs-on: ubuntu-latest
    needs: [goreleaser]
    container:
      # Reuse the pinned goreleaser-cross image so goreleaser is already
      # present at the exact version the core job uses. No cross toolchain is
      # needed (this is a data-only meta package), but version parity beats
      # installing a second goreleaser.
      image: goreleaser/goreleaser-cross:v1.26.4-v2.17.0
    env:
      # Job-level env CAN reference secrets; step-level `if` CAN reference the
      # env context. This indirection is required because a job-level `if:`
      # cannot reference `secrets` directly.
      HAS_CONTENT_KEY: ${{ secrets.CONTENT_REPO_DEPLOY_KEY != '' }}
    steps:
      - name: Report whether the content deploy key is present
        run: |
          if [ "$HAS_CONTENT_KEY" = "true" ]; then
            echo "CONTENT_REPO_DEPLOY_KEY present — building niac-content."
          else
            echo "::notice::CONTENT_REPO_DEPLOY_KEY not set — skipping niac-content package. Core release is unaffected."
          fi

      - name: Checkout niac-go
        if: env.HAS_CONTENT_KEY == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Mark workspace as safe (container runs as root)
        if: env.HAS_CONTENT_KEY == 'true'
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install corpus-checkout + bundle prerequisites
        if: env.HAS_CONTENT_KEY == 'true'
        # goreleaser-cross is Go-focused; make sure ssh (deploy-key checkout),
        # python3 and make (bundle generation) are present.
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends openssh-client python3 make

      - name: Checkout sanitized walk corpus (read-only deploy key)
        if: env.HAS_CONTENT_KEY == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: MustardSeedNetworks/niac-demo-catalog
          ssh-key: ${{ secrets.CONTENT_REPO_DEPLOY_KEY }}
          path: .content-corpus
          fetch-depth: 1

      - name: Generate content bundle
        if: env.HAS_CONTENT_KEY == 'true'
        # `make content-bundle` writes dist/niac-content-<version>.tar.gz; copy
        # it to the fixed name the content config expects, at the repo root so
        # goreleaser's `--clean` (which only wipes dist/) can't delete it.
        shell: bash
        run: |
          set -euo pipefail
          make content-bundle CONTENT_CORPUS=.content-corpus/walks/sanitized
          cp dist/niac-content-*.tar.gz niac-content-bundle.tar.gz

      - name: Build niac-content packages (snapshot/dry-run)
        if: ${{ env.HAS_CONTENT_KEY == 'true' && github.event_name == 'workflow_dispatch' }}
        run: goreleaser release --config .goreleaser.content.yml --snapshot --clean --skip=publish,sign,announce

      - name: Build + append niac-content packages (release)
        if: ${{ env.HAS_CONTENT_KEY == 'true' && github.event_name == 'push' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: goreleaser release --config .goreleaser.content.yml --clean

      - name: Upload dry-run niac-content packages for inspection
        if: ${{ env.HAS_CONTENT_KEY == 'true' && github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: niac-content-dryrun-${{ github.run_id }}
          path: dist/
          retention-days: 14

  # =========================================================================
  # SLSA provenance backfill — recomputes the subject list from a tag's
  # already-published checksums.txt instead of running goreleaser. Used
  # to retroactively attest tags that shipped before the provenance job
  # existed. Only fires under workflow_dispatch with provenance_only=true;
  # on a push or normal dispatch this job is skipped and the regular
  # `goreleaser` job feeds the provenance job.
  # =========================================================================
  goreleaser-backfill-hashes:
    name: goreleaser (backfill subjects from existing release)
    if: ${{ inputs.provenance_only }}
    runs-on: ubuntu-latest
    outputs:
      # Same base64-subjects contract as the goreleaser job's `hashes`
      # output. Provenance job picks whichever upstream produced one.
      hashes: ${{ steps.hashes.outputs.hashes }}
    steps:
      - name: Download checksums.txt from existing release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_TAG: ${{ inputs.target_tag }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$TARGET_TAG" ]; then
            echo "::error::provenance_only=true requires target_tag to identify which existing release to attest"
            exit 1
          fi
          gh release download "$TARGET_TAG" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern 'checksums.txt' \
            --dir .
          echo "checksums.txt contents:"
          cat checksums.txt

      - name: Convert checksums.txt to base64 subjects
        id: hashes
        shell: bash
        run: |
          # checksums.txt is the standard goreleaser format:
          #   <sha256>  <filename>
          # The attest-build-provenance `subject-checksums` input takes
          # exactly that format. We base64-encode here so the output
          # contract matches the goreleaser job's `hashes` output.
          set -euo pipefail
          hashes=$(base64 -w0 < checksums.txt)
          echo "hashes=${hashes}" >> "$GITHUB_OUTPUT"

  # =========================================================================
  # SLSA L3 provenance — runs on real releases (not dry-run).
  #
  # Uses GitHub's first-party `actions/attest-build-provenance` rather than
  # the slsa-github-generator reusable workflow, matching seed/stem.
  # attest-build-provenance produces a signed in-toto attestation (Sigstore
  # keyless OIDC), surfaces it on the release's GitHub Attestations panel,
  # AND attaches the bundle file to the release as a downloadable asset.
  #
  # Two upstream paths feed this job (only one runs per invocation):
  #   - normal release:  needs.goreleaser produces subjects from the final
  #                      dist/checksums.txt (goreleaser's own archives/
  #                      packages plus the hand-packaged Windows archives)
  #   - provenance_only: needs.goreleaser-backfill-hashes produces subjects
  #                      from the existing release's checksums.txt
  # =========================================================================
  provenance:
    name: SLSA provenance
    # Skip on dry-run snapshots; require one of the two upstreams to have
    # succeeded. `!cancelled()` lets this job run even though one of the
    # two `needs` is intentionally skipped per dispatch path.
    if: ${{ !cancelled() && (github.event_name == 'push' || inputs.provenance_only) && (needs.goreleaser.result == 'success' || needs.goreleaser-backfill-hashes.result == 'success') }}
    needs: [goreleaser, goreleaser-backfill-hashes]
    runs-on: ubuntu-latest
    permissions:
      id-token: write       # Sigstore OIDC signing
      contents: write       # uploading the bundle to the release
      attestations: write   # GitHub Attestations API
    steps:
      - name: Decode artifact subjects
        id: subjects
        shell: bash
        run: |
          set -euo pipefail
          # Pick whichever upstream ran. The unused one is empty.
          echo "${{ needs.goreleaser.outputs.hashes || needs.goreleaser-backfill-hashes.outputs.hashes }}" \
            | base64 -d > subjects.txt
          echo "Subjects:"
          cat subjects.txt

      - name: Generate SLSA build-provenance attestation
        id: attest
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-checksums: subjects.txt

      - name: Attach attestation bundle to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_TAG: ${{ inputs.target_tag || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          cp "${{ steps.attest.outputs.bundle-path }}" \
             niac-slsa-provenance.intoto.jsonl
          gh release upload "$TARGET_TAG" \
             niac-slsa-provenance.intoto.jsonl --clobber --repo "${GITHUB_REPOSITORY}"
