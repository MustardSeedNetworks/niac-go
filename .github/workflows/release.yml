# =============================================================================
# Release
# =============================================================================
# Release Please owns versioning, changelog PRs, tags, and GitHub releases.
# This workflow runs when a v* tag exists and attaches native NIAC artifacts to
# that release. No Docker, no container image, no cross-build container:
# GitHub builds on native Linux, macOS, and Windows runners.
# =============================================================================

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Snapshot build only - do not publish release assets"
        type: boolean
        default: true
      provenance_only:
        description: "Backfill: attest an existing release from its checksums.txt"
        type: boolean
        default: false
      target_tag:
        description: "Backfill target tag, for example v0.91.0"
        type: string
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build-ui:
    name: Build UI
    if: ${{ !inputs.provenance_only }}
    runs-on: ubuntu-latest
    outputs:
      ui_hash: ${{ steps.ui-hash.outputs.hash }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "26.3.0"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Build UI
        run: |
          cd ui
          npm ci
          npm run build

      - name: Compute UI build hash
        id: ui-hash
        run: |
          UI_BUILD_HASH=$(find internal/api/ui -type f -exec md5sum {} \; | sort | md5sum | cut -d' ' -f1)
          echo "hash=$UI_BUILD_HASH" >> "$GITHUB_OUTPUT"

      - name: Upload UI dist
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ui-dist
          path: internal/api/ui/
          retention-days: 1
          include-hidden-files: true

  build-native:
    name: Build ${{ matrix.artifact }}
    if: ${{ !inputs.provenance_only }}
    needs: [build-ui]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - artifact: niac-linux-amd64
            runner: ubuntu-latest
            goos: linux
            goarch: amd64
            cgo: "1"
            archive: tar
          - artifact: niac-linux-arm64
            runner: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
            cgo: "1"
            archive: tar
          - artifact: niac-darwin-arm64
            runner: macos-14
            goos: darwin
            goarch: arm64
            cgo: "1"
            archive: tar
          - artifact: niac-windows-amd64
            runner: windows-latest
            goos: windows
            goarch: amd64
            cgo: "0"
            archive: zip
            ext: .exe
          - artifact: niac-windows-arm64
            runner: windows-11-arm
            goos: windows
            goarch: arm64
            cgo: "0"
            archive: zip
            ext: .exe
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v6.1.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Linux packet capture headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libpcap-dev

      - name: Download UI dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ui-dist
          path: internal/api/ui/

      - name: Build binary
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: ${{ matrix.cgo }}
          UI_BUILD_HASH: ${{ needs.build-ui.outputs.ui_hash }}
          EXT: ${{ matrix.ext }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME:-snapshot}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="snapshot"
          fi
          COMMIT="$(git rev-parse --short HEAD)"
          BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          mkdir -p dist "${{ matrix.artifact }}"
          go build -trimpath -buildvcs=false \
            -ldflags="-s -w \
              -X github.com/MustardSeedNetworks/niac-go/internal/version.Version=${VERSION} \
              -X github.com/MustardSeedNetworks/niac-go/internal/version.Commit=${COMMIT} \
              -X github.com/MustardSeedNetworks/niac-go/internal/version.BuildTime=${BUILD_TIME} \
              -X github.com/MustardSeedNetworks/niac-go/internal/version.UIBuildHash=${UI_BUILD_HASH}" \
            -o "${{ matrix.artifact }}/niac${EXT:-}" ./cmd/niac
          cp README.md LICENSE "${{ matrix.artifact }}/"
          mkdir -p "${{ matrix.artifact }}/templates"
          cp -R cmd/niac/templates/. "${{ matrix.artifact }}/templates/"
          if [ "${{ matrix.goos }}" = "linux" ]; then
            mkdir -p "${{ matrix.artifact }}/systemd"
            cp deploy/systemd/niac.service "${{ matrix.artifact }}/systemd/"
          fi
          if [ "${{ matrix.goos }}" = "darwin" ]; then
            mkdir -p "${{ matrix.artifact }}/launchd"
            cp deploy/launchd/com.niac.plist deploy/launchd/install.sh deploy/launchd/uninstall.sh "${{ matrix.artifact }}/launchd/"
          fi
          if [ "${{ matrix.goos }}" = "windows" ]; then
            cp deploy/windows/build.ps1 "${{ matrix.artifact }}/install.ps1"
          fi

      - name: Package tarball
        if: matrix.archive == 'tar'
        shell: bash
        run: tar -czf "dist/${{ matrix.artifact }}.tar.gz" "${{ matrix.artifact }}"

      - name: Package zip
        if: matrix.archive == 'zip'
        shell: pwsh
        run: Compress-Archive -Path "${{ matrix.artifact }}" -DestinationPath "dist/${{ matrix.artifact }}.zip" -Force

      - name: Upload archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: dist/*
          retention-days: 14

      # Raw binaries feed the package job: linux ones drive nfpm (deb/rpm), and
      # every platform's binary is scanned by syft for an SBOM (richer than an
      # archive scan and avoids unarchiving). Native build, no cross-compile.
      - name: Upload raw binary for packaging
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: niacbin-${{ matrix.goos }}-${{ matrix.goarch }}
          path: ${{ matrix.artifact }}/niac${{ matrix.ext }}
          retention-days: 1

  # Central packaging with standalone OSS tools (no goreleaser — its prebuilt
  # builder is Pro-only). nfpm builds .deb/.rpm from the natively-built linux
  # binaries (nfpm is goreleaser's own deb/rpm engine), syft produces SBOMs,
  # cosign keyless-signs every artifact. release-please owns the GitHub release;
  # this job only attaches assets to it.
  package:
    name: Package + sign
    if: ${{ !inputs.provenance_only }}
    needs: [build-native]
    runs-on: ubuntu-latest
    outputs:
      hashes: ${{ steps.hashes.outputs.hashes }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Download archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: niac-*
          path: dist
          merge-multiple: true

      - name: Download raw binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: niacbin-*
          path: prebuilt

      - name: Install nfpm
        run: |
          set -euo pipefail
          NFPM_VERSION=2.43.0
          curl -sSfL "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz" \
            | tar -xz -C /usr/local/bin nfpm
          nfpm --version

      - name: Install Syft (SBOM)
        run: curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin

      - name: Install Cosign
        run: |
          set -euo pipefail
          COSIGN_VERSION=v2.4.1
          curl -sSfL -o /usr/local/bin/cosign "https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}/cosign-linux-amd64"
          chmod +x /usr/local/bin/cosign

      - name: Build .deb / .rpm (nfpm), SBOMs (syft), checksums
        id: hashes
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="0.0.0-dryrun"
          else
            VERSION="${REF_NAME#v}"
          fi
          export VERSION

          # .deb + .rpm for each linux arch from the native binary. nfpm does not
          # expand env vars in contents.src, so render the config placeholders
          # (ARCH/VERSION/BINARY) with sed per arch.
          for arch in amd64 arm64; do
            bin="prebuilt/niacbin-linux-${arch}/niac"
            test -f "$bin"
            chmod +x "$bin"
            sed -e "s|\${ARCH}|${arch}|g" \
                -e "s|\${VERSION}|${VERSION}|g" \
                -e "s|\${BINARY}|${bin}|g" \
                deploy/nfpm/nfpm.yaml > "nfpm.${arch}.yaml"
            nfpm package -f "nfpm.${arch}.yaml" -p deb -t dist/
            nfpm package -f "nfpm.${arch}.yaml" -p rpm -t dist/
          done

          # SBOM per platform, scanned from the Go binary (richer module data
          # than an archive scan, and avoids unarchiving the windows .zip).
          for d in prebuilt/niacbin-*; do
            [ -d "$d" ] || continue
            plat="${d#prebuilt/niacbin-}"   # e.g. linux-amd64
            binpath=$(ls "$d"/niac*)
            syft scan "file:${binpath}" -o spdx-json="dist/niac-${plat}.sbom.json"
          done

          # SHA-256 checksums over the user-facing artifacts (archives + packages).
          ( cd dist && sha256sum *.tar.gz *.zip *.deb *.rpm > checksums.txt )
          cat dist/checksums.txt

          # base64 subjects for SLSA provenance (standard "<sha256>  <name>" format).
          hashes=$(base64 -w0 < dist/checksums.txt)
          echo "hashes=${hashes}" >> "$GITHUB_OUTPUT"

      - name: Sign all artifacts (cosign keyless)
        shell: bash
        run: |
          set -euo pipefail
          for f in dist/*; do
            case "$f" in
              *.cosign.bundle) continue ;;
            esac
            cosign sign-blob --yes --bundle "${f}.cosign.bundle" "$f"
          done

      - name: Upload dry-run artifact bundle for inspection
        if: inputs.dry_run
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-dryrun-${{ github.run_id }}
          path: dist/
          retention-days: 14

      - name: Attach assets to the release-please release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: gh release upload "${GITHUB_REF_NAME}" dist/* --clobber --repo "${GITHUB_REPOSITORY}"

  backfill-hashes:
    name: Backfill subjects from existing release
    if: ${{ inputs.provenance_only }}
    runs-on: ubuntu-latest
    outputs:
      hashes: ${{ steps.hashes.outputs.hashes }}
    steps:
      - name: Download checksums.txt from existing release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_TAG: ${{ inputs.target_tag }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$TARGET_TAG" ]; then
            echo "::error::provenance_only=true requires target_tag"
            exit 1
          fi
          gh release download "$TARGET_TAG" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern 'checksums.txt' \
            --dir .

      - name: Convert checksums.txt to base64 subjects
        id: hashes
        shell: bash
        run: |
          set -euo pipefail
          hashes=$(base64 -w0 < checksums.txt)
          echo "hashes=${hashes}" >> "$GITHUB_OUTPUT"

  provenance:
    name: SLSA provenance
    if: ${{ !inputs.dry_run && !cancelled() && (needs.package.result == 'success' || needs.backfill-hashes.result == 'success') }}
    needs: [package, backfill-hashes]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      attestations: write
    steps:
      - name: Decode artifact subjects
        shell: bash
        run: |
          set -euo pipefail
          echo "${{ needs.package.outputs.hashes || needs.backfill-hashes.outputs.hashes }}" | base64 -d > subjects.txt
          cat subjects.txt

      - name: Generate SLSA build-provenance attestation
        id: attest
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-checksums: subjects.txt

      - name: Attach attestation bundle to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_TAG: ${{ inputs.target_tag || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          cp "${{ steps.attest.outputs.bundle-path }}" niac-slsa-provenance.intoto.jsonl
          gh release upload "$TARGET_TAG" niac-slsa-provenance.intoto.jsonl --clobber --repo "${GITHUB_REPOSITORY}"
