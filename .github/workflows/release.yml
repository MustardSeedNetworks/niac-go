# =============================================================================
# NIAC Release Workflow
# =============================================================================
# Triggered on version tags (v*)
# Builds multi-platform binaries with SBOM and cosign signatures
# =============================================================================

name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  id-token: write  # Required for cosign OIDC signing

jobs:
  # ===========================================================================
  # Build Release Binaries
  # ===========================================================================
  build:
    name: Build (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            name: linux-amd64
          - goos: linux
            goarch: arm64
            name: linux-arm64
          - goos: darwin
            goarch: amd64
            name: darwin-amd64
          - goos: darwin
            goarch: arm64
            name: darwin-arm64
          - goos: windows
            goarch: amd64
            name: windows-amd64
            ext: .exe
          - goos: freebsd
            goarch: amd64
            name: freebsd-amd64

    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '25'
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json

      - name: Build frontend
        run: |
          cd ui
          npm ci
          npm run build
          cd ..
          rm -rf pkg/api/ui/*
          cp -r ui/dist/* pkg/api/ui/

      - name: Get version
        id: version
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          OUTPUT="niac-${VERSION}-${{ matrix.name }}${{ matrix.ext }}"
          go build -trimpath \
            -ldflags="-s -w -X main.version=${VERSION}" \
            -o "${OUTPUT}" ./cmd/niac
          ls -lh "${OUTPUT}"

      - name: Generate checksum
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          OUTPUT="niac-${VERSION}-${{ matrix.name }}${{ matrix.ext }}"
          sha256sum "${OUTPUT}" > "${OUTPUT}.sha256"

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: niac-${{ matrix.name }}
          path: |
            niac-*-${{ matrix.name }}${{ matrix.ext }}
            niac-*-${{ matrix.name }}${{ matrix.ext }}.sha256

  # ===========================================================================
  # Generate SBOM
  # ===========================================================================
  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Get version
        id: version
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT

      - name: Generate SBOM (CycloneDX)
        uses: anchore/sbom-action@v0
        with:
          artifact-name: niac-${{ steps.version.outputs.VERSION }}-sbom.cyclonedx.json
          output-file: niac-${{ steps.version.outputs.VERSION }}-sbom.cyclonedx.json
          format: cyclonedx-json

      - name: Upload SBOM
        uses: actions/upload-artifact@v6
        with:
          name: sbom
          path: "*.cyclonedx.json"

  # ===========================================================================
  # Create GitHub Release
  # ===========================================================================
  release:
    name: Create Release
    needs: [build, sbom]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Get version
        id: version
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT

      - name: Download all artifacts
        uses: actions/download-artifact@v6
        with:
          path: artifacts

      - name: Prepare release files
        run: |
          mkdir -p release
          find artifacts -type f -exec cp {} release/ \;
          ls -lh release/

      - name: Install Cosign for signing
        uses: sigstore/cosign-installer@v3

      - name: Sign release artifacts with cosign (keyless OIDC)
        run: |
          cd release
          for file in niac-* *.cyclonedx.json; do
            if [ -f "${file}" ] && [[ ! "${file}" == *.sha256 ]] && [[ ! "${file}" == *.cosign.bundle ]]; then
              echo "Signing ${file}..."
              cosign sign-blob --yes --bundle "${file}.cosign.bundle" "${file}"
            fi
          done

      - name: Generate combined checksums
        run: |
          cd release
          sha256sum niac-* *.cyclonedx.json 2>/dev/null | grep -v '.sha256' | grep -v '.cosign.bundle' > checksums.txt || true
          cat checksums.txt

      - name: Extract changelog
        id: changelog
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          if [ -f CHANGELOG.md ]; then
            sed -n "/## \[${VERSION#v}\]/,/## \[/p" CHANGELOG.md | sed '$ d' > /tmp/release_notes.md
            if [ ! -s /tmp/release_notes.md ]; then
              echo "Release ${VERSION}" > /tmp/release_notes.md
            fi
          else
            echo "Release ${VERSION}" > /tmp/release_notes.md
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          body_path: /tmp/release_notes.md
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ===========================================================================
  # Test Release Binaries
  # ===========================================================================
  test-release:
    name: Test (${{ matrix.os }})
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact: linux-amd64
          - os: macos-latest
            artifact: darwin-arm64
          - os: windows-latest
            artifact: windows-amd64

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v6
        with:
          name: niac-${{ matrix.artifact }}

      - name: Make binary executable (Unix)
        if: runner.os != 'Windows'
        run: chmod +x niac-*

      - name: Test binary (Unix)
        if: runner.os != 'Windows'
        run: ./niac-* --help || ./niac-* version || echo "Binary executes"

      - name: Test binary (Windows)
        if: runner.os == 'Windows'
        run: |
          $binary = Get-ChildItem -Filter "niac-*.exe" | Select-Object -First 1
          & $binary.FullName --help
        shell: pwsh
