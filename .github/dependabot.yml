version: 2
updates:
  # Go module updates (project root)
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
      include: scope
    groups:
      go-deps:
        patterns: ["*"]

  # GitHub Actions used by all workflows
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(ci)"
      include: scope
    groups:
      gh-actions:
        patterns: ["*"]

  # npm packages for the embedded React/Vite UI
  #
  # Major bumps for the build toolchain (TypeScript, Vite, jsdom, etc.) are
  # out of scope for dependabot — they're tied to project policy in CLAUDE.md
  # (e.g. TypeScript pinned to 5.9.x) and tend to need code changes. We
  # ignore them here so the weekly batch only ships safe minor / patch
  # updates; major upgrades happen in dedicated, hand-driven PRs.
  - package-ecosystem: npm
    directory: /ui
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(ui-deps)"
      include: scope
    groups:
      ui-deps:
        patterns: ["*"]
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vite"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitejs/plugin-react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "jsdom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "rollup-plugin-visualizer"
        update-types: ["version-update:semver-major"]
      - dependency-name: "lucide-react"
        update-types: ["version-update:semver-major"]

  # Keep the Dockerfile base images (node, golang, debian) up to date.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
      include: scope
