name: 'Install apt packages (bounded, retried)'
description: >-
  Installs apt packages with bounded network timeouts and retries on
  transient mirror failures. Works both on hosted runners (sudo) and inside
  root containers that have no sudo binary (e.g. release.yml's
  goreleaser-cross image). Can also retry a non-apt install command (e.g.
  `npx playwright install-deps ...`) that needs the same bounded-timeout
  treatment because it shells out to apt itself.
inputs:
  packages:
    description: 'Space-separated apt package list to install. Ignored when `command` is set.'
    required: false
    default: ''
  apt-args:
    description: 'Extra flags for apt-get install, e.g. --no-install-recommends.'
    required: false
    default: ''
  command:
    description: >-
      Full command to retry instead of the default `apt-get update &&
      apt-get install -y <packages>`. Runs without a sudo prefix — use for
      installers (e.g. Playwright's install-deps) that already manage their
      own privilege escalation.
    required: false
    default: ''
  sudo:
    description: >-
      Prefix apt/dpkg commands with sudo. Set to 'false' inside containers
      that already run as root and have no sudo binary.
    required: false
    default: 'true'
  timeout-seconds:
    description: 'Bound on each install attempt, in seconds, before it is killed and retried.'
    required: false
    default: '120'
  label:
    description: 'Short name used in the failure message, e.g. "libpcap-dev".'
    required: false
    default: 'packages'
runs:
  using: composite
  steps:
    - name: Install ${{ inputs.label }}
      shell: bash
      env:
        PACKAGES: ${{ inputs.packages }}
        APT_ARGS: ${{ inputs['apt-args'] }}
        OVERRIDE_CMD: ${{ inputs.command }}
        USE_SUDO: ${{ inputs.sudo }}
        TIMEOUT_SECONDS: ${{ inputs['timeout-seconds'] }}
        LABEL: ${{ inputs.label }}
      run: |
        set -euo pipefail
        SUDO=""
        if [ "${USE_SUDO}" = "true" ]; then
          SUDO="sudo"
        fi

        # packages.microsoft.com intermittently serves an unsigned/invalid
        # InRelease that aborts `apt-get update` for the whole runner, even
        # when the packages being installed come from the Ubuntu archive
        # (killed Lighthouse/#928 + Security Scanning/#932). Drop the unused
        # Microsoft apt source so a broken third-party mirror can't red the
        # job. No-op when the source doesn't exist (e.g. container images).
        ${SUDO} grep -rlZ packages.microsoft.com /etc/apt/sources.list.d/ 2>/dev/null | xargs -0 -r ${SUDO} rm -f || true

        # A stalled Ubuntu mirror can hang apt for the whole job budget
        # without installing anything, because apt waits forever on a dead
        # connection by default. Bound apt's own network waits, then retry
        # the transient case below.
        ${SUDO} tee /etc/apt/apt.conf.d/99-ci-timeouts >/dev/null <<'EOF'
        Acquire::http::Timeout "20";
        Acquire::https::Timeout "20";
        Acquire::Retries "2";
        DPkg::Lock::Timeout "60";
        EOF

        for i in 1 2 3; do
          if [ "$i" -gt 1 ]; then
            # A timeout kill can leave dpkg half-configured; recover first.
            ${SUDO} dpkg --configure -a >/dev/null 2>&1 || true
          fi
          if [ -n "${OVERRIDE_CMD}" ]; then
            # The override command manages its own privilege escalation
            # (e.g. `npx playwright install-deps`), so it never gets a sudo
            # prefix here.
            if timeout -k 15 "${TIMEOUT_SECONDS}" bash -c "${OVERRIDE_CMD}"; then
              exit 0
            fi
          else
            if timeout -k 15 "${TIMEOUT_SECONDS}" ${SUDO} sh -c "apt-get update && apt-get install -y ${APT_ARGS} ${PACKAGES}"; then
              exit 0
            fi
          fi
          echo "install attempt $i failed; retrying in $((i * 5))s..."
          sleep $((i * 5))
        done
        echo "::error::${LABEL} install failed after 3 attempts"
        exit 1
