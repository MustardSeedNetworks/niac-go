# Display: Juniper EX4300-48T
# Description: 48-port 1G access switch with 4×10G uplinks, Junos. LLDP only (no CDP). Good campus access switch baseline.
# Type: switch
# Vendor: juniper
# Tags: juniper, switch, ex, ex4300, access

devices:
  - name: ex4300-48t-01
    type: switch
    mac: "00:0C:29:01:01:01"
    ips:
      - "10.0.11.1"

    icmp:
      enabled: true
      ttl: 64

    interfaces:
      - name: "ge-0/0/0"
        type: ethernet
        mtu: 1500
        speed: 1000
        duplex: full
        admin_status: up
        oper_status: up

    lldp:
      enabled: true
      system_description: "Juniper Networks, Inc. ex4300-48t, version 21.4R3, kernel JUNOS 21.4R3"
      port_description: "ge-0/0/0"
      ttl: 120

    snmp_agent:
      enabled: true
      community: "public"
      sysdescr: "Juniper Networks, Inc. ex4300-48t, version 21.4R3"
      syscontact: "noc@example.com"
      syslocation: "Campus Building B"

    stp:
      enabled: true
      bridge_priority: 32768

    properties:
      sysObjectID: "1.3.6.1.4.1.2636.1.1.1.2.71"
      vendor: "juniper"
      model: "EX4300-48T"
      os: "Junos"
      ports: "48 × 1G + 4 × 10G SFP+"
