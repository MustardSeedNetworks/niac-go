# Display: Juniper SRX340
# Description: Branch / SMB stateful firewall — 16 × 1G + 2 × 10G SFP+, Junos. UTM-capable. Good for perimeter sims at branch sites.
# Type: firewall
# Vendor: juniper
# Tags: juniper, firewall, srx, srx340, branch

devices:
  - name: srx340-fw-01
    type: firewall
    mac: "00:0C:29:03:01:01"
    ips:
      - "10.0.41.1"

    icmp:
      enabled: true
      ttl: 64

    interfaces:
      - name: "ge-0/0/0"
        type: ethernet
        mtu: 1500
        speed: 1000
        duplex: full
        admin_status: up
        oper_status: up

    lldp:
      enabled: true
      system_description: "Juniper Networks, Inc. srx340, version 21.4R3, kernel JUNOS 21.4R3"
      port_description: "ge-0/0/0"
      ttl: 120

    snmp_agent:
      enabled: true
      community: "public"
      sysdescr: "Juniper Networks, Inc. srx340, version 21.4R3"
      syscontact: "secops@example.com"
      syslocation: "Branch Office 12 DMZ"

    properties:
      sysObjectID: "1.3.6.1.4.1.2636.1.1.1.2.92"
      vendor: "juniper"
      model: "SRX340"
      os: "Junos"
      ports: "16 × 1G + 2 × 10G SFP+"
