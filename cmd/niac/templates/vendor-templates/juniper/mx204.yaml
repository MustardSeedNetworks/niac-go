# Display: Juniper MX204
# Description: Compact 1U universal routing platform — 4×100G QSFP28 + 8×10G SFP+, Junos. Provider edge / metro aggregation use cases.
# Type: router
# Vendor: juniper
# Tags: juniper, router, mx, mx204, edge, 100g

devices:
  - name: mx204-pe-01
    type: router
    mac: "00:0C:29:02:01:01"
    ips:
      - "10.0.31.1"
      - "203.0.113.10"

    icmp:
      enabled: true
      ttl: 64

    interfaces:
      - name: "et-0/0/0"
        type: ethernet
        mtu: 1500
        speed: 100000
        duplex: full
        admin_status: up
        oper_status: up

    lldp:
      enabled: true
      system_description: "Juniper Networks, Inc. mx204, version 22.4R2, kernel JUNOS 22.4R2"
      port_description: "et-0/0/0"
      ttl: 120

    snmp_agent:
      enabled: true
      community: "public"
      sysdescr: "Juniper Networks, Inc. mx204, version 22.4R2"
      syscontact: "noc@example.com"
      syslocation: "Metro POP 03"

    properties:
      sysObjectID: "1.3.6.1.4.1.2636.1.1.1.2.57"
      vendor: "juniper"
      model: "MX204"
      os: "Junos"
      ports: "4 × 100G QSFP28 + 8 × 10G SFP+"
