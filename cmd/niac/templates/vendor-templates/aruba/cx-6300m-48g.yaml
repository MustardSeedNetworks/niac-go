# Display: Aruba CX 6300M-48G
# Description: 48 × 1G + 4 × 25G stackable campus switch. AOS-CX, LLDP only (no CDP), strong NetEdit / fabric story.
# Type: switch
# Vendor: aruba
# Tags: aruba, switch, cx, cx6300, access, aoscx

devices:
  - name: cx6300m-48g-01
    type: switch
    mac: "70:3A:0E:01:01:01"
    ips:
      - "10.0.12.1"

    icmp:
      enabled: true
      ttl: 64

    interfaces:
      - name: "1/1/1"
        type: ethernet
        mtu: 1500
        speed: 1000
        duplex: full
        admin_status: up
        oper_status: up

    lldp:
      enabled: true
      system_description: "Aruba JL663A 6300M 48G CL4 PoE 4SFP56 Swch, AOS-CX 10.13.1000"
      port_description: "1/1/1"
      ttl: 120

    snmp_agent:
      enabled: true
      community: "public"
      sysdescr: "Aruba 6300M 48G PoE 4SFP56 Switch, AOS-CX 10.13.1000"
      syscontact: "noc@example.com"
      syslocation: "Campus Building C"

    stp:
      enabled: true
      bridge_priority: 32768

    properties:
      sysObjectID: "1.3.6.1.4.1.47196.4.1.1.3.123"
      vendor: "aruba"
      model: "JL663A 6300M-48G"
      os: "AOS-CX"
      ports: "48 × 1G PoE+ + 4 × 25G SFP56"
