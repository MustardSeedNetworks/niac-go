# Display: Aruba Instant AP-505 (Wi-Fi 6)
# Description: Indoor Wi-Fi 6 access point, instant/cluster-managed or Aruba Central. LLDP only toward the switch.
# Type: access-point
# Vendor: aruba
# Tags: aruba, access-point, wifi6, iap505, instant

devices:
  - name: iap-505-01
    type: access-point
    mac: "70:3A:0E:02:01:01"
    ips:
      - "10.0.52.10"

    icmp:
      enabled: true
      ttl: 64

    interfaces:
      - name: "eth0"
        type: ethernet
        mtu: 1500
        speed: 2500
        duplex: full
        admin_status: up
        oper_status: up

    lldp:
      enabled: true
      system_description: "Aruba AP-505 (RW), ArubaOS 8.11.1.0"
      port_description: "eth0"
      ttl: 120

    snmp_agent:
      enabled: true
      community: "public"
      sysdescr: "Aruba AP-505, ArubaOS 8.11.1.0"
      syscontact: "wifi@example.com"
      syslocation: "Floor 2 SE"

    properties:
      sysObjectID: "1.3.6.1.4.1.14823.1.2.96"
      vendor: "aruba"
      model: "AP-505"
      os: "ArubaOS"
      radios: "2.4 GHz, 5 GHz"
