# Display: Cisco Catalyst 9300-48P
# Description: Stackable access switch with 48 PoE+ ports and 4×10G uplinks. Speaks CDP+LLDP, runs IOS XE. Good starting point for campus access-layer simulations.
# Type: switch
# Vendor: cisco
# Tags: cisco, switch, catalyst, c9300, access, poe

devices:
  - name: cat9300-48p-01
    type: switch
    mac: "00:1B:2C:01:01:01"
    ips:
      - "10.0.10.1"

    icmp:
      enabled: true
      ttl: 255

    interfaces:
      - name: "GigabitEthernet1/0/1"
        type: ethernet
        mtu: 1500
        speed: 1000
        duplex: full
        admin_status: up
        oper_status: up

    lldp:
      enabled: true
      system_description: "Cisco IOS XE Software, C9300-48P, Version 17.9.3"
      port_description: "GigabitEthernet1/0/1"
      ttl: 120

    cdp:
      enabled: true
      platform: "cisco WS-C9300-48P"
      software_version: "Cisco IOS XE Software, Version 17.09.03"
      port_id: "GigabitEthernet1/0/1"
      holdtime: 180

    snmp_agent:
      enabled: true
      community: "public"
      sysdescr: "Cisco IOS Software, Catalyst L3 Switch Software (CAT9K_IOSXE), Version 17.9.3"
      syscontact: "noc@example.com"
      syslocation: "Campus Building A"

    stp:
      enabled: true
      bridge_priority: 32768

    properties:
      sysObjectID: "1.3.6.1.4.1.9.1.2697"
      vendor: "cisco"
      model: "C9300-48P"
      os: "IOS-XE"
      ports: "48 × 1G PoE+ + 4 × 10G SFP+"
