# Display: Cisco ASA 5525-X
# Description: Mid-range stateful firewall / NGFW with 8× GigE data ports. ASA OS, CDP enabled, no STP. Good baseline for perimeter / DMZ simulations.
# Type: firewall
# Vendor: cisco
# Tags: cisco, firewall, asa, perimeter, ngfw

devices:
  - name: asa5525-fw-01
    type: firewall
    mac: "00:1B:2C:04:01:01"
    ips:
      - "10.0.40.1"

    icmp:
      enabled: true
      ttl: 255

    interfaces:
      - name: "GigabitEthernet0/0"
        type: ethernet
        mtu: 1500
        speed: 1000
        duplex: full
        admin_status: up
        oper_status: up

    lldp:
      enabled: true
      system_description: "Cisco Adaptive Security Appliance Software Version 9.18(3)"
      port_description: "GigabitEthernet0/0"
      ttl: 120

    cdp:
      enabled: true
      platform: "cisco ASA5525-X"
      software_version: "Cisco Adaptive Security Appliance Software Version 9.18(3)"
      port_id: "GigabitEthernet0/0"
      holdtime: 180

    snmp_agent:
      enabled: true
      community: "public"
      sysdescr: "Cisco Adaptive Security Appliance Version 9.18(3)"
      syscontact: "secops@example.com"
      syslocation: "DMZ"

    properties:
      sysObjectID: "1.3.6.1.4.1.9.1.1408"
      vendor: "cisco"
      model: "ASA5525-X"
      os: "ASA"
      ports: "8 × 1G"
