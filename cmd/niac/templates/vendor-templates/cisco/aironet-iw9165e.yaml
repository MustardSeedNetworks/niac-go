# Display: Cisco Catalyst IW-9165E (Wi-Fi 6E)
# Description: Outdoor / industrial Wi-Fi 6E access point with mesh + URWB. Two 2.5GbE PoE ports, CAPWAP-managed. Speaks CDP+LLDP toward the wired switch.
# Type: access-point
# Vendor: cisco
# Tags: cisco, access-point, wifi6e, industrial, iw9165, mesh

devices:
  - name: iw9165e-ap-01
    type: access-point
    mac: "00:1B:2C:05:01:01"
    ips:
      - "10.0.50.10"

    icmp:
      enabled: true
      ttl: 64

    interfaces:
      - name: "GigabitEthernet0"
        type: ethernet
        mtu: 1500
        speed: 5000
        duplex: full
        admin_status: up
        oper_status: up

    lldp:
      enabled: true
      system_description: "Cisco Catalyst IW-9165E Wi-Fi 6E Access Point, IOS XE 17.13.1"
      port_description: "GigabitEthernet0"
      ttl: 120

    cdp:
      enabled: true
      platform: "cisco IW-9165E-B-K9"
      software_version: "Cisco IOS XE Software, Version 17.13.01"
      port_id: "GigabitEthernet0"
      holdtime: 180

    snmp_agent:
      enabled: true
      community: "public"
      sysdescr: "Cisco AP Software, ap1g8, Version 17.13.1"
      syscontact: "wifi@example.com"
      syslocation: "Outdoor Yard A"

    properties:
      sysObjectID: "1.3.6.1.4.1.9.1.3120"
      vendor: "cisco"
      model: "IW-9165E-B-K9"
      os: "IOS-XE-AP"
      radios: "2.4 GHz, 5 GHz, 6 GHz"
      uplink: "2 × 2.5G PoE+"
