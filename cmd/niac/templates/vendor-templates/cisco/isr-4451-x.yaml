# Display: Cisco ISR 4451-X
# Description: Integrated Services Router for branch / WAN edge. 4× GigE WAN + service modules, IOS XE, routing + CDP + LLDP, no L2 STP.
# Type: router
# Vendor: cisco
# Tags: cisco, router, isr, branch, wan

devices:
  - name: isr4451-edge-01
    type: router
    mac: "00:1B:2C:03:01:01"
    ips:
      - "10.0.30.1"
      - "203.0.113.1"

    icmp:
      enabled: true
      ttl: 255

    interfaces:
      - name: "GigabitEthernet0/0/0"
        type: ethernet
        mtu: 1500
        speed: 1000
        duplex: full
        admin_status: up
        oper_status: up

    lldp:
      enabled: true
      system_description: "Cisco IOS XE Software, ISR4451-X/K9, Version 17.9.4"
      port_description: "GigabitEthernet0/0/0"
      ttl: 120

    cdp:
      enabled: true
      platform: "cisco ISR4451-X/K9"
      software_version: "Cisco IOS XE Software, Version 17.09.04"
      port_id: "GigabitEthernet0/0/0"
      holdtime: 180

    snmp_agent:
      enabled: true
      community: "public"
      sysdescr: "Cisco IOS Software [Cupertino], ISR Software (X86_64_LINUX_IOSD-UNIVERSALK9-M), Version 17.9.4"
      syscontact: "noc@example.com"
      syslocation: "Branch Office 12"

    properties:
      sysObjectID: "1.3.6.1.4.1.9.1.1903"
      vendor: "cisco"
      model: "ISR4451-X/K9"
      os: "IOS-XE"
      ports: "4 × 1G WAN + NIM/SM service slots"
