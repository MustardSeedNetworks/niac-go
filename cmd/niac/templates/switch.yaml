# Display: L2/L3 Switch
# Description: Single switch persona with STP, VLAN tagging, LLDP and CDP. Good for sanity-checking spanning-tree and discovery tooling against a simulated bridge.
# Type: switch
# Tags: stp, vlan, lldp, cdp

devices:
  - name: access-switch-01
    type: switch
    mac: "00:1B:2C:3D:4E:01"
    ips:
      - "10.0.1.10"

    # Basic protocols
    icmp:
      enabled: true

    # Discovery
    interfaces:
      - name: "GigabitEthernet1/0/1"
        type: ethernet
        mtu: 1500
        speed: 1000
        duplex: full
        admin_status: up
        oper_status: up

    lldp:
      enabled: true
      system_description: "Cisco Catalyst 9300"
      port_description: "GigabitEthernet1/0/1"
      ttl: 120

    cdp:
      enabled: true
      platform: "Cisco Catalyst 9300-48P"
      software_version: "IOS XE 17.6.3"
      port_id: "GigabitEthernet1/0/1"
      holdtime: 180

    # Spanning Tree Protocol
    stp:
      enabled: true
      bridge_priority: 32768

    # SNMP
    snmp_agent:
      enabled: true
      community: "public"
      sysname: "access-switch-01"
      sysdescr: "Cisco Catalyst 9300 Switch"
      syslocation: "Building A - Floor 2 - IDF"
      syscontact: "netops@example.com"
