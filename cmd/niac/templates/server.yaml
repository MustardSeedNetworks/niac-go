# Display: Application Server (DHCP/DNS/HTTP)
# Description: Three-server persona — DHCP server handing out leases, DNS server resolving a small zone, and an HTTP server with a couple of endpoints. The shape monitoring tools expect from a multi-service host.
# Type: server
# Tags: dhcp, dns, http

devices:
  - name: server-01
    type: server
    mac: "00:1D:2E:3F:4A:01"
    ips:
      - "10.0.0.10"

    # Basic protocols
    icmp:
      enabled: true

    # LLDP
    interfaces:
      - name: "eth0"
        type: ethernet
        mtu: 1500
        speed: 1000
        duplex: full
        admin_status: up
        oper_status: up

    lldp:
      enabled: true
      system_description: "Ubuntu 22.04 LTS"
      port_description: "eth0"
      ttl: 120

    # SNMP
    snmp_agent:
      enabled: true
      community: "public"
      sysname: "server-01"
      sysdescr: "Ubuntu 22.04.3 LTS"
      syslocation: "Data Center A - Rack 5"
      syscontact: "sysadmin@example.com"

      traps:
        enabled: true
        receivers:
          - "10.0.0.100:162"
        cold_start:
          enabled: true
          on_startup: true
        link_state:
          enabled: true
          link_down: true
          link_up: true

    # DHCP Server
    dhcp:
      router: "10.0.0.1"
      domain_name_server: "10.0.0.10"

    # DNS Server
    dns:
      forward_records:
        - name: "server-01.example.local"
          ip: "10.0.0.10"
        - name: "router.example.local"
          ip: "10.0.0.1"
      reverse_records:
        - ip: "10.0.0.10"
          name: "server-01.example.local"

    # HTTP Server
    http:
      enabled: true
      server_name: "nginx/1.24.0"
      endpoints:
        - path: "/"
          body: "<html><body><h1>Server 01</h1><p>Services: DHCP, DNS, HTTP</p></body></html>"
        - path: "/status"
          body: '{"status": "ok", "services": ["dhcp", "dns", "http"]}'
