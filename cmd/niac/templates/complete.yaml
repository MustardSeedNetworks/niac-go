# Display: Small Office Network (4 devices)
# Description: A complete small-office topology in one config — one router, one switch, one Wi-Fi AP, one application server. Discovery (LLDP/CDP) wires them together so tools see a realistic four-device LAN.
# Type: complete
# Tags: lan, snmp, lldp, server

devices:
  - name: core-router
    type: router
    mac: "00:0A:0B:0C:0D:01"
    ips: ["10.0.0.1"]
    icmp: {enabled: true}
    interfaces:
      - name: "GigabitEthernet0/1"
        type: ethernet
        mtu: 1500
        speed: 1000
        duplex: full
        admin_status: up
        oper_status: up
    lldp:
      enabled: true
      port_description: "GigabitEthernet0/1"
      ttl: 120
    snmp_agent:
      enabled: true
      community: "public"
      sysname: "core-router"
      sysdescr: "Cisco IOS Router"

  - name: access-switch
    type: switch
    mac: "00:0A:0B:0C:0D:02"
    ips: ["10.0.0.2"]
    icmp: {enabled: true}
    interfaces:
      - name: "GigabitEthernet1/0/1"
        type: ethernet
        mtu: 1500
        speed: 1000
        duplex: full
        admin_status: up
        oper_status: up
    lldp:
      enabled: true
      port_description: "GigabitEthernet1/0/1"
    stp:
      enabled: true
      bridge_priority: 32768

  - name: wifi-ap
    type: ap
    mac: "00:0A:0B:0C:0D:03"
    ips: ["10.0.0.3"]
    icmp: {enabled: true}
    lldp:
      enabled: true

  - name: dhcp-server
    type: server
    mac: "00:0A:0B:0C:0D:04"
    ips: ["10.0.0.10"]
    icmp: {enabled: true}
    dhcp:
      router: "10.0.0.1"
      domain_name_server: "10.0.0.10"
    dns:
      forward_records:
        - {name: "router.lab.local", ip: "10.0.0.1"}
        - {name: "switch.lab.local", ip: "10.0.0.2"}
