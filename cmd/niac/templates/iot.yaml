# Display: IoT Sensor
# Description: Lightweight IoT endpoint — answers ARP and ICMP, no SNMP, no fancy stack. Realistic shape for camera/sensor-class devices you'd find on a building network.
# Type: basic
# Tags: iot, minimal

devices:
  - name: iot-sensor-01
    type: host
    mac: "00:1E:2F:3A:4B:01"
    ips:
      - "10.0.3.100"

    # Basic protocols only
    icmp:
      enabled: true

    # Minimal LLDP
    interfaces:
      - name: "eth0"
        type: ethernet
        mtu: 1500
        speed: 1000
        duplex: full
        admin_status: up
        oper_status: up

    lldp:
      enabled: true
      system_description: "Temperature/Humidity Sensor"
      port_description: "eth0"
      ttl: 300

    # Simple HTTP API
    http:
      enabled: true
      server_name: "IoTDevice/1.0"
      endpoints:
        - path: "/"
          body: '{"device": "sensor-01", "type": "temp-humidity"}'
        - path: "/data"
          body: '{"temp": 22.5, "humidity": 45}'
