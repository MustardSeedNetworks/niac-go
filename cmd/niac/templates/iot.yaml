# Display: IoT Sensor
# Description: Lightweight IoT endpoint — answers ARP and ICMP, no SNMP, no fancy stack. Realistic shape for camera/sensor-class devices you'd find on a building network.
# Type: basic
# Tags: iot, minimal

devices:
  - name: iot-sensor-01
    type: host
    mac: "00:1E:2F:3A:4B:01"
    ips:
      - "10.0.3.100"

    # Basic protocols only
    arp:
      enabled: true
    icmp:
      enabled: true

    # Minimal LLDP
    lldp:
      enabled: true
      system_name: "IoT Sensor 01"
      system_description: "Temperature/Humidity Sensor"
      chassis_id: "00:1E:2F:3A:4B:01"
      port_id: "eth0"
      ttl: 300
      capabilities: ["station-only"]

    # Simple HTTP API
    http:
      enabled: true
      server_header: "IoTDevice/1.0"
      endpoints:
        - path: "/"
          content: '{"device": "sensor-01", "type": "temp-humidity"}'
        - path: "/data"
          content: '{"temp": 22.5, "humidity": 45}'
