# Display: Wi-Fi Access Point
# Description: Enterprise AP persona advertising itself via LLDP and answering SNMP for radio/SSID OIDs. Useful when validating wireless management tooling that expects to discover thin APs talking to a controller.
# Type: access-point
# Tags: wireless, snmp, lldp

devices:
  - name: wifi-ap-01
    type: ap
    mac: "00:1C:2D:3E:4F:01"
    ips:
      - "10.0.2.50"

    # Basic protocols
    icmp:
      enabled: true

    # Discovery
    interfaces:
      - name: "GigabitEthernet0"
        type: ethernet
        mtu: 1500
        speed: 1000
        duplex: full
        admin_status: up
        oper_status: up

    lldp:
      enabled: true
      system_description: "Cisco Aironet 9120AX"
      port_description: "GigabitEthernet0"
      ttl: 120
    cdp:
      enabled: true
      platform: "Cisco Aironet 9120AXI"
      software_version: "17.9.4"
      port_id: "GigabitEthernet0"
      holdtime: 180

    # SNMP
    snmp_agent:
      enabled: true
      community: "public"
      sysname: "wifi-ap-01"
      sysdescr: "Cisco Aironet Access Point"
      syslocation: "Building A - Floor 2 - Room 201"
      syscontact: "wireless@example.com"

    # HTTP - Web interface
    http:
      enabled: true
      server_name: "Cisco-IOS"
      endpoints:
        - path: "/"
          body: "<html><body><h1>Cisco Aironet AP</h1></body></html>"
