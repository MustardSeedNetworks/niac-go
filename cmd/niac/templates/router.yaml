# Display: Core Router (full stack)
# Description: One router with the full protocol set — ARP, ICMP, LLDP, CDP, SNMP v2c, plus a couple of test IP addresses. A reasonable single-device baseline for tooling that expects to see a "real" L3 box on the wire.
# Type: router
# Tags: l3, snmp, lldp, cdp

devices:
  - name: core-router-01
    type: router
    mac: "00:1A:2B:3C:4D:01"
    ips:
      - "10.0.0.1"
      - "192.168.1.1"

    # Basic protocols
    icmp:
      enabled: true

    # Discovery protocols
    interfaces:
      - name: "GigabitEthernet0/1"
        type: ethernet
        mtu: 1500
        speed: 1000
        duplex: full
        admin_status: up
        oper_status: up

    lldp:
      enabled: true
      system_description: "Cisco IOS XE 17.3"
      port_description: "GigabitEthernet0/1"
      ttl: 120

    cdp:
      enabled: true
      platform: "Cisco ISR4331"
      software_version: "IOS XE 17.3.5"
      port_id: "GigabitEthernet0/1"
      holdtime: 180

    # SNMP
    snmp_agent:
      enabled: true
      community: "public"
      sysname: "core-router-01"
      sysdescr: "Cisco IOS XE Router"
      syslocation: "Data Center A - Rack 12"
      syscontact: "netops@example.com"

      traps:
        enabled: true
        receivers:
          - "10.0.0.100:162"
        cold_start:
          enabled: true
          on_startup: true
        link_state:
          enabled: true
          link_down: true
          link_up: true
