# The P5-2 routing round-trip: one L3 switch replaying a capture that holds
# BGP4-MIB and OSPF-MIB.
#
# Same layout as brocade-wire.yaml — config in networks/, capture reached
# through `include_path: ../walks` — because that is the base a walk-backed
# device is authored against in the product.
#
# .3 keeps it clear of the brocade device on .2 and of the transit pool the
# hospital suite uses.
include_path: ../walks

networks:
  - name: wire-transit
    subnet: 10.254.200.0/24

attachments:
  - name: tester
    connect: wire-transit

devices:
  - name: wire-router-01
    type: router
    mac: "02:00:00:00:67:01"
    icmp:
      enabled: true
    snmp_agent:
      enabled: true
      community: wire_routing
      walk_file: cisco-c3750-02-r64.walk
    interfaces:
      - name: Ethernet1/1
        type: ethernet
        network: wire-transit
        address: 10.254.200.3/24
