# P5-9: two switches joined over a two-port LACP bundle, the way a core pair
# carries its uplinks. The trunk names the bundle, not a member, so the
# members appear in IF-MIB only through the port-channel.
#
# .4 and .5 keep clear of brocade-wire.yaml (.2), router-wire.yaml (.3) and
# the transit pool the hospital suite uses.
networks:
  - name: wire-transit
    subnet: 10.254.200.0/24

attachments:
  - name: tester
    connect: wire-transit

devices:
  - name: wire-lag-sw-01
    type: switch
    mac: "02:00:00:00:6a:01"
    ips: [10.254.200.4]
    icmp:
      enabled: true
    snmp_agent:
      enabled: true
      community: wire_lag
      sysname: wire-lag-sw-01
    interfaces:
      - name: Ethernet1/48
        type: ethernet
        network: wire-transit
        address: 10.254.200.4/24
      - name: Ethernet1/1
        type: ethernet
      - name: Ethernet1/2
        type: ethernet
    port_channels:
      - id: 1
        members: [Ethernet1/1, Ethernet1/2]
        mode: active
    trunk_ports:
      - interface: port-channel1
        native_vlan: 1
        remote_device: wire-lag-sw-02
        remote_interface: port-channel1

  - name: wire-lag-sw-02
    type: switch
    mac: "02:00:00:00:6a:02"
    ips: [10.254.200.5]
    icmp:
      enabled: true
    snmp_agent:
      enabled: true
      community: wire_lag
      sysname: wire-lag-sw-02
    interfaces:
      - name: Ethernet1/48
        type: ethernet
        network: wire-transit
        address: 10.254.200.5/24
      - name: Ethernet1/1
        type: ethernet
      - name: Ethernet1/2
        type: ethernet
    port_channels:
      - id: 1
        members: [Ethernet1/1, Ethernet1/2]
        mode: active
    trunk_ports:
      - interface: port-channel1
        native_vlan: 1
        remote_device: wire-lag-sw-01
        remote_interface: port-channel1
