# The P4-4 UPS probe: one APC Network Management Card and one switch on the
# transit network, so the UPS-MIB root is asked of both ends of the
# classification. No pack carries a UPS yet; the weighted-mix slice places them.
#
# .72 and .73 are clear of every other wire fixture and of the transit pool.
networks:
  - name: wire-transit
    subnet: 10.254.200.0/24

attachments:
  - name: tester
    connect: wire-transit

devices:
  - name: wire-ups-01
    type: iot
    mac: "02:00:00:00:69:01"
    icmp:
      enabled: true
    snmp_agent:
      enabled: true
      community: wire_ups
      sysdescr: APC Smart-UPS SRT 3000 with Network Management Card 3, AOS 3.0.3
    properties:
      sysObjectID: 1.3.6.1.4.1.318.1.3.27
      model: Smart-UPS SRT 3000
      software: AOS 3.0.3
    interfaces:
      - name: eth0
        type: ethernet
        network: wire-transit
        address: 10.254.200.72/24
  - name: wire-switch-02
    type: switch
    mac: "02:00:00:00:69:02"
    icmp:
      enabled: true
    snmp_agent:
      enabled: true
      community: wire_ups
    interfaces:
      - name: GigabitEthernet1/0/1
        type: ethernet
        network: wire-transit
        address: 10.254.200.73/24
