# The P4-4 printer probe: one printer and one switch on the transit network, so
# the Printer-MIB root is asked of both ends of the classification. The pack
# printers sit behind the spare-port attachment and this harness still reaches
# only the transit network (niac-go#2335).
#
# .70 and .71 are clear of every other wire fixture and of the transit pool.
networks:
  - name: wire-transit
    subnet: 10.254.200.0/24

attachments:
  - name: tester
    connect: wire-transit

devices:
  - name: wire-printer-01
    type: printer
    mac: "02:00:00:00:68:01"
    icmp:
      enabled: true
    snmp_agent:
      enabled: true
      community: wire_printer
      sysdescr: HP LaserJet Enterprise MFP M634, HP FutureSmart
    interfaces:
      - name: eth0
        type: ethernet
        network: wire-transit
        address: 10.254.200.70/24
  - name: wire-switch-01
    type: switch
    mac: "02:00:00:00:68:02"
    icmp:
      enabled: true
    snmp_agent:
      enabled: true
      community: wire_printer
    interfaces:
      - name: GigabitEthernet1/0/1
        type: ethernet
        network: wire-transit
        address: 10.254.200.71/24
