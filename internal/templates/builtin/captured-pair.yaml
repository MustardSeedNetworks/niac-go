# Captured Pair Template
# Two switches replaying the same capture, told apart by add_mibs
#
# Use Case: build a fleet from one capture without re-capturing per device
# Includes: shared walk_file, per-device add_mibs identity, trunk link
#
# A capture is one device's MIB. Pointing two devices at it is the normal way
# to build a fleet, and the loader already keeps them apart on the values it
# owns -- sysName, the SNMP group, the interface rows it authored. Everything
# else in the capture is served verbatim to both, so anything site-specific
# that a discovery tool reads has to be overridden per device.
#
# See docs/design/2026-09-replay-fidelity-contract.md for exactly which values
# the loader substitutes and which it leaves alone.

include_path: ../walks

devices:
  - name: closet-sw1
    type: switch
    mac: "02:00:00:00:10:01"
    ips:
      - "192.168.20.11"
    trunk_ports:
      - interface: GigabitEthernet1/0/1
        remote_device: closet-sw2
        remote_interface: GigabitEthernet1/0/1

    snmp_agent:
      community: public
      walk_file: brocade-icx6610-24f-01.walk
      add_mibs:
        - oid: 1.3.6.1.2.1.1.6.0
          type: STRING
          value: fixed(Building A, Wiring Closet 1)

  - name: closet-sw2
    type: switch
    mac: "02:00:00:00:10:02"
    ips:
      - "192.168.20.12"
    trunk_ports:
      - interface: GigabitEthernet1/0/1
        remote_device: closet-sw1
        remote_interface: GigabitEthernet1/0/1

    snmp_agent:
      community: public
      walk_file: brocade-icx6610-24f-01.walk
      add_mibs:
        - oid: 1.3.6.1.2.1.1.6.0
          type: STRING
          value: fixed(Building A, Wiring Closet 2)
