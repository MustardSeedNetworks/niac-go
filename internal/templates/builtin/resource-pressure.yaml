    type: server
    mac: "02:00:00:00:ab:02"
    interfaces:
      - name: Ethernet1
        type: ethernet
        network: resource-lan
        address: 10.254.200.12/24
    snmp_agent:
      enabled: true
      community: resource_demo
      sysname: DEMO-APP02
      add_mibs: *resources
behavior_timelines:
  - name: application-resource-pressure
    repeat_count: 1
    phases:
      - name: pressure
        start_offset_ms: 5000
        duration_ms: 15000
        reset: true
        faults:
          - device: DEMO-APP01
            type: cpu_percent
            value: 95
          - device: DEMO-APP01
            type: memory_percent
            value: 90
          - device: DEMO-APP01
            type: disk_percent
            value: 95
