# Resource Pressure Template
# Two application servers with independent resource telemetry.
# Use Case: demonstrate CPU, memory and disk alerts with a healthy control.
# Includes: two processors, 16 GiB RAM, 256 GiB disk, timed faults and reset.
# All inventory is authored, not captured. Both servers start at 25% storage use.
# After five seconds APP01 runs at 95% CPU, 90% RAM and 95% disk for 15 seconds.
# Clearing restores the exact baseline; APP02 stays healthy throughout.

networks:
  - name: resource-lan
    subnet: 10.254.200.0/24
attachments:
  - name: tester
    connect: resource-lan
devices:
  - name: DEMO-APP01
    type: server
    mac: "02:00:00:00:ab:01"
    interfaces:
      - name: Ethernet1
        type: ethernet
        network: resource-lan
        address: 10.254.200.11/24
    snmp_agent:
      enabled: true
      community: resource_demo
      sysname: DEMO-APP01
      add_mibs: &resources
        - oid: 1.3.6.1.2.1.25.3.2.1.1.1
          type: INTEGER
          value: fixed(1)
