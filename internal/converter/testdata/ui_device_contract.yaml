devices:
  - name: contract-sw1
    type: access-point
    mac: 00:11:22:33:44:55
    ips:
      - 10.0.0.1
      - 10.0.0.2
    vlan: 10
    map_to_ip: 10.0.0.9
    snmp_agent:
      community: public
      sysname: contract-sw1
      walk_file: walks/sw1.walk
      walk_files:
        - walks/a.walk
        - walks/b.walk
      add_mibs:
        - oid: 1.3.6.1.2.1.1.1.0
          type: STRING
          value: demo
    dhcp:
      subnet_mask: 255.255.255.0
      router: 10.0.0.254
      domain_name_server: 10.0.0.53
    dns:
      forward_records:
        - name: sw1.example.com
          ip: 10.0.0.1
    lldp:
      enabled: true
      system_description: contract lldp
    cdp:
      enabled: true
      platform: contract-platform
    stp:
      enabled: true
      bridge_priority: 32768
    http:
      enabled: true
      server_name: contract-httpd
    ftp:
      enabled: true
      welcome_banner: |-
        line one
        line two
    netbios:
      enabled: true
      name: CONTRACTSW1
      workgroup: LAB
    interfaces:
      - name: Gi0/1
        speed: 1000
        duplex: full
        admin_status: up
        oper_status: up
        description: 'uplink "quoted" \ and a: colon'
