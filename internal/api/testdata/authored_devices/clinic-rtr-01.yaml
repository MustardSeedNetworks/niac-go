name: clinic-rtr-01
type: router
vendor: cisco
mac_suffix: 1
ips:
  - 10.20.0.1
  - 10.20.99.1
ttl:
  ttl: 255
icmp:
  enabled: true
lldp:
  enabled: true
  system_description: Cisco ISR 1100 clinic edge
  port_description: GigabitEthernet0/0/1
cdp:
  enabled: true
  platform: Cisco ISR1111-4P
  software_version: 17.9.4a
snmp_agent:
  enabled: true
  community: msn_public
  sysname: clinic-rtr-01
  sysdescr: Cisco IOS XE Software, ISR1100 17.9.4a
  syslocation: Clinic branch, comms closet
  syscontact: netops@clinic.example
dhcp:
  pool_start: 10.20.0.100
  pool_end: 10.20.0.199
  subnet_mask: 255.255.255.0
  router: 10.20.0.1
  domain_name_server: 10.20.0.10
  ntp_servers:
    - 10.20.0.10
dns:
  forward_records:
    - name: rtr.clinic.example
      ip: 10.20.0.1
    - name: srv-01.clinic.example
      ip: 10.20.0.10
    - name: srv-02.clinic.example
      ip: 10.20.0.11
interfaces:
  - name: GigabitEthernet0/0/1
    speed: 1000
    duplex: full
    admin_status: up
    oper_status: up
    network: clinic-lan
    address: 10.20.0.1/24
    description: to clinic-sw-01 Gi1/0/24
trunk_ports:
  - interface: GigabitEthernet0/0/1
    remote_device: clinic-sw-01
    remote_interface: GigabitEthernet1/0/24
